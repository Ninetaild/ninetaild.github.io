<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 퀴즈 및 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS 통합 및 압축 (폰트 사이즈/굵기 증가 유지) */
        @import url('https://fonts/googleapis.com/css2?family=Noto+Sans+KR:wght=500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; font-size: 1.05rem; font-weight: 500; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .card { background-color: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); position: relative; }
        .option-button { transition: all 0.2s; border: 2px solid #e5e7eb; min-height: 110px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; padding: 1rem; font-size: 1.0rem; font-weight: 600; }
        .option-button:hover:not(.disabled):not(.correct):not(.incorrect) { background-color: #f3f4f6; border-color: #9ca3af; }
        .correct { background-color: #d1fae5; border-color: #10b981; font-weight: 700; }
        .incorrect { background-color: #fee2e2; border-color: #ef4444; font-weight: 700; }
        .disabled { cursor: not-allowed; opacity: 0.8; }
        #study-grid-container { width: 100%; overflow-x: auto; }
        .study-grid { display: grid; grid-template-columns: 50px repeat(4, minmax(130px, 1fr)); border-left: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb; min-width: 650px; }
        .study-cell { padding: 10px; border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; text-align: center; font-size: 15px; font-weight: 500; height: 55px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.1s; position: relative; }
        .study-cell:hover:not(.header-cell):not(.index-cell) { background-color: #eef2ff; }
        .header-cell { font-weight: 800; background-color: #e5e7eb; color: #1f2937; cursor: pointer; }
        .index-cell { background-color: #eef2ff; font-weight: 700; color: #4f46e5; cursor: default; }
        .study-cell .content { transition: opacity 0.3s; width: 100%; }
        .study-cell.covered .content { opacity: 0; user-select: none; }
        .study-cell.covered:after { content: '확인하기'; position: absolute; color: #4b5563; font-size: 13px; font-weight: 700; }
        .word-detail p { font-size: 0.9rem !important; }
        .word-detail .font-extrabold { font-size: 1.1rem !important; }
        #note-header { font-size: 1.05rem; font-weight: 700; }
        #floating-note-area.minimized #restore-label { font-size: 16px; font-weight: 800; }
        /* 수정된 부분: 한자 링크 스타일을 일반 텍스트와 동일하게 변경 */
        .kanji-link { color: inherit; font-weight: inherit; text-decoration: none; margin: 0 1px; }
        .file-tag { display: inline-flex; align-items: center; padding: 4px 10px; margin: 4px; border-radius: 4px; background-color: #e0f2f1; color: #047857; font-size: 0.9rem; font-weight: 600; }
        .file-tag .remove-file-btn { margin-left: 8px; font-weight: bold; color: #ef4444; background: none; border: none; cursor: pointer; padding: 0; line-height: 1; }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <header class="bg-indigo-700 p-7 mb-6 rounded-xl shadow-2xl text-white">
            <h1 class="text-4xl font-extrabold text-center">일본어 단어 퀴즈 및 학습</h1>
        </header>

        <main id="app-container" class="space-y-6">
            <div id="file-upload-section" class="card">
                <h2 class="text-2xl font-bold mb-5 text-gray-800">1. CSV 학습 자료 관리</h2>

                <div id="input-area" class="space-y-4 p-5 border rounded-lg bg-gray-50">
                    <p class="text-base font-bold text-gray-700">A. GitHub 파일 목록에서 추가</p>
                    <div class="flex space-x-3">
                        <select id="csv-select" class="flex-grow p-3 border rounded-md bg-white text-gray-800 text-base focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="">-- CSV 파일을 선택하세요 --</option>
                            <option value="loading" disabled>파일 목록 로딩 중...</option>
                        </select>
                        <button id="add-selected-file-button" class="px-5 py-3 bg-indigo-600 text-white text-base font-bold rounded-md hover:bg-indigo-700 transition duration-150 disabled:opacity-50" disabled>
                            추가
                        </button>
                    </div>

                    <p class="text-base font-bold text-gray-700 pt-3">B. URL 직접 입력 후 추가</p>
                    <div class="flex space-x-3">
                        <input type="text" id="csv-url-input" 
                            class="flex-grow p-3 border rounded-md bg-white text-gray-800 text-base focus:border-indigo-500 focus:ring-indigo-500" 
                            value=""
                            placeholder="유효한 CSV 파일 URL을 입력하세요">
                        <button id="add-url-file-button" class="px-5 py-3 bg-indigo-600 text-white text-base font-bold rounded-md hover:bg-indigo-700 transition duration-150 disabled:opacity-50" disabled>
                            추가
                        </button>
                    </div>
                </div>
                
                <div class="mt-5 p-5 border rounded-lg bg-white shadow-sm">
                    <h3 class="text-lg font-bold text-gray-700 mb-3">2. 현재 학습 목록 (<span id="file-count">0</span>개 파일)</h3>
                    <div id="loaded-files-container" class="min-h-[60px] p-3 border border-dashed rounded-lg bg-gray-50">
                        <p id="no-files-message" class="text-base text-gray-500 italic font-medium">추가된 학습 파일이 없습니다.</p>
                        </div>
                    <p id="total-word-count" class="text-base text-gray-700 mt-3 font-bold">총 단어 수: 0개 (중복 제거 후)</p>
                </div>

                
                <div class="mt-7 pt-5 border-t flex justify-center space-x-5">
                    <button id="start-study-button" class="px-10 py-4 bg-indigo-500 text-white text-lg font-extrabold rounded-full hover:bg-indigo-600 transition duration-150 disabled:opacity-50" disabled>
                        학습하기 (단어 암기)
                    </button>
                    <button id="start-quiz-button" class="px-10 py-4 bg-indigo-700 text-white text-lg font-extrabold rounded-full hover:bg-indigo-800 transition duration-150 disabled:opacity-50" disabled>
                        퀴즈 시작 (총 20문제)
                    </button>
                </div>
                
                <p id="url-status-message" class="text-sm mt-5 text-center text-gray-600 font-medium"></p>
            </div>

            <div id="study-section" class="hidden">
                <div class="card space-y-5">
                    <h2 class="text-2xl font-bold text-gray-800 text-center">단어 학습 모드</h2>
                    
                    <div class="flex flex-col sm:flex-row justify-between items-center p-4 bg-gray-100 rounded-lg border">
                        <p class="text-base text-gray-700 font-medium mb-2 sm:mb-0">데이터 셀을 클릭하면 해당 셀만, 헤더를 클릭하면 해당 열이 토글됩니다.</p>
                        <div class="space-x-3 flex">
                             <button id="shuffle-study-button" class="px-5 py-2.5 text-base bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition duration-150 shadow-lg">
                                행 순서 섞기
                            </button>
                            <button id="toggle-all-button" class="px-5 py-2.5 text-base bg-blue-600 text-white font-bold rounded-full hover:bg-blue-700 transition duration-150 shadow-lg">
                                모두 가리기
                            </button>
                        </div>
                    </div>

                    <div id="study-grid-container" class="rounded-lg border overflow-hidden shadow-inner bg-white">
                        </div>
                    
                    <div class="text-center pt-5 border-t">
                        <button id="back-to-menu-button" class="px-8 py-3 bg-gray-600 text-white text-base font-bold rounded-full hover:bg-gray-700 transition duration-150">
                            처음으로 돌아가기
                        </button>
                    </div>
                </div>
            </div>

            <div id="quiz-section" class="hidden">
                <div class="card space-y-6">
                    <div>
                        <p id="quiz-progress" class="text-xl font-bold text-indigo-700 mb-5 text-center"></p>
                        <div id="question-card" class="bg-indigo-100 p-8 rounded-lg shadow-xl text-center">
                            <h3 class="text-2xl font-extrabold text-gray-900" id="question-text"></h3>
                        </div>
                    </div>
                    
                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        </div>

                    <div id="feedback-message" class="hidden p-4 rounded-lg text-center font-extrabold text-lg"></div>
                    
                    <div class="text-center">
                        <button id="next-button" class="hidden px-8 py-3 bg-indigo-700 text-white text-lg font-bold rounded-full hover:bg-indigo-800 transition duration-150" disabled>
                            다음 문제
                        </button>
                    </div>
                </div>
            </div>

            <div id="results-section" class="hidden card space-y-6">
                <h2 class="text-3xl font-extrabold text-center text-gray-800">퀴즈 완료! 🎉</h2>
                <div class="text-center space-y-3">
                    <p class="text-xl text-gray-700 font-bold">총 20문제 중:</p>
                    <p id="final-score" class="text-4xl font-extrabold text-indigo-700"></p>
                </div>
                
                <div id="incorrect-answers-summary" class="border-t pt-5">
                    <h3 class="text-xl font-bold text-red-700 mb-4">오답 정리 (복습 필요!)</h3>
                    <ul id="incorrect-list" class="space-y-4">
                        </ul>
                    <p id="no-incorrect-message" class="text-gray-600 hidden italic text-lg font-medium">정답률 100%! 완벽합니다! 👑</p>
                </div>
                
                <div class="text-center pt-5 border-t">
                    <button id="restart-button" class="px-10 py-4 bg-green-600 text-white text-lg font-extrabold rounded-full hover:bg-green-700 transition duration-150">
                        다시 퀴즈 시작 (20회)
                    </button>
                </div>
            </div>

            <div id="error-box" class="hidden card bg-red-100 border-l-4 border-red-600 text-red-800 p-5" role="alert">
                <p class="font-extrabold text-lg">오류 발생</p>
                <p id="error-message" class="text-base"></p>
            </div>

        </main>
    </div>

    <div id="floating-note-area" class="hidden"> 
        <div id="note-header">
            <span id="note-title">🎨 학습 필기 공간 (히라가나/한자 연습)</span>
            <div id="restore-label" class="hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                창 복구
            </div>
            <div id="header-controls" class="flex items-center">
                <button id="note-clear-button" class="bg-red-500 text-white border-none p-1.5 px-3 rounded-md text-xs font-bold hover:bg-red-600 transition">모두 지우기</button>
            </div>
        </div>
        <div id="note-content">
            <canvas id="drawing-canvas"></canvas>
        </div>
    </div>
    <button id="minimizeButton" class="absolute z-50 p-3 bg-pink-600 hover:bg-pink-700 text-white rounded-full shadow-lg focus:outline-none focus:ring-4 focus:ring-pink-400 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300 hidden">
        <svg id="minimizeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        <svg id="maximizeIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
    </button>
    <script type="module">
        // Firebase setup (Minimal change)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const [appId, initialAuthToken] = [typeof __app_id !== 'undefined' ? __app_id : 'default-app-id', typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null];
        let firebaseConfig;
        try { firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}'); } catch (e) { firebaseConfig = {}; }
        let db, auth, userId = null;

        const initFirebase = async () => {
            if (Object.keys(firebaseConfig).length === 0) return;
            try {
                const app = initializeApp(firebaseConfig);
                [db, auth] = [getFirestore(app), getAuth(app)];
                onAuthStateChanged(auth, (user) => { userId = user ? user.uid : crypto.randomUUID(); });
                if (initialAuthToken) { await signInWithCustomToken(auth, initialAuthToken); } else { await signInAnonymously(auth); }
            } catch (error) { console.error("Firebase 초기화 또는 인증 오류:", error); }
        };
        initFirebase();
        
        // Global State Variables (Minimal change)
        let [vocabulary, loadedFiles, quizQuestions, currentQuestionIndex, incorrectAnswers, isMinimized] = [[], [], [], 0, [], false];
        let savedPositionAndSize = { width: 300, height: 250, left: 0, top: 0 }; 
        const [QUIZ_COUNT, BASE_FOLDER_URL, RAW_CONTENT_BASE_URL, dataCellsSelector] = [20, "https://api.github.com/repos/ninetaild/ninetaild.github.io/contents/src/", "https://raw.githubusercontent.com/ninetaild/ninetaild.github.io/main/src/", '.study-cell[data-row-index]'];

        // DOM Elements (Minimal change, using array destructuring)
        const [fileUploadSection, quizSection, studySection, resultsSection, errorBox] = 
              ['file-upload-section', 'quiz-section', 'study-section', 'results-section', 'error-box'].map(id => document.getElementById(id));
        const [csvUrlInput, csvSelect, loadedFilesContainer, fileCountSpan, noFilesMessage, totalWordCount] = 
              ['csv-url-input', 'csv-select', 'loaded-files-container', 'file-count', 'no-files-message', 'total-word-count'].map(id => document.getElementById(id));
        const [startQuizButton, startStudyButton, addSelectedFileButton, addUrlFileButton] = 
              ['start-quiz-button', 'start-study-button', 'add-selected-file-button', 'add-url-file-button'].map(id => document.getElementById(id));
        const [nextButton, restartButton, backToMenuButton, toggleAllButton, shuffleStudyButton] = 
              ['next-button', 'restart-button', 'back-to-menu-button', 'toggle-all-button', 'shuffle-study-button'].map(id => document.getElementById(id));
        const [urlStatusMessage, studyGridContainer] = [document.getElementById('url-status-message'), document.getElementById('study-grid-container')];
        const [floatingNoteArea, noteHeader, noteClearButton, drawingCanvas, restoreLabel, headerControls] = 
              ['floating-note-area', 'note-header', 'note-clear-button', 'drawing-canvas', 'restore-label', 'header-controls'].map(id => document.getElementById(id));
        const [minimizeButton, minimizeIcon, maximizeIcon] = [document.getElementById('minimizeButton'), document.getElementById('minimizeIcon'), document.getElementById('maximizeIcon')];
        const [questionTextElement, optionsContainer, quizProgressElement, finalScoreElement, incorrectListElement, feedbackMessage, errorMessage, noIncorrectMessage] = 
              ['question-text', 'options-container', 'quiz-progress', 'final-score', 'incorrect-list', 'feedback-message', 'error-message', 'no-incorrect-message'].map(id => document.getElementById(id));
        
        let [ctx, isDrawing, lastX, lastY, isDragging, initialX, initialY] = [null, false, 0, 0, false, 0, 0];
        
        // ----------------------------------------------------------------------
        // Kanji Linking Helper Functions (NEW)
        // ----------------------------------------------------------------------

        /** CJK Unified Ideographs 범위에 속하는 문자인지 확인 (간소화된 검사) */
        function isKanji(char) {
            const code = char.charCodeAt(0);
            return (code >= 0x4E00 && code <= 0x9FFF) || (code >= 0x3400 && code <= 0x4DBF); 
        }

        /** 단어 문자열 내 각 한자에 나무위키 링크를 개별적으로 적용합니다. */
        function linkifyKanji(kanjiString) {
            if (!kanjiString || kanjiString === '(조사)') return kanjiString;
            
            let result = '';
            for (const char of kanjiString) {
                if (isKanji(char)) {
                    const encodedChar = encodeURIComponent(char);
                    result += `<a href="https://namu.wiki/w/${encodedChar}" target="_blank" class="kanji-link">${char}</a>`;
                } else {
                    result += char;
                }
            }
            return result;
        }

        // ----------------------------------------------------------------------
        // UI & State Management (Compressed)
        // ----------------------------------------------------------------------

        function updateMainButtonState() {
            const hasFiles = loadedFiles.length > 0;
            const hasEnoughWords = vocabulary.length >= 4;
            startQuizButton.disabled = startStudyButton.disabled = !(hasFiles && hasEnoughWords);
            urlStatusMessage.classList.remove('text-red-500');
            if (hasFiles) {
                if (hasEnoughWords) { urlStatusMessage.textContent = `총 ${vocabulary.length}개의 단어가 준비되었습니다. 학습 또는 퀴즈를 시작하세요.`; } 
                else { urlStatusMessage.textContent = `단어가 너무 적습니다 (현재 ${vocabulary.length}개). 최소 4개의 단어가 필요합니다.`; urlStatusMessage.classList.add('text-red-500'); }
            } else { urlStatusMessage.textContent = 'CSV 파일을 추가해 주세요.'; }
        }
        
        function showSection(sectionToShow) {
            [fileUploadSection, quizSection, resultsSection, studySection, errorBox].forEach(s => s.classList.add('hidden'));
            const shouldShowNote = sectionToShow === studySection; 
            if (sectionToShow) sectionToShow.classList.remove('hidden');
            
            if (shouldShowNote) {
                floatingNoteArea.classList.remove('hidden');
                if (!isMinimized) { minimizeButton.classList.remove('hidden'); resizeCanvas(); } 
                else { minimizeButton.classList.add('hidden'); }
                updateMinimizeButtonPosition();
            } else {
                floatingNoteArea.classList.add('hidden');
                minimizeButton.classList.add('hidden'); 
            }
        }
        
        // ----------------------------------------------------------------------
        // Data Loading & Management (Compressed)
        // ----------------------------------------------------------------------
        
        async function loadCsvFileOptions() {
            csvSelect.innerHTML = '<option value="">-- CSV 파일을 선택하세요 --</option>';
            csvSelect.querySelector('option[value=""]').textContent = '파일 목록 로딩 중...';
            addSelectedFileButton.disabled = true;

            try {
                const response = await fetch(BASE_FOLDER_URL);
                if (!response.ok) throw new Error(`GitHub API 통신 오류: ${response.status}.`);
                const csvFiles = (await response.json()).filter(file => file.name.endsWith('.csv') && file.type === 'file').map(file => file.name);

                csvSelect.innerHTML = '<option value="">-- CSV 파일을 선택하세요 --</option>';
                csvFiles.forEach(fileName => {
                    const option = document.createElement('option');
                    option.value = RAW_CONTENT_BASE_URL + fileName;
                    option.textContent = fileName;
                    option.dataset.name = fileName;
                    csvSelect.appendChild(option);
                });
                if (csvFiles.length === 0) csvSelect.innerHTML += '<option value="" disabled>사용 가능한 CSV 파일이 없습니다.</option>';
                csvSelect.selectedIndex = 0;
                addSelectedFileButton.disabled = true;
            } catch (error) {
                csvSelect.innerHTML = '<option value="" disabled>-- 파일 목록 로드 실패 --</option>';
                urlStatusMessage.textContent = `CSV 파일 목록 로드 실패 (오류: ${error.message}).`;
                urlStatusMessage.classList.add('text-red-500');
            }
        }

        function parseCSVText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length <= 1) return [];
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = [];
                let [current, inQuotes] = ['', false];
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { parts.push(current.trim().replace(/^"|"$/g, '')); current = ''; } 
                    else { current += char; }
                }
                parts.push(current.trim().replace(/^"|"$/g, ''));

                if (parts.length >= 4) {
                    data.push({
                        key: `${parts[0].trim()}_${parts[2].trim()}`, 
                        hiragana: parts[0], 
                        koreanPronunciation: parts[1],
                        kanji: parts[2], 
                        koreanMeaning: parts[3],
                    });
                }
            }
            return data;
        }

        async function fetchWordsFromURL(url) {
            if (!url) throw new Error("유효한 URL이 아닙니다.");
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP 상태 ${response.status}. URL을 확인해 주세요.`);
            return parseCSVText(await response.text());
        }
        
        async function updateVocabulary() {
            if (loadedFiles.length === 0) { vocabulary = []; renderLoadedFiles(); updateMainButtonState(); return; }

            urlStatusMessage.textContent = `총 ${loadedFiles.length}개 파일의 단어를 통합하는 중...`;
            urlStatusMessage.classList.remove('text-red-500');
            
            let [allWords, uniqueKeys] = [[], new Set()];
            
            try {
                for (const file of loadedFiles) {
                    const fileWords = await fetchWordsFromURL(file.url);
                    file.wordCount = fileWords.length;
                    
                    fileWords.forEach(word => {
                        if (!uniqueKeys.has(word.key)) {
                            uniqueKeys.add(word.key);
                            allWords.push(word);
                        }
                    });
                }
                vocabulary = allWords;
                renderLoadedFiles();
                updateMainButtonState();
            } catch (error) {
                urlStatusMessage.textContent = `단어 통합 오류: ${error.message}`;
                urlStatusMessage.classList.add('text-red-500');
                vocabulary = [];
                renderLoadedFiles();
                updateMainButtonState();
            }
        }

        function renderLoadedFiles() {
            loadedFilesContainer.innerHTML = '';
            fileCountSpan.textContent = loadedFiles.length;
            totalWordCount.textContent = `총 단어 수: ${vocabulary.length}개 (중복 제거 후)`;

            if (loadedFiles.length === 0) { noFilesMessage.classList.remove('hidden'); return; } 
            else { noFilesMessage.classList.add('hidden'); }

            loadedFiles.forEach((file, index) => {
                const fileTag = document.createElement('span');
                fileTag.className = 'file-tag';
                const fileName = file.name || file.url.substring(file.url.lastIndexOf('/') + 1);
                fileTag.innerHTML = `<span>${fileName} (${file.wordCount || 0} 단어)</span><button class="remove-file-btn" data-index="${index}" title="제거">X</button>`;
                loadedFilesContainer.appendChild(fileTag);
            });

            loadedFilesContainer.querySelectorAll('.remove-file-btn').forEach(button => {
                button.addEventListener('click', (e) => removeFile(parseInt(e.target.dataset.index)));
            });
        }
        
        function addFile(url, name) {
            const trimmedUrl = url.trim();
            if (!trimmedUrl) return;
            
            if (loadedFiles.some(f => f.url === trimmedUrl)) { urlStatusMessage.textContent = `${name || trimmedUrl} 파일은 이미 추가되었습니다.`; urlStatusMessage.classList.add('text-orange-500'); return; }

            loadedFiles.push({ url: trimmedUrl, name: name });
            urlStatusMessage.textContent = `${name} 파일을 목록에 추가했습니다. 단어를 로드하는 중...`;
            urlStatusMessage.classList.remove('text-red-500', 'text-orange-500');
            updateVocabulary(); 
        }

        function removeFile(index) {
            const removedFileName = loadedFiles[index].name;
            loadedFiles.splice(index, 1);
            urlStatusMessage.textContent = `${removedFileName} 파일을 목록에서 제거했습니다.`;
            urlStatusMessage.classList.remove('text-red-500', 'text-orange-500');
            updateVocabulary(); 
        }

        // ----------------------------------------------------------------------
        // Shuffle Logic (Compressed)
        // ----------------------------------------------------------------------
        
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function shuffleStudyRows() {
            if (vocabulary.length === 0) return;
            shuffleArray(vocabulary);
            renderStudyGrid(vocabulary);
            const gridContainer = document.getElementById('study-grid-container');
            gridContainer.style.opacity = '0.5';
            gridContainer.style.transition = 'opacity 0.3s';
            setTimeout(() => { gridContainer.style.opacity = '1'; }, 100);
        }

        // ----------------------------------------------------------------------
        // Quiz/Study Logic (Compressed & Individual Kanji Link applied)
        // ----------------------------------------------------------------------
        
        function createQuiz(data) {
            if (data.length < 4) return [];
            
            const [questions, dataToUse, questionTypes] = [[], [...data].sort(() => 0.5 - Math.random()), ['meaning_match', 'hiragana_meaning_match', 'pronunciation_match', 'hiragana_pronunciation_match']];
            
            for (let i = 0; i < QUIZ_COUNT; i++) {
                const correctWord = dataToUse[i % dataToUse.length]; 
                const quizType = questionTypes[Math.floor(Math.random() * questionTypes.length)]; 
                let [question, optionsSourceField] = [{ type: quizType }, ''];
                const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';

                switch (quizType) {
                    case 'meaning_match': question.text = `다음 단어의 뜻은? [${correctWord.hiragana} ${kanjiDisplay}]`; question.correctAnswerText = correctWord.koreanMeaning; optionsSourceField = 'koreanMeaning'; break;
                    case 'hiragana_meaning_match': question.text = `다음 뜻에 해당하는 단어는? [${correctWord.koreanMeaning}]`; question.correctAnswerText = correctWord.hiragana; optionsSourceField = 'hiragana'; break;
                    case 'pronunciation_match': question.text = `다음 단어의 한글 발음은? [${correctWord.hiragana} ${kanjiDisplay}]`; question.correctAnswerText = correctWord.koreanPronunciation; optionsSourceField = 'koreanPronunciation'; break;
                    case 'hiragana_pronunciation_match': question.text = `다음 한글 발음에 해당하는 단어는? [${correctWord.koreanPronunciation}]`; question.correctAnswerText = correctWord.hiragana; optionsSourceField = 'hiragana'; break;
                }
                
                const correctOption = { text: question.correctAnswerText, isCorrect: true, fullData: correctWord };
                const incorrectCandidates = data.filter(item => item.key !== correctWord.key); 
                const options = [correctOption];
                const shuffledIncorrects = [...incorrectCandidates].sort(() => 0.5 - Math.random()).slice(0, 3);

                shuffledIncorrects.forEach(distractor => {
                    let optionText = distractor[optionsSourceField];
                    if (options.some(opt => opt.text === optionText)) { optionText += ` (다른 단어의 ${optionsSourceField === 'hiragana' ? '히라가나' : '뜻'})`; }
                    options.push({ text: optionText, isCorrect: false, fullData: distractor });
                });
                
                options.sort(() => 0.5 - Math.random());
                questions.push({ ...question, options, correctFullData: correctWord });
            }
            return questions;
        }

        function displayQuestion(question) {
            quizProgressElement.textContent = `문제 ${currentQuestionIndex + 1} / ${QUIZ_COUNT}`;
            questionTextElement.innerHTML = question.text;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            nextButton.classList.add('hidden');
            nextButton.disabled = true;

            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = `<span class="option-text font-medium">${option.text}</span>`;
                button.className = 'option-button w-full text-left rounded-lg text-gray-700 shadow-sm hover:bg-indigo-50 hover:shadow-md';
                button.onclick = () => handleAnswer(button, option.isCorrect, question, index);
                button.dataset.optionIndex = index; 
                optionsContainer.appendChild(button);
            });
        }

        function createDetailHtml(wordData) {
             const kanjiDisplay = wordData.kanji && wordData.kanji !== '(조사)' ? 
                                 `<p><span class="font-semibold">한자 표기:</span> ${wordData.kanji}</p>` : '';
            
            return `
                <div class="word-detail mt-3 pt-3 w-full border-t border-gray-300 space-y-1 text-xs text-gray-600">
                    <h5 class="font-bold text-indigo-700">단어 상세 정보:</h5>
                    <p><span class="font-semibold">히라가나:</span> <span class="text-sm font-extrabold text-gray-800">${wordData.hiragana}</span></p>
                    ${kanjiDisplay}
                    <p><span class="font-semibold">발음:</span> ${wordData.koreanPronunciation}</p>
                    <p><span class="font-semibold">뜻:</span> ${wordData.koreanMeaning}</p>
                </div>
            `;
        }

        function handleAnswer(selectedButton, isCorrect, currentQuestion) {
            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
            
            let [feedbackClass, feedbackText] = ['', ''];
            if (isCorrect) {
                [feedbackClass, feedbackText] = ['bg-green-100 text-green-700', '정답입니다! 잘하셨어요.'];
            } else {
                [feedbackClass, feedbackText] = ['bg-red-100 text-red-700', '오답입니다. 정답과 오답 단어의 정보를 비교해 보세요.'];
                const correctWordData = currentQuestion.correctFullData;
                if (!incorrectAnswers.some(a => a.hiragana === correctWordData.hiragana)) { incorrectAnswers.push(correctWordData); }
            }
            feedbackMessage.className = `p-4 rounded-lg text-center font-extrabold text-lg ${feedbackClass}`;
            feedbackMessage.innerHTML = `<p class="text-center">${feedbackText}</p>`;
            feedbackMessage.classList.remove('hidden');

            document.querySelectorAll('#options-container button').forEach(btn => {
                const optionIndex = parseInt(btn.dataset.optionIndex);
                const optionData = currentQuestion.options[optionIndex]; 

                if (optionData.isCorrect) { btn.classList.remove('disabled'); btn.classList.add('correct'); } 
                else if (btn === selectedButton) { btn.classList.add('incorrect'); }
                
                const originalOptionText = btn.querySelector('.option-text').textContent;
                btn.innerHTML = `<span class="option-text font-medium">${originalOptionText}</span>${createDetailHtml(optionData.fullData)}`;
            });

            nextButton.disabled = false;
            nextButton.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUIZ_COUNT) { displayQuestion(quizQuestions[currentQuestionIndex]); } 
            else { showResults(); }
        }

        function showResults() {
            showSection(resultsSection);
            const score = QUIZ_COUNT - incorrectAnswers.length;
            finalScoreElement.textContent = `${score} / ${QUIZ_COUNT} (정답률: ${Math.round((score / QUIZ_COUNT) * 100)}%)`;

            incorrectListElement.innerHTML = '';
            if (incorrectAnswers.length > 0) {
                incorrectAnswers.forEach(word => {
                    const listItem = document.createElement('li');
                    listItem.className = 'p-4 bg-gray-100 rounded-lg border-l-4 border-red-500 shadow-md';
                    listItem.innerHTML = `<p class="font-extrabold text-lg text-gray-900">${word.hiragana} (${word.kanji})</p><p class="text-base text-gray-700 ml-2">발음: ${word.koreanPronunciation}, 뜻: ${word.koreanMeaning}</p>`;
                    incorrectListElement.appendChild(listItem);
                });
                noIncorrectMessage.classList.add('hidden');
            } else {
                noIncorrectMessage.classList.remove('hidden');
            }
        }
        
        /** Study Grid를 렌더링하고 한자에 개별 링크를 추가합니다. */
        function renderStudyGrid(data) {
             studyGridContainer.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'study-grid';
            
            const headers = [
                { key: 'index', label: '#' },
                { key: 'hiragana', label: '단어 (히라가나)' },
                { key: 'koreanPronunciation', label: '한글 발음' },
                { key: 'kanji', label: '한자 표기' },
                { key: 'koreanMeaning', label: '뜻 (한국어)' }
            ];

            // Header Row
            headers.forEach(header => {
                const headerCell = document.createElement('div');
                headerCell.className = 'study-cell header-cell';
                headerCell.textContent = header.label;
                headerCell.dataset.colKey = header.key;
                if (header.key !== 'index') headerCell.onclick = handleColumnClick;
                grid.appendChild(headerCell);
            });

            // Data Rows
            data.forEach((word, rowIndex) => { 
                const indexCell = document.createElement('div');
                indexCell.className = 'study-cell index-cell';
                indexCell.textContent = rowIndex + 1; 
                grid.appendChild(indexCell);

                headers.slice(1).forEach(header => {
                    const cell = document.createElement('div');
                    cell.className = 'study-cell'; 
                    cell.onclick = handleCellClick; 
                    cell.dataset.rowIndex = rowIndex;
                    cell.dataset.colKey = header.key;
                    
                    let content;
                    
                    if (header.key === 'kanji' && word.kanji && word.kanji !== '(조사)') {
                         // 개별 한자 링크 적용 
                         const linkedContent = linkifyKanji(word.kanji.trim());
                         content = `<span class="content">${linkedContent}</span>`;
                    } else {
                         content = `<span class="content">${word[header.key]}</span>`;
                    }
                    
                    cell.innerHTML = content;
                    grid.appendChild(cell);
                });
            });

            studyGridContainer.appendChild(grid);
            updateToggleAllButtonText(false);
        }

        function handleCellClick(event) {
            const clickedCell = event.currentTarget;
            if (clickedCell.dataset.rowIndex === undefined) return;
            
            // 개별 한자 링크를 클릭했을 경우 가리기 토글을 막음
            if (event.target.closest('.kanji-link')) { event.stopPropagation(); return; }
            
            clickedCell.classList.toggle('covered');
            updateToggleAllButtonText(); 
        }

        function handleColumnClick(event) {
            const colKey = event.currentTarget.dataset.colKey;
            if (colKey === 'index' || !colKey) return; 

            const colCells = studyGridContainer.querySelectorAll(`.study-cell[data-col-key="${colKey}"][data-row-index]`);
            const shouldCover = Array.from(colCells).some(cell => !cell.classList.contains('covered'));

            colCells.forEach(cell => {
                if (shouldCover) cell.classList.add('covered');
                else cell.classList.remove('covered');
            });
            updateToggleAllButtonText();
        }

        function toggleAllCells() {
            const cells = studyGridContainer.querySelectorAll(dataCellsSelector);
            const shouldCoverAll = Array.from(cells).some(cell => !cell.classList.contains('covered'));
            cells.forEach(cell => {
                if (shouldCoverAll) cell.classList.add('covered');
                else cell.classList.remove('covered');
            });
            updateToggleAllButtonText(!shouldCoverAll);
        }

        function updateToggleAllButtonText(isCurrentlyAllCovered = null) {
            const cells = studyGridContainer.querySelectorAll(dataCellsSelector);
            if (cells.length === 0) { toggleAllButton.textContent = '데이터 없음'; return; }
            const allCovered = isCurrentlyAllCovered !== null ? isCurrentlyAllCovered : Array.from(cells).every(cell => cell.classList.contains('covered'));
            toggleAllButton.textContent = allCovered ? '모두 확인' : '모두 가리기';
        }
        
        // ----------------------------------------------------------------------
        // Floating Drawing Area Logic (Compressed)
        // ----------------------------------------------------------------------

        function resizeCanvas() {
            if (drawingCanvas && !isMinimized) {
                const rect = drawingCanvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    [drawingCanvas.width, drawingCanvas.height] = [rect.width, rect.height];
                }
                if (ctx) {
                    [ctx.strokeStyle, ctx.lineWidth, ctx.lineCap, ctx.lineJoin] = ['#1f2937', 3, 'round', 'round'];
                }
            }
        }
        
        function draw(e) {
            if (!isDrawing || isMinimized) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX === undefined || clientY === undefined) return;
            const rect = drawingCanvas.getBoundingClientRect();
            const [x, y] = [clientX - rect.left, clientY - rect.top];
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            [lastX, lastY] = [x, y];
        }

        function startDrawing(e) {
            if (isMinimized) return;
            e.preventDefault(); 
            isDrawing = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX === undefined || clientY === undefined) return;
            const rect = drawingCanvas.getBoundingClientRect();
            [lastX, lastY] = [clientX - rect.left, clientY - rect.top];
        }

        function stopDrawing() { isDrawing = false; }
        function clearCanvas() {
            if (isMinimized) return;
            ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            noteHeader.style.backgroundColor = '#d9f99d'; 
            setTimeout(() => { noteHeader.style.backgroundColor = '#fcd34d'; }, 500);
        }
        
        function updateMinimizeButtonPosition() {
            if (floatingNoteArea.classList.contains('hidden') || isMinimized) return; 
            const windowRect = floatingNoteArea.getBoundingClientRect();
            const headerHeight = noteHeader.offsetHeight;
            const [buttonX, buttonY] = [windowRect.right + 10, windowRect.top + (headerHeight / 2)];
            [minimizeButton.style.left, minimizeButton.style.top] = [`${buttonX}px`, `${buttonY}px`];
        }
        
        function toggleMinimize() {
            if (!isMinimized) {
                isMinimized = true;
                savedPositionAndSize = { left: floatingNoteArea.offsetLeft, top: floatingNoteArea.offsetTop, width: floatingNoteArea.offsetWidth, height: floatingNoteArea.offsetHeight };
                floatingNoteArea.classList.add('minimized');
                [restoreLabel.classList.remove('hidden'), headerControls.classList.add('hidden'), minimizeIcon.classList.add('hidden'), maximizeIcon.classList.remove('hidden')];
                minimizeButton.title = '최대화';
                minimizeButton.classList.add('hidden');
            } else {
                isMinimized = false;
                floatingNoteArea.classList.remove('minimized');
                [floatingNoteArea.style.width, floatingNoteArea.style.height] = [`${savedPositionAndSize.width}px`, `${savedPositionAndSize.height}px`];
                const [safeLeft, safeTop] = [Math.min(savedPositionAndSize.left, window.innerWidth - savedPositionAndSize.width - 20), Math.min(savedPositionAndSize.top, window.innerHeight - savedPositionAndSize.height - 20)];
                [floatingNoteArea.style.left, floatingNoteArea.style.top] = [`${safeLeft}px`, `${safeTop}px`];
                [restoreLabel.classList.add('hidden'), headerControls.classList.remove('hidden'), maximizeIcon.classList.add('hidden'), minimizeIcon.classList.remove('hidden')];
                minimizeButton.title = '최소화';
                if (!floatingNoteArea.classList.contains('hidden')) minimizeButton.classList.remove('hidden');
                resizeCanvas();
                updateMinimizeButtonPosition();
            }
        }


        function setupFloatingNoteArea() {
            ctx = drawingCanvas.getContext('2d');
            const [initialRect, initialLeft, initialTop] = [floatingNoteArea.getBoundingClientRect(), floatingNoteArea.getBoundingClientRect().left, floatingNoteArea.getBoundingClientRect().top];
            [floatingNoteArea.style.left, floatingNoteArea.style.top, floatingNoteArea.style.right] = [`${initialLeft}px`, `${initialTop}px`, 'auto'];
            savedPositionAndSize = { left: initialLeft, top: initialTop, width: floatingNoteArea.offsetWidth, height: floatingNoteArea.offsetHeight };
            resizeCanvas(); 
            
            // Drawing Listeners
            ['mousedown', 'touchstart'].forEach(event => drawingCanvas.addEventListener(event, startDrawing));
            ['mousemove', 'touchmove'].forEach(event => drawingCanvas.addEventListener(event, draw));
            ['mouseup', 'mouseout', 'touchend'].forEach(event => drawingCanvas.addEventListener(event, stopDrawing));
            noteClearButton.addEventListener('click', clearCanvas);
            minimizeButton.addEventListener('click', toggleMinimize);
            floatingNoteArea.addEventListener('click', (e) => { if (isMinimized) { toggleMinimize(); e.stopPropagation(); } });
            
            // Resize/Window Listeners
            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(entries => { if (!isMinimized) requestAnimationFrame(resizeCanvas); updateMinimizeButtonPosition(); });
                observer.observe(floatingNoteArea); 
            }
            window.addEventListener('resize', () => { resizeCanvas(); updateMinimizeButtonPosition(); });

            // Drag Logic
            function dragStart(e) {
                if (isMinimized || (e.offsetX > floatingNoteArea.offsetWidth - 20 && e.offsetY > floatingNoteArea.offsetHeight - 20)) return;
                const [clientX, clientY] = [e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY)];
                if (clientX === undefined || clientY === undefined) return;
                [initialX, initialY] = [clientX - floatingNoteArea.offsetLeft, clientY - floatingNoteArea.offsetTop];
                if (e.target === noteHeader || e.target.closest('#note-header')) {
                    e.preventDefault();
                    [isDragging, noteHeader.style.cursor] = [true, 'grabbing'];
                }
            }

            function dragEnd() {
                if (isDragging) {
                    [isDragging, noteHeader.style.cursor] = [false, 'grab'];
                    [savedPositionAndSize.left, savedPositionAndSize.top] = [floatingNoteArea.offsetLeft, floatingNoteArea.offsetTop];
                    updateMinimizeButtonPosition(); 
                }
            }

            function drag(e) {
                if (isDragging && !isMinimized) {
                    e.preventDefault();
                    const [clientX, clientY] = [e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY)];
                    if (clientX === undefined || clientY === undefined) return;
                    const [currentX, currentY] = [clientX - initialX, clientY - initialY];
                    const [minX, minY, maxX, maxY] = [0, 0, window.innerWidth - floatingNoteArea.offsetWidth, window.innerHeight - floatingNoteArea.offsetHeight];
                    const [newX, newY] = [Math.min(Math.max(currentX, minX), maxX), Math.min(Math.max(currentY, minY), maxY)];
                    [floatingNoteArea.style.left, floatingNoteArea.style.top] = [newX + "px", newY + "px"];
                    updateMinimizeButtonPosition(); 
                }
            }
            
            noteHeader.addEventListener("mousedown", dragStart);
            noteHeader.addEventListener("touchstart", dragStart); 
            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("touchend", dragEnd);
            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag);
            
            setTimeout(updateMinimizeButtonPosition, 100); 
        }

        // ----------------------------------------------------------------------
        // Common Loading & Start Functions (Compressed)
        // ----------------------------------------------------------------------

        async function prepareDataAndSwitch(mode) {
            if (vocabulary.length < 4) { urlStatusMessage.textContent = `퀴즈/학습을 시작하기 위한 최소 단어(4개)가 부족합니다. 현재: ${vocabulary.length}개`; urlStatusMessage.classList.add('text-red-500'); return; }
            errorBox.classList.add('hidden');
            
            if (mode === 'quiz') {
                [incorrectAnswers, currentQuestionIndex, quizQuestions] = [[], 0, createQuiz(vocabulary)];
                showSection(quizSection);
                displayQuestion(quizQuestions[currentQuestionIndex]);
            } else if (mode === 'study') {
                renderStudyGrid(vocabulary); 
                showSection(studySection);
            }
        }

        async function startQuiz() { await prepareDataAndSwitch('quiz'); }
        async function startStudy() { await prepareDataAndSwitch('study'); }
        function goBackToMenu() { showSection(fileUploadSection); updateMainButtonState(); }

        // ----------------------------------------------------------------------
        // Initialization & Event Listeners (Compressed)
        // ----------------------------------------------------------------------

        function setupEventListeners() {
            startQuizButton.addEventListener('click', startQuiz);
            startStudyButton.addEventListener('click', startStudy); 
            nextButton.addEventListener('click', nextQuestion);
            restartButton.addEventListener('click', goBackToMenu);
            backToMenuButton.addEventListener('click', goBackToMenu); 
            toggleAllButton.addEventListener('click', toggleAllCells);
            shuffleStudyButton.addEventListener('click', shuffleStudyRows); 
            
            addSelectedFileButton.addEventListener('click', () => {
                const selectedOption = csvSelect.options[csvSelect.selectedIndex];
                if (selectedOption && selectedOption.value) {
                    addFile(selectedOption.value, selectedOption.dataset.name);
                    [csvSelect.selectedIndex, addSelectedFileButton.disabled] = [0, true];
                }
            });
            
            addUrlFileButton.addEventListener('click', () => {
                const url = csvUrlInput.value.trim();
                if (url) {
                    const name = url.substring(url.lastIndexOf('/') + 1) || '직접 입력 URL';
                    addFile(url, name);
                    [csvUrlInput.value, addUrlFileButton.disabled] = ['', true];
                }
            });

            csvSelect.addEventListener('change', () => {
                addSelectedFileButton.disabled = !csvSelect.value;
                if(csvSelect.value) csvUrlInput.value = '';
                addUrlFileButton.disabled = !csvUrlInput.value.trim();
            });
            
            csvUrlInput.addEventListener('input', () => {
                addUrlFileButton.disabled = !csvUrlInput.value.trim();
                if(csvUrlInput.value.trim()) csvSelect.selectedIndex = 0;
                addSelectedFileButton.disabled = !csvSelect.value;
            });

            setupFloatingNoteArea(); 
        }

        window.onload = function() {
            setupEventListeners();
            loadCsvFileOptions(); 
            csvUrlInput.value = ''; 
            updateVocabulary(); 
            updateMainButtonState(); 
            showSection(fileUploadSection);
        };
    </script>
