<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .option-button {
            transition: all 0.2s;
            border: 2px solid #e5e7eb;
            /* 최소 높이 설정 및 flex 속성으로 내부 요소 제어 */
            min-height: 100px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            justify-content: flex-start; /* 상단 정렬 */
            text-align: left;
            padding: 1rem; /* p-4 */
        }
        .option-button:hover:not(.disabled):not(.correct):not(.incorrect) {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .correct {
            background-color: #d1fae5;
            border-color: #10b981;
            font-weight: 600;
        }
        .incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            font-weight: 600;
        }
        .disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .header-bg {
            background-color: #4f46e5;
            color: white;
        }
        /* 상세 정보 섹션의 텍스트 색상을 버튼 색상에 따라 조정 */
        .option-button .word-detail {
            color: #4b5563; /* Gray-600 */
        }
        .correct .word-detail {
            border-top-color: #a7f3d0; /* Green-200 */
        }
        .incorrect .word-detail {
            border-top-color: #fca5a5; /* Red-300 */
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- Header -->
        <header class="header-bg p-6 mb-6 rounded-xl shadow-lg">
            <h1 class="text-3xl font-bold text-center">일본어 단어 퀴즈</h1>
        </header>

        <!-- Main Content Area -->
        <main id="app-container" class="space-y-6">
            <!-- Data Source Configuration Section -->
            <div id="file-upload-section" class="card">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">1. CSV 데이터 URL 설정</h2>

                <!-- URL Input Area -->
                <div id="input-area" class="space-y-4 p-4 border rounded-lg bg-gray-50">
                    <p class="text-sm font-medium text-gray-700 mb-2">CSV 파일 경로를 입력하거나 기본값을 사용하세요:</p>
                    <input type="text" id="csv-url-input" 
                           class="w-full p-2 border border-gray-300 rounded-md bg-white text-gray-800 text-sm focus:border-indigo-500 focus:ring-indigo-500" 
                           value="https://ninetaild.github.io/src/1.csv"
                           placeholder="유효한 CSV 파일 URL을 입력하세요">
                    <p id="url-status-message" class="text-xs mt-2 text-gray-500"></p>
                </div>
                
                <!-- Main Start Button -->
                <div class="mt-6 pt-4 border-t text-center">
                    <button id="start-quiz-button" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-full hover:bg-indigo-700 transition duration-150 disabled:opacity-50">
                        퀴즈 시작 (총 20문제)
                    </button>
                </div>
            </div>

            <!-- Quiz & Results Section -->
            <div id="quiz-section" class="hidden">
                <div class="card space-y-6">
                    <!-- Progress and Question -->
                    <div>
                        <p id="quiz-progress" class="text-lg font-medium text-indigo-600 mb-4 text-center"></p>
                        <div id="question-card" class="bg-indigo-50 p-6 rounded-lg shadow-inner text-center">
                            <h3 class="text-2xl font-bold text-gray-800" id="question-text"></h3>
                        </div>
                    </div>
                    
                    <!-- Options -->
                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Option buttons will be injected here -->
                    </div>

                    <!-- Feedback and Detailed Answer -->
                    <div id="feedback-message" class="hidden p-3 rounded-lg text-center font-medium"></div>
                    
                    <!-- Next Button -->
                    <div class="text-center">
                        <button id="next-button" class="hidden px-6 py-2 bg-indigo-600 text-white font-semibold rounded-full hover:bg-indigo-700 transition duration-150" disabled>
                            다음 문제
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="hidden card space-y-6">
                <h2 class="text-2xl font-bold text-center text-gray-700">퀴즈 완료!</h2>
                <div class="text-center space-y-2">
                    <p class="text-xl text-gray-600">총 20문제 중:</p>
                    <p id="final-score" class="text-3xl font-extrabold text-indigo-600"></p>
                </div>
                
                <div id="incorrect-answers-summary" class="border-t pt-4">
                    <h3 class="text-xl font-semibold text-red-600 mb-3">오답 정리 (복습 필요!)</h3>
                    <ul id="incorrect-list" class="space-y-3">
                        <!-- Incorrect answers will be listed here -->
                    </ul>
                    <p id="no-incorrect-message" class="text-gray-500 hidden italic">정답률 100%! 완벽합니다!</p>
                </div>
                
                <div class="text-center pt-4 border-t">
                    <button id="restart-button" class="px-8 py-3 bg-green-500 text-white font-bold rounded-full hover:bg-green-600 transition duration-150">
                        다시 퀴즈 시작 (20회)
                    </button>
                </div>
            </div>

            <!-- Error Message Box -->
            <div id="error-box" class="hidden card bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-bold">오류 발생</p>
                <p id="error-message"></p>
            </div>

        </main>
    </div>

    <script type="module">
        // 전역 변수 설정
        let vocabulary = []; // 현재 퀴즈에 사용될 단어 데이터
        let quizQuestions = []; // 이번 퀴즈에 사용될 20개의 문제
        let currentQuestionIndex = 0; // 현재 문제 인덱스
        let incorrectAnswers = []; // 오답 기록
        
        const QUIZ_COUNT = 20; // 총 퀴즈 횟수

        // DOM 요소 캐싱
        const fileUploadSection = document.getElementById('file-upload-section');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const csvUrlInput = document.getElementById('csv-url-input');
        const nextButton = document.getElementById('next-button');
        const restartButton = document.getElementById('restart-button');
        const startQuizButton = document.getElementById('start-quiz-button');
        const urlStatusMessage = document.getElementById('url-status-message');
        
        // 퀴즈/결과 관련 요소
        const questionTextElement = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const quizProgressElement = document.getElementById('quiz-progress');
        const finalScoreElement = document.getElementById('final-score');
        const incorrectListElement = document.getElementById('incorrect-list');
        const feedbackMessage = document.getElementById('feedback-message');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');
        const noIncorrectMessage = document.getElementById('no-incorrect-message');

        // ----------------------------------------------------------------------
        // UI & State Management Functions
        // ----------------------------------------------------------------------

        function updateStartButtonState(isDisabled, message = '퀴즈 시작 (총 20문제)') {
            startQuizButton.disabled = isDisabled;
            startQuizButton.textContent = message;
        }

        // 오류 메시지 표시 함수 (전체 화면 전환)
        function displayError(message) {
            errorMessage.textContent = message;
            errorBox.classList.remove('hidden');
            fileUploadSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            updateStartButtonState(false); 
        }

        // ----------------------------------------------------------------------
        // Data Loading & Parsing Functions
        // ----------------------------------------------------------------------

        // CSV 텍스트를 파싱하여 단어 데이터 배열로 변환하는 범용 함수
        function parseCSVText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            
            // 1행(헤더) 제외
            if (lines.length <= 1) {
                throw new Error("CSV 데이터에 헤더를 제외한 유효한 단어 데이터가 없습니다.");
            }
            
            const data = [];
            // 헤더(첫 줄)를 건너뛰고 시작
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 쉼표와 따옴표를 고려한 파싱
                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(p => p.trim().replace(/^"|"$/g, ''));
                
                // CSV 형식: 단어 (히라가나),한글 발음,한자 표기,뜻 (한국어)
                if (parts.length >= 4) {
                    data.push({
                        hiragana: parts[0],
                        koreanPronunciation: parts[1],
                        kanji: parts[2] === '(조사)' ? parts[2] : parts[2], 
                        koreanMeaning: parts[3],
                    });
                }
            }
            return data;
        }

        // 지정된 URL에서 CSV 파일을 로드하고 파싱하는 함수
        async function loadVocabularyFromURL(url) {
            if (!url) {
                throw new Error("URL을 입력해 주세요.");
            }

            urlStatusMessage.textContent = `단어 로딩 중: ${url}`;
            urlStatusMessage.classList.remove('text-red-500');
            updateStartButtonState(true, '로딩 중...');

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP 상태 ${response.status}. URL을 확인해 주세요.`);
                }
                
                const text = await response.text();
                const data = parseCSVText(text);

                if (data.length < 4) {
                    throw new Error(`퀴즈를 시작하기 위한 최소 단어(4개)가 부족합니다. 현재: ${data.length}개`);
                }
                
                urlStatusMessage.textContent = `단어 ${data.length}개 로드 완료. 퀴즈를 시작하세요.`;
                updateStartButtonState(false);
                return data;

            } catch (error) {
                urlStatusMessage.textContent = `단어 로드 실패: ${error.message}`;
                urlStatusMessage.classList.add('text-red-500');
                updateStartButtonState(false);
                throw error; // 오류를 다시 던져 startQuiz에서 처리하도록 함
            }
        }
        
        // ----------------------------------------------------------------------
        // Quiz Core Logic (createQuiz, displayQuestion, handleAnswer, etc.)
        // ----------------------------------------------------------------------

        // 문제 생성 함수
        function createQuiz(data) {
            if (data.length < 4) return [];
            
            const questions = [];
            const dataToUse = [...data].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < QUIZ_COUNT; i++) {
                const correctWord = dataToUse[i % dataToUse.length]; 
                const questionTypes = ['meaning_match', 'hiragana_meaning_match', 'pronunciation_match', 'hiragana_pronunciation_match'];
                const quizType = questionTypes[Math.floor(Math.random() * questionTypes.length)]; 

                let question = {};
                let optionsSourceField = ''; 

                // 퀴즈 유형별 설정
                if (quizType === 'meaning_match') {
                    question.type = 'meaning_match';
                    const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';
                    question.text = `다음 단어의 뜻은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                    question.correctAnswerText = correctWord.koreanMeaning;
                    optionsSourceField = 'koreanMeaning';
                } else if (quizType === 'hiragana_meaning_match') {
                    question.type = 'hiragana_meaning_match';
                    question.text = `다음 뜻에 해당하는 단어는? [${correctWord.koreanMeaning}]`;
                    question.correctAnswerText = correctWord.hiragana;
                    optionsSourceField = 'hiragana';
                } else if (quizType === 'pronunciation_match') {
                    question.type = 'pronunciation_match';
                    const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';
                    question.text = `다음 단어의 한글 발음은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                    question.correctAnswerText = correctWord.koreanPronunciation;
                    optionsSourceField = 'koreanPronunciation';
                } else if (quizType === 'hiragana_pronunciation_match') {
                    question.type = 'hiragana_pronunciation_match';
                    question.text = `다음 한글 발음에 해당하는 단어는? [${correctWord.koreanPronunciation}]`;
                    question.correctAnswerText = correctWord.hiragana;
                    optionsSourceField = 'hiragana';
                }
                
                // 옵션 생성 로직 (각 옵션에 해당 단어의 fullData를 연결)
                const options = [];
                const incorrectOptions = [];
                // 정답 옵션 추가
                options.push({ 
                    text: question.correctAnswerText, 
                    isCorrect: true, 
                    fullData: correctWord // 정답 단어의 전체 데이터
                });

                // 오답 옵션 3개 선택 및 추가
                const potentialIncorrects = data.filter(item => 
                    item[optionsSourceField] !== question.correctAnswerText && item.hiragana !== correctWord.hiragana
                );
                
                // Shuffled incorrect candidates
                const shuffledIncorrects = [...potentialIncorrects].sort(() => 0.5 - Math.random());

                for (let j = 0; j < 3; j++) {
                    let distractor;
                    if (j < shuffledIncorrects.length) {
                        distractor = shuffledIncorrects[j];
                    } else {
                         // Fallback: If not enough unique words, use a random one and append an indicator
                         const fillerWord = data[Math.floor(Math.random() * data.length)];
                         distractor = { 
                             ...fillerWord, 
                             // 텍스트는 보기의 값이 되도록 함
                             [optionsSourceField]: (fillerWord[optionsSourceField] || fillerWord.koreanMeaning) + ' (오답)',
                         }; 
                    }

                    let optionText = distractor[optionsSourceField];
                    // 텍스트 중복 방지 체크
                    if (!options.some(opt => opt.text === optionText)) {
                         options.push({ 
                            text: optionText, 
                            isCorrect: false, 
                            fullData: distractor // 오답 단어의 전체 데이터
                        });
                    } else {
                        // 중복된 경우, 텍스트를 고유하게 만들고 재시도
                        options.push({
                            text: optionText + ' (중복)',
                            isCorrect: false,
                            fullData: distractor
                        });
                    }
                }
                
                // 옵션 섞기
                options.sort(() => 0.5 - Math.random());
                
                questions.push({
                    ...question,
                    options: options, // 각 옵션에 fullData 포함
                    correctFullData: correctWord 
                });
            }
            
            return questions;
        }

        // 퀴즈 화면에 현재 문제 표시
        function displayQuestion(question) {
            const currentNumber = currentQuestionIndex + 1;
            quizProgressElement.textContent = `문제 ${currentNumber} / ${QUIZ_COUNT}`;
            questionTextElement.innerHTML = question.text;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            nextButton.classList.add('hidden');
            nextButton.disabled = true;

            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                // 버튼 내부에 텍스트를 감싸서 나중에 상세 정보와 분리되도록 함
                button.innerHTML = `<span class="option-text font-medium">${option.text}</span>`;
                button.className = 'option-button w-full text-left rounded-lg text-gray-700 hover:bg-indigo-50 hover:shadow-md';
                // handleAnswer 호출 시 전체 질문 객체와 옵션 인덱스를 전달
                button.onclick = () => handleAnswer(button, option.isCorrect, question, index);
                button.disabled = false;
                button.dataset.optionIndex = index; // 인덱스를 data 속성에 저장
                optionsContainer.appendChild(button);
            });
        }

        // 정답 선택 처리 (모든 보기에 해당 단어의 상세 학습 정보 표시 로직 반영)
        function handleAnswer(selectedButton, isCorrect, currentQuestion, selectedOptionIndex) {
            // 1. 모든 버튼 비활성화
            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
            feedbackMessage.classList.remove('hidden');
            
            let feedbackText = '';
            let feedbackClass = '';

            // 2. 피드백 메시지 설정
            if (isCorrect) {
                feedbackClass = 'p-3 rounded-lg text-center font-medium bg-green-100 text-green-700';
                feedbackText = '정답입니다! 잘하셨어요.';
            } else {
                feedbackClass = 'p-3 rounded-lg text-center font-medium bg-red-100 text-red-700';
                feedbackText = '오답입니다. 정답과 오답 단어의 정보를 비교해 보세요.';

                // 오답 기록
                const correctWordData = currentQuestion.correctFullData;
                if (!incorrectAnswers.some(a => a.hiragana === correctWordData.hiragana)) {
                     incorrectAnswers.push(correctWordData);
                }
            }
            
            // 3. CORE CHANGE: 모든 보기에 해당 단어의 상세 정보 추가 및 스타일 적용
            document.querySelectorAll('#options-container button').forEach(btn => {
                const optionIndex = parseInt(btn.dataset.optionIndex);
                const optionData = currentQuestion.options[optionIndex]; // 해당 옵션의 전체 데이터 (fullData 포함)

                // 스타일 적용
                if (optionData.isCorrect) {
                     // 정답은 항상 초록색 스타일
                     btn.classList.remove('disabled'); 
                     btn.classList.add('correct');
                } else if (btn === selectedButton) {
                     // 선택된 오답은 빨간색 스타일
                     btn.classList.add('incorrect');
                }
                
                // 해당 옵션이 가진 단어의 상세 정보 HTML 생성
                // optionData.fullData는 해당 보기의 텍스트가 파생된 원본 단어 객체임
                const wordDetailHtml = createDetailHtml(optionData.fullData);
                const originalOptionText = btn.querySelector('.option-text').textContent;
                
                // 상세 정보 삽입
                btn.innerHTML = `<span class="option-text font-medium">${originalOptionText}</span>${wordDetailHtml}`;
            });


            // 4. 피드백 메시지 컨테이너에 텍스트 표시
            feedbackMessage.className = feedbackClass;
            feedbackMessage.innerHTML = `<p class="text-center">${feedbackText}</p>`;

            // 5. 다음 버튼 활성화
            nextButton.disabled = false;
            nextButton.classList.remove('hidden');
        }
        
        // 상세 학습 정보 HTML 생성 함수 (재사용을 위해 분리)
        function createDetailHtml(wordData) {
             const kanjiDisplay = wordData.kanji && wordData.kanji !== '(조사)' ? 
                                 `<p><span class="font-semibold">한자 표기:</span> ${wordData.kanji}</p>` : '';
            
            // "단어 상세 정보"로 변경하여 중립적으로 만듭니다.
            return `
                <div class="word-detail mt-3 pt-3 w-full border-t border-gray-300 space-y-1 text-xs">
                    <h5 class="font-bold text-indigo-700">단어 상세 정보:</h5>
                    <p><span class="font-semibold">히라가나:</span> <span class="text-sm font-extrabold">${wordData.hiragana}</span></p>
                    ${kanjiDisplay}
                    <p><span class="font-semibold">발음:</span> ${wordData.koreanPronunciation}</p>
                    <p><span class="font-semibold">뜻:</span> ${wordData.koreanMeaning}</p>
                </div>
            `;
        }

        // 다음 문제 또는 결과 화면으로 이동
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUIZ_COUNT) {
                displayQuestion(quizQuestions[currentQuestionIndex]);
            } else {
                showResults();
            }
        }

        // 결과 화면 표시
        function showResults() {
            fileUploadSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            errorBox.classList.add('hidden');
            updateStartButtonState(false); 

            const score = QUIZ_COUNT - incorrectAnswers.length;
            finalScoreElement.textContent = `${score} / ${QUIZ_COUNT} (정답률: ${Math.round((score / QUIZ_COUNT) * 100)}%)`;

            // 오답 리스트 출력
            incorrectListElement.innerHTML = '';
            if (incorrectAnswers.length > 0) {
                incorrectAnswers.forEach(word => {
                    const listItem = document.createElement('li');
                    listItem.className = 'p-3 bg-gray-50 rounded-lg border-l-4 border-red-400 shadow-sm';
                    listItem.innerHTML = `
                        <p class="font-bold text-gray-800">${word.hiragana} (${word.kanji})</p>
                        <p class="text-sm text-gray-600 ml-2">발음: ${word.koreanPronunciation}, 뜻: ${word.koreanMeaning}</p>
                    `;
                    incorrectListElement.appendChild(listItem);
                });
                noIncorrectMessage.classList.add('hidden');
            } else {
                noIncorrectMessage.classList.remove('hidden');
            }
        }

        // 퀴즈 시작 (URL에서 데이터 로드 포함)
        async function startQuiz() {
            const url = csvUrlInput.value.trim();
            
            // UI 상태 변경: 로딩 시작
            updateStartButtonState(true, '데이터 로딩 및 문제 생성 중...');
            errorBox.classList.add('hidden');

            try {
                // 1. URL에서 데이터 로드 및 파싱 (에러 발생 시 catch 블록으로 이동)
                vocabulary = await loadVocabularyFromURL(url);
                
                // 2. 퀴즈 데이터 초기화 및 생성
                incorrectAnswers = [];
                currentQuestionIndex = 0;
                quizQuestions = createQuiz(vocabulary); 
                
                if (quizQuestions.length === 0) {
                    throw new Error("퀴즈 생성을 위한 문제가 충분하지 않습니다. (최소 4개 단어 필요)");
                }

                // 3. UI 전환 및 퀴즈 시작
                fileUploadSection.classList.add('hidden');
                resultsSection.classList.add('hidden');
                quizSection.classList.remove('hidden');
                
                displayQuestion(quizQuestions[currentQuestionIndex]);

            } catch (error) {
                // 로드 실패 또는 데이터 부족 시 처리
                updateStartButtonState(false, '퀴즈 시작'); // 버튼 비활성화 해제
                if (fileUploadSection.classList.contains('hidden')) {
                    fileUploadSection.classList.remove('hidden');
                }
                urlStatusMessage.textContent = error.message;
                urlStatusMessage.classList.add('text-red-500');
            }
        }
        
        // ----------------------------------------------------------------------
        // Initialization & Event Listeners
        // ----------------------------------------------------------------------

        // 이벤트 리스너 등록
        function setupEventListeners() {
            // 퀴즈 시작 버튼 리스너
            startQuizButton.addEventListener('click', startQuiz);
            
            // 다음 버튼 리스너
            nextButton.addEventListener('click', nextQuestion);

            // 다시 시작 버튼 리스너 (결과 화면에서 메인 화면으로 돌아가기 위해 startQuiz를 사용)
            restartButton.addEventListener('click', () => {
                // 퀴즈를 다시 시작하기 위해 메인 화면으로 복귀
                fileUploadSection.classList.remove('hidden');
                quizSection.classList.add('hidden');
                resultsSection.classList.add('hidden');
                errorBox.classList.add('hidden');
                // 시작 버튼을 재활성화하고, 현재 로드된 URL의 단어 수 표시
                if (vocabulary.length > 0) {
                    urlStatusMessage.textContent = `현재 ${vocabulary.length}개의 단어가 로드되어 있습니다.`;
                } else {
                    urlStatusMessage.textContent = '새 URL을 입력하거나 기본값으로 퀴즈를 시작하세요.';
                }
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
            
            // URL 입력 필드가 변경될 때마다 상태 메시지 초기화
            csvUrlInput.addEventListener('input', () => {
                urlStatusMessage.textContent = 'URL을 입력하고 퀴즈 시작 버튼을 누르세요.';
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
        }

        // 초기화
        window.onload = function() {
            setupEventListeners();
            // 초기 로드 메시지 설정
            urlStatusMessage.textContent = 'URL을 입력하거나 기본값으로 퀴즈를 시작하세요.';
            // 초기 버튼 상태 설정
            updateStartButtonState(false);
        };

    </script>
</body>
</html>
