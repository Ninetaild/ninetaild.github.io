<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 퀴즈 및 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            position: relative; 
        }
        
        /* Quiz Button Styles */
        .option-button {
            transition: all 0.2s;
            border: 2px solid #e5e7eb;
            min-height: 100px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            justify-content: flex-start; 
            text-align: left;
            padding: 1rem; 
        }
        .option-button:hover:not(.disabled):not(.correct):not(.incorrect) {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .correct {
            background-color: #d1fae5;
            border-color: #10b981;
            font-weight: 600;
        }
        .incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            font-weight: 600;
        }
        .disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .header-bg {
            background-color: #4f46e5;
            color: white;
        }
        .option-button .word-detail {
            color: #4b5563; 
        }
        .correct .word-detail {
            border-top-color: #a7f3d0; 
        }
        .incorrect .word-detail {
            border-top-color: #fca5a5; 
        }
        
        /* Study Mode Grid Styles */
        #study-grid-container {
            width: 100%;
            overflow-x: auto;
        }
        .study-grid {
            display: grid;
            grid-template-columns: 50px minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1.5fr);
            border-left: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
            min-width: 600px;
        }
        .study-cell {
            padding: 10px;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
            font-size: 14px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            transition: background-color 0.1s;
            position: relative;
        }
        .study-cell:hover:not(.header-cell):not(.index-cell) {
            background-color: #eef2ff;
        }
        .header-cell {
            font-weight: 700;
            background-color: #f3f4f6;
            color: #4b5563;
            cursor: pointer;
        }
        .header-cell:hover {
            background-color: #e5e7eb;
        }
        .index-cell {
            background-color: #eef2ff;
            font-weight: 500;
            color: #4f46e5;
            cursor: default;
        }
        /* Content Hiding Effect */
        .study-cell .content {
            transition: opacity 0.3s;
            width: 100%;
        }
        .study-cell.covered .content {
            opacity: 0;
            user-select: none;
        }
        .study-cell.covered:after {
            content: '확인하기';
            position: absolute;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .word-hiragana {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }
        .word-meaning {
            font-size: 14px;
            color: #374151;
        }

        /* --- Floating Drawing Area Styles --- */
        #floating-note-area {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 300px; /* 초기 너비 */
            height: 250px; /* 초기 높이 */
            min-width: 200px; /* 최소 너비 설정 */
            min-height: 150px; /* 최소 높이 설정 */
            background-color: #fffbeb; 
            border: 2px solid #fcd34d;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            resize: both; /* 크기 조절 가능하도록 설정 */
            overflow: hidden; 
        }

        #note-header {
            cursor: grab;
            background-color: #fcd34d;
            color: #78350f;
            padding: 8px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; 
        }
        
        #note-content {
            padding: 5px;
            /* 캔버스가 남은 공간을 채우도록 설정 */
            height: calc(100% - 40px); /* 헤더 높이 제외 */
            overflow: hidden;
        }

        #drawing-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: white; 
            border: 1px solid #fcd34d;
            border-radius: 8px;
            touch-action: none; 
        }
        
        #note-clear-button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        #note-clear-button:hover {
            background-color: #dc2626;
        }

        /* Mobile Adjustments for Floating Note */
        @media (max-width: 768px) {
            #floating-note-area {
                width: 90%;
                left: 5%;
                right: 5%;
                bottom: 20px;
                top: auto;
                height: 200px; 
                resize: none; /* 모바일에서는 수동 크기 조절 비활성화 */
            }
        }
    </style>
</head>

    <script type="module">
        // Global Variables
        let vocabulary = [];
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let incorrectAnswers = [];
        
        const QUIZ_COUNT = 20;
        const BASE_FOLDER_URL = "https://api.github.com/repos/ninetaild/ninetaild.github.io/contents/src/";
        const RAW_CONTENT_BASE_URL = "https://raw.githubusercontent.com/ninetaild/ninetaild.github.io/main/src/";
        const dataCellsSelector = '.study-cell[data-row-index]';

        // DOM Elements
        const fileUploadSection = document.getElementById('file-upload-section');
        const quizSection = document.getElementById('quiz-section');
        const studySection = document.getElementById('study-section'); 
        const resultsSection = document.getElementById('results-section');
        const csvUrlInput = document.getElementById('csv-url-input');
        const csvSelect = document.getElementById('csv-select'); 
        const nextButton = document.getElementById('next-button');
        const restartButton = document.getElementById('restart-button');
        const startQuizButton = document.getElementById('start-quiz-button');
        const startStudyButton = document.getElementById('start-study-button'); 
        const backToMenuButton = document.getElementById('back-to-menu-button'); 
        const urlStatusMessage = document.getElementById('url-status-message');
        const studyGridContainer = document.getElementById('study-grid-container'); 
        const toggleAllButton = document.getElementById('toggle-all-button'); 
        
        const floatingNoteArea = document.getElementById('floating-note-area');
        const noteHeader = document.getElementById('note-header');
        const noteClearButton = document.getElementById('note-clear-button');
        const drawingCanvas = document.getElementById('drawing-canvas'); 

        // Quiz/Result Elements
        const questionTextElement = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const quizProgressElement = document.getElementById('quiz-progress');
        const finalScoreElement = document.getElementById('final-score');
        const incorrectListElement = document.getElementById('incorrect-list');
        const feedbackMessage = document.getElementById('feedback-message');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');
        const noIncorrectMessage = document.getElementById('no-incorrect-message');
        
        let ctx; 
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // ----------------------------------------------------------------------
        // UI & State Management Functions
        // ----------------------------------------------------------------------

        function updateStartButtonState(isDisabled, message = '퀴즈 시작 (총 20문제)') {
            startQuizButton.disabled = isDisabled;
            startStudyButton.disabled = isDisabled;
            startQuizButton.textContent = message;
            if (isDisabled) {
                 startStudyButton.textContent = '로딩 중...';
            } else {
                 startStudyButton.textContent = '학습하기 (단어 암기)';
            }
        }
        
        // 섹션 전환 함수 (필기 영역 표시/숨기기 로직 추가)
        function showSection(sectionToShow) {
            fileUploadSection.classList.add('hidden');
            quizSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            studySection.classList.add('hidden');
            errorBox.classList.add('hidden');
            
            if (sectionToShow) {
                sectionToShow.classList.remove('hidden');
                // 학습/퀴즈 모드일 때만 필기 영역 표시
                if (sectionToShow === studySection || sectionToShow === quizSection) {
                    floatingNoteArea.classList.remove('hidden');
                    // 캔버스 크기 조정
                    resizeCanvas();
                } else {
                    floatingNoteArea.classList.add('hidden');
                }
            } else {
                floatingNoteArea.classList.add('hidden');
            }
        }

        // ----------------------------------------------------------------------
        // Data Source Management Functions (unchanged)
        // ----------------------------------------------------------------------

        async function loadCsvFileOptions() {
            csvSelect.innerHTML = '<option value="" disabled>-- CSV 파일을 선택하세요 --</option>';
            csvSelect.querySelector('option[disabled]').textContent = '파일 목록 로딩 중...';
            updateStartButtonState(true);

            try {
                const response = await fetch(BASE_FOLDER_URL);
                if (!response.ok) {
                    throw new Error(`GitHub API 통신 오류: ${response.status}.`);
                }
                const files = await response.json();
                
                const csvFiles = files
                    .filter(file => file.name.endsWith('.csv') && file.type === 'file')
                    .map(file => file.name);

                csvSelect.innerHTML = '<option value="">-- CSV 파일을 선택하세요 --</option>';
                
                if (csvFiles.length > 0) {
                    csvFiles.forEach(fileName => {
                        const option = document.createElement('option');
                        option.value = RAW_CONTENT_BASE_URL + fileName;
                        option.textContent = fileName;
                        csvSelect.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.value = "";
                    option.textContent = "사용 가능한 CSV 파일이 없습니다.";
                    option.disabled = true;
                    csvSelect.appendChild(option);
                }
                
                csvSelect.selectedIndex = 0;
                updateStartButtonState(false);
            } catch (error) {
                console.error("CSV 목록 로드 오류:", error);
                csvSelect.innerHTML = '<option value="" disabled>-- 파일 목록 로드 실패 --</option>';
                urlStatusMessage.textContent = `CSV 파일 목록을 로드하지 못했습니다. (오류: ${error.message}). URL을 직접 입력해 주세요.`;
                urlStatusMessage.classList.add('text-red-500');
                updateStartButtonState(false);
            }
        }

        // ----------------------------------------------------------------------
        // Data Loading & Parsing Functions (unchanged)
        // ----------------------------------------------------------------------

        function parseCSVText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length <= 1) {
                throw new Error("CSV 데이터에 헤더를 제외한 유효한 단어 데이터가 없습니다.");
            }
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const parts = [];
                let current = '';
                let inQuotes = false;
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        parts.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                parts.push(current.trim());

                if (parts.length >= 4) {
                    data.push({
                        hiragana: parts[0].replace(/^"|"$/g, ''), 
                        koreanPronunciation: parts[1].replace(/^"|"$/g, ''),
                        kanji: parts[2].replace(/^"|"$/g, ''), 
                        koreanMeaning: parts[3].replace(/^"|"$/g, ''),
                    });
                }
            }
            return data;
        }

        async function loadVocabularyFromURL(url) {
            if (!url) {
                throw new Error("URL을 선택하거나 입력해 주세요.");
            }

            urlStatusMessage.textContent = `단어 로딩 중: ${url}`;
            urlStatusMessage.classList.remove('text-red-500');
            updateStartButtonState(true, '로딩 중...');

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP 상태 ${response.status}. URL을 확인해 주세요.`);
                }
                
                const text = await response.text();
                const data = parseCSVText(text);

                if (data.length < 4) {
                    throw new Error(`퀴즈를 시작하기 위한 최소 단어(4개)가 부족합니다. 현재: ${data.length}개`);
                }
                
                urlStatusMessage.textContent = `단어 ${data.length}개 로드 완료. 학습 또는 퀴즈를 시작하세요.`;
                updateStartButtonState(false);
                return data;

            } catch (error) {
                urlStatusMessage.textContent = `단어 로드 실패: ${error.message}`;
                urlStatusMessage.classList.add('text-red-500');
                updateStartButtonState(false);
                throw error; 
            }
        }
        
        // ----------------------------------------------------------------------
        // Quiz Core Logic (unchanged)
        // ----------------------------------------------------------------------
        
        function createQuiz(data) {
            if (data.length < 4) return [];
            
            const questions = [];
            const dataToUse = [...data].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < QUIZ_COUNT; i++) {
                const correctWord = dataToUse[i % dataToUse.length]; 
                const questionTypes = ['meaning_match', 'hiragana_meaning_match', 'pronunciation_match', 'hiragana_pronunciation_match'];
                const quizType = questionTypes[Math.floor(Math.random() * questionTypes.length)]; 

                let question = {};
                let optionsSourceField = ''; 

                if (quizType === 'meaning_match') {
                    question.type = 'meaning_match';
                    const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';
                    question.text = `다음 단어의 뜻은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                    question.correctAnswerText = correctWord.koreanMeaning;
                    optionsSourceField = 'koreanMeaning';
                } else if (quizType === 'hiragana_meaning_match') {
                    question.type = 'hiragana_meaning_match';
                    question.text = `다음 뜻에 해당하는 단어는? [${correctWord.koreanMeaning}]`;
                    question.correctAnswerText = correctWord.hiragana;
                    optionsSourceField = 'hiragana';
                } else if (quizType === 'pronunciation_match') {
                    question.type = 'pronunciation_match';
                    const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';
                    question.text = `다음 단어의 한글 발음은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                    question.correctAnswerText = correctWord.koreanPronunciation;
                    optionsSourceField = 'koreanPronunciation';
                } else if (quizType === 'hiragana_pronunciation_match') {
                    question.type = 'hiragana_pronunciation_match';
                    question.text = `다음 한글 발음에 해당하는 단어는? [${correctWord.koreanPronunciation}]`;
                    question.correctAnswerText = correctWord.hiragana;
                    optionsSourceField = 'hiragana';
                }
                
                const options = [];
                options.push({ 
                    text: question.correctAnswerText, 
                    isCorrect: true, 
                    fullData: correctWord 
                });

                const potentialIncorrects = data.filter(item => 
                    item[optionsSourceField] !== question.correctAnswerText && item.hiragana !== correctWord.hiragana
                );
                
                const shuffledIncorrects = [...potentialIncorrects].sort(() => 0.5 - Math.random());

                for (let j = 0; j < 3; j++) {
                    let distractor;
                    if (j < shuffledIncorrects.length) {
                        distractor = shuffledIncorrects[j];
                    } else {
                         const fillerWord = data[Math.floor(Math.random() * data.length)];
                         distractor = { 
                             ...fillerWord, 
                             [optionsSourceField]: (fillerWord[optionsSourceField] || fillerWord.koreanMeaning) + ' (오답)',
                         }; 
                    }

                    let optionText = distractor[optionsSourceField];
                    if (!options.some(opt => opt.text === optionText)) {
                         options.push({ 
                            text: optionText, 
                            isCorrect: false, 
                            fullData: distractor 
                        });
                    } else {
                        options.push({
                            text: optionText + ' (중복)',
                            isCorrect: false,
                            fullData: distractor
                        });
                    }
                }
                
                options.sort(() => 0.5 - Math.random());
                
                questions.push({
                    ...question,
                    options: options,
                    correctFullData: correctWord 
                });
            }
            
            return questions;
        }

        function displayQuestion(question) {
            const currentNumber = currentQuestionIndex + 1;
            quizProgressElement.textContent = `문제 ${currentNumber} / ${QUIZ_COUNT}`;
            questionTextElement.innerHTML = question.text;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');
            nextButton.classList.add('hidden');
            nextButton.disabled = true;

            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = `<span class="option-text font-medium">${option.text}</span>`;
                button.className = 'option-button w-full text-left rounded-lg text-gray-700 hover:bg-indigo-50 hover:shadow-md';
                button.onclick = () => handleAnswer(button, option.isCorrect, question, index);
                button.disabled = false;
                button.dataset.optionIndex = index; 
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswer(selectedButton, isCorrect, currentQuestion, selectedOptionIndex) {
            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
            feedbackMessage.classList.remove('hidden');
            
            let feedbackText = '';
            let feedbackClass = '';

            if (isCorrect) {
                feedbackClass = 'p-3 rounded-lg text-center font-medium bg-green-100 text-green-700';
                feedbackText = '정답입니다! 잘하셨어요.';
            } else {
                feedbackClass = 'p-3 rounded-lg text-center font-medium bg-red-100 text-red-700';
                feedbackText = '오답입니다. 정답과 오답 단어의 정보를 비교해 보세요.';

                const correctWordData = currentQuestion.correctFullData;
                if (!incorrectAnswers.some(a => a.hiragana === correctWordData.hiragana)) {
                     incorrectAnswers.push(correctWordData);
                }
            }
            
            document.querySelectorAll('#options-container button').forEach(btn => {
                const optionIndex = parseInt(btn.dataset.optionIndex);
                const optionData = currentQuestion.options[optionIndex]; 

                if (optionData.isCorrect) {
                     btn.classList.remove('disabled'); 
                     btn.classList.add('correct');
                } else if (btn === selectedButton) {
                     btn.classList.add('incorrect');
                }
                
                const wordDetailHtml = createDetailHtml(optionData.fullData);
                const originalOptionText = btn.querySelector('.option-text').textContent;
                
                btn.innerHTML = `<span class="option-text font-medium">${originalOptionText}</span>${wordDetailHtml}`;
            });


            feedbackMessage.className = feedbackClass;
            feedbackMessage.innerHTML = `<p class="text-center">${feedbackText}</p>`;

            nextButton.disabled = false;
            nextButton.classList.remove('hidden');
        }
        
        function createDetailHtml(wordData) {
             const kanjiDisplay = wordData.kanji && wordData.kanji !== '(조사)' ? 
                                 `<p><span class="font-semibold">한자 표기:</span> ${wordData.kanji}</p>` : '';
            
            return `
                <div class="word-detail mt-3 pt-3 w-full border-t border-gray-300 space-y-1 text-xs">
                    <h5 class="font-bold text-indigo-700">단어 상세 정보:</h5>
                    <p><span class="font-semibold">히라가나:</span> <span class="text-sm font-extrabold">${wordData.hiragana}</span></p>
                    ${kanjiDisplay}
                    <p><span class="font-semibold">발음:</span> ${wordData.koreanPronunciation}</p>
                    <p><span class="font-semibold">뜻:</span> ${wordData.koreanMeaning}</p>
                </div>
            `;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUIZ_COUNT) {
                displayQuestion(quizQuestions[currentQuestionIndex]);
            } else {
                showResults();
            }
        }

        function showResults() {
            showSection(resultsSection);

            const score = QUIZ_COUNT - incorrectAnswers.length;
            finalScoreElement.textContent = `${score} / ${QUIZ_COUNT} (정답률: ${Math.round((score / QUIZ_COUNT) * 100)}%)`;

            incorrectListElement.innerHTML = '';
            if (incorrectAnswers.length > 0) {
                incorrectAnswers.forEach(word => {
                    const listItem = document.createElement('li');
                    listItem.className = 'p-3 bg-gray-50 rounded-lg border-l-4 border-red-400 shadow-sm';
                    listItem.innerHTML = `
                        <p class="font-bold text-gray-800">${word.hiragana} (${word.kanji})</p>
                        <p class="text-sm text-gray-600 ml-2">발음: ${word.koreanPronunciation}, 뜻: ${word.koreanMeaning}</p>
                    `;
                    incorrectListElement.appendChild(listItem);
                });
                noIncorrectMessage.classList.add('hidden');
            } else {
                noIncorrectMessage.classList.remove('hidden');
            }
        }

        // ----------------------------------------------------------------------
        // Study Mode Logic (unchanged)
        // ----------------------------------------------------------------------
        
        function handleCellClick(event) {
            const clickedCell = event.currentTarget;
            
            if (clickedCell.dataset.rowIndex === undefined) return;
            
            clickedCell.classList.toggle('covered');

            updateToggleAllButtonText(); 
        }

        function handleColumnClick(event) {
            const clickedHeader = event.currentTarget;
            const colKey = clickedHeader.dataset.colKey;

            if (colKey === 'index' || !colKey) return; 

            const colCells = studyGridContainer.querySelectorAll(`.study-cell[data-col-key="${colKey}"][data-row-index]`);

            const shouldCover = Array.from(colCells).some(cell => !cell.classList.contains('covered'));

            colCells.forEach(cell => {
                if (shouldCover) {
                    cell.classList.add('covered');
                } else {
                    cell.classList.remove('covered');
                }
            });
            updateToggleAllButtonText();
        }

        function toggleAllCells() {
            const cells = studyGridContainer.querySelectorAll(dataCellsSelector);
            const shouldCoverAll = Array.from(cells).some(cell => !cell.classList.contains('covered'));
            
            cells.forEach(cell => {
                if (shouldCoverAll) {
                    cell.classList.add('covered');
                } else {
                    cell.classList.remove('covered');
                }
            });
            
            updateToggleAllButtonText(!shouldCoverAll);
        }

        function updateToggleAllButtonText(isCurrentlyAllCovered = null) {
            if (!toggleAllButton) return;
            
            const cells = studyGridContainer.querySelectorAll(dataCellsSelector);
            if (cells.length === 0) {
                toggleAllButton.textContent = '데이터 없음';
                return;
            }
            
            const allCovered = isCurrentlyAllCovered !== null ? isCurrentlyAllCovered : 
                                 Array.from(cells).every(cell => cell.classList.contains('covered'));

            if (allCovered) {
                toggleAllButton.textContent = '모두 확인';
            } else {
                toggleAllButton.textContent = '모두 가리기';
            }
        }

        function renderStudyGrid(data) {
             studyGridContainer.innerHTML = '';
            
            const grid = document.createElement('div');
            grid.className = 'study-grid';
            
            const headers = [
                { key: 'index', label: '#' },
                { key: 'hiragana', label: '단어 (히라가나)' },
                { key: 'koreanPronunciation', label: '한글 발음' },
                { key: 'kanji', label: '한자 표기' },
                { key: 'koreanMeaning', label: '뜻 (한국어)' }
            ];

            // 1. 헤더 행 생성
            headers.forEach(header => {
                const headerCell = document.createElement('div');
                headerCell.className = 'study-cell header-cell';
                headerCell.textContent = header.label;
                headerCell.dataset.colKey = header.key;
                
                if (header.key !== 'index') {
                    headerCell.onclick = handleColumnClick; 
                } else {
                    headerCell.style.cursor = 'default';
                }
                
                grid.appendChild(headerCell);
            });

            // 2. 데이터 행 생성
            data.forEach((word, rowIndex) => { 
                const indexCell = document.createElement('div');
                indexCell.className = 'study-cell index-cell';
                indexCell.textContent = rowIndex + 1;
                grid.appendChild(indexCell);

                headers.slice(1).forEach(header => {
                    const cell = document.createElement('div');
                    cell.className = 'study-cell'; 
                    
                    cell.onclick = handleCellClick; 
                    
                    cell.dataset.rowIndex = rowIndex;
                    cell.dataset.colKey = header.key;
                    
                    let content;
                    if (header.key === 'hiragana') {
                        content = `<span class="content word-hiragana">${word[header.key]}</span>`;
                    } else if (header.key === 'koreanMeaning') {
                        content = `<span class="content word-meaning">${word[header.key]}</span>`;
                    } else {
                        content = `<span class="content">${word[header.key]}</span>`;
                    }

                    cell.innerHTML = content;
                    grid.appendChild(cell);
                });
            });

            studyGridContainer.appendChild(grid);
            updateToggleAllButtonText(false);
        }
        
        // ----------------------------------------------------------------------
        // Floating Drawing Area Logic (New)
        // ----------------------------------------------------------------------

        function resizeCanvas() {
            if (drawingCanvas) {
                 // 캔버스의 실제 해상도를 DOM 요소 크기에 맞춤
                const rect = drawingCanvas.getBoundingClientRect();
                
                // rect.width, rect.height가 0보다 클 때만 설정 (ResizeObserver 초기 호출 등 대비)
                if (rect.width > 0 && rect.height > 0) {
                    drawingCanvas.width = rect.width;
                    drawingCanvas.height = rect.height;
                }
                
                // 크기 조정 후 드로잉 스타일 재설정
                if (ctx) {
                    ctx.strokeStyle = '#1f2937'; // 짙은 회색
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }
            }
        }
        
        function draw(e) {
            if (!isDrawing) return;

            // 마우스 또는 터치 좌표 가져오기
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX === undefined || clientY === undefined) return;

            // 캔버스 내에서의 상대 좌표 계산
            const rect = drawingCanvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            [lastX, lastY] = [x, y];
        }

        function startDrawing(e) {
            e.preventDefault(); // 드로잉 시 터치 스크롤 방지
            isDrawing = true;
             // 마우스 또는 터치 좌표 가져오기
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX === undefined || clientY === undefined) return;

            const rect = drawingCanvas.getBoundingClientRect();
            [lastX, lastY] = [clientX - rect.left, clientY - rect.top];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
             // 사용자에게 피드백 제공
            noteHeader.style.backgroundColor = '#d9f99d'; 
            setTimeout(() => {
                noteHeader.style.backgroundColor = '#fcd34d'; 
            }, 500);
        }

        function setupFloatingNoteArea() {
            // 캔버스 초기화
            ctx = drawingCanvas.getContext('2d');
            resizeCanvas(); 
            
            // 드로잉 이벤트 리스너
            drawingCanvas.addEventListener('mousedown', startDrawing);
            drawingCanvas.addEventListener('mousemove', draw);
            drawingCanvas.addEventListener('mouseup', stopDrawing);
            drawingCanvas.addEventListener('mouseout', stopDrawing); 

            // 터치 이벤트 리스너 (모바일 지원)
            drawingCanvas.addEventListener('touchstart', startDrawing);
            drawingCanvas.addEventListener('touchmove', draw);
            drawingCanvas.addEventListener('touchend', stopDrawing);

            // '비우기' 버튼 기능
            noteClearButton.addEventListener('click', clearCanvas);
            
            // --- ResizeObserver: 사용자가 floating-note-area 크기 변경 시 캔버스 해상도 조정 ---
            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(entries => {
                    // requestAnimationFrame을 사용하여 리사이즈가 끝난 후 해상도를 맞춤
                    requestAnimationFrame(resizeCanvas); 
                });
                // 캔버스 컨테이너를 관찰
                observer.observe(floatingNoteArea); 
            }
            
            // ------------------ 드래그 기능 (이전 코드 재사용) ------------------
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            // 저장된 위치 로드
            const savedPosition = localStorage.getItem('japaneseNotePosition');
            if (savedPosition) {
                try {
                    const { x, y } = JSON.parse(savedPosition);
                    floatingNoteArea.style.left = `${x}px`;
                    floatingNoteArea.style.top = `${y}px`;
                    // offset을 로드된 위치로 초기화 (중요)
                    xOffset = x; 
                    yOffset = y;
                } catch (e) {
                    // JSON 파싱 오류 시 기본 위치 (CSS 설정) 사용
                    console.error("Failed to parse saved position:", e);
                }
            } else {
                 // 처음 로드 시 CSS 위치를 offset으로 설정
                 xOffset = floatingNoteArea.offsetLeft;
                 yOffset = floatingNoteArea.offsetTop;
            }

            function dragStart(e) {
                // 크기 조절 핸들(우측 하단)에서 드래그 시작 방지
                const isResizeHandle = e.offsetX > floatingNoteArea.offsetWidth - 20 && 
                                       e.offsetY > floatingNoteArea.offsetHeight - 20;
                
                if (isResizeHandle) return;


                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                if (clientX === undefined || clientY === undefined) return;

                initialX = clientX - floatingNoteArea.offsetLeft;
                initialY = clientY - floatingNoteArea.offsetTop;

                // 헤더를 클릭했을 때만 드래그 시작
                if (e.target === noteHeader || e.target.parentElement === noteHeader) {
                    e.preventDefault();
                    isDragging = true;
                    noteHeader.style.cursor = 'grabbing';
                }
            }

            function dragEnd() {
                if (isDragging) {
                    isDragging = false;
                    noteHeader.style.cursor = 'grab';
                    
                    // 최종 위치 저장
                    const finalX = floatingNoteArea.offsetLeft;
                    const finalY = floatingNoteArea.offsetTop;
                    localStorage.setItem('japaneseNotePosition', JSON.stringify({ x: finalX, y: finalY }));
                    xOffset = finalX; // offset 갱신
                    yOffset = finalY;
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                    if (clientX === undefined || clientY === undefined) return;

                    currentX = clientX - initialX;
                    currentY = clientY - initialY;

                    const minX = 0;
                    const minY = 0;
                    const maxX = window.innerWidth - floatingNoteArea.offsetWidth;
                    const maxY = window.innerHeight - floatingNoteArea.offsetHeight;

                    const newX = Math.min(Math.max(currentX, minX), maxX);
                    const newY = Math.min(Math.max(currentY, minY), maxY);

                    floatingNoteArea.style.left = newX + "px";
                    floatingNoteArea.style.top = newY + "px";
                }
            }
            
            noteHeader.addEventListener("mousedown", dragStart);
            noteHeader.addEventListener("touchstart", dragStart); 
            
            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("touchend", dragEnd);
            
            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag);
            
            // 창 크기 변경 시 캔버스 해상도도 변경되도록 리스너 추가
            window.addEventListener('resize', resizeCanvas);
        }

        // ----------------------------------------------------------------------
        // Common Loading & Start Functions (unchanged)
        // ----------------------------------------------------------------------

        async function prepareDataAndSwitch(mode) {
            let url = csvSelect.value || csvUrlInput.value.trim();

            if (!url) {
                urlStatusMessage.textContent = 'CSV 파일을 선택하거나 URL을 직접 입력해 주세요.';
                urlStatusMessage.classList.add('text-red-500');
                return;
            }
            if (url === 'loading') return;

            updateStartButtonState(true, '데이터 로딩 및 준비 중...');
            errorBox.classList.add('hidden');

            try {
                vocabulary = await loadVocabularyFromURL(url);

                if (mode === 'quiz') {
                    incorrectAnswers = [];
                    currentQuestionIndex = 0;
                    quizQuestions = createQuiz(vocabulary); 
                    
                    if (quizQuestions.length === 0) {
                        throw new Error("퀴즈 생성을 위한 문제가 충분하지 않습니다. (최소 4개 단어 필요)");
                    }
                    showSection(quizSection);
                    displayQuestion(quizQuestions[currentQuestionIndex]);
                    
                } else if (mode === 'study') {
                    renderStudyGrid(vocabulary);
                    showSection(studySection);
                }
                
                updateStartButtonState(false); 

            } catch (error) {
                showSection(fileUploadSection); 
            }
        }

        async function startQuiz() {
            await prepareDataAndSwitch('quiz');
        }

        async function startStudy() {
            await prepareDataAndSwitch('study');
        }
        
        function goBackToMenu() {
            showSection(fileUploadSection);
            if (vocabulary.length > 0) {
                 urlStatusMessage.textContent = `현재 ${vocabulary.length}개의 단어가 로드되어 있습니다.`;
            } else {
                 urlStatusMessage.textContent = 'CSV 파일을 선택하거나 URL을 직접 입력해 퀴즈/학습을 시작하세요.';
            }
            urlStatusMessage.classList.remove('text-red-500');
            updateStartButtonState(false);
        }

        // ----------------------------------------------------------------------
        // Initialization & Event Listeners
        // ----------------------------------------------------------------------

        function setupEventListeners() {
            startQuizButton.addEventListener('click', startQuiz);
            startStudyButton.addEventListener('click', startStudy); 
            nextButton.addEventListener('click', nextQuestion);
            restartButton.addEventListener('click', goBackToMenu);
            backToMenuButton.addEventListener('click', goBackToMenu); 
            
            toggleAllButton.addEventListener('click', toggleAllCells);
            
            csvSelect.addEventListener('change', () => {
                if (csvSelect.value) {
                    csvUrlInput.value = ''; 
                }
                urlStatusMessage.textContent = '선택된 파일 또는 입력된 URL로 학습/퀴즈를 시작하세요.';
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
            
            csvUrlInput.addEventListener('input', () => {
                if (csvUrlInput.value.trim()) {
                     csvSelect.selectedIndex = 0; 
                }
                urlStatusMessage.textContent = '직접 입력된 URL로 학습/퀴즈를 시작합니다.';
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
            
            // 필기 영역 관련 이벤트 리스너 설정
            setupFloatingNoteArea(); 
        }

        // 초기화 함수
        window.onload = function() {
            setupEventListeners();
            loadCsvFileOptions(); 
            csvUrlInput.value = ''; 
            urlStatusMessage.textContent = 'CSV 파일을 로딩 중입니다. 잠시만 기다려주세요.';
            updateStartButtonState(true); 
            
            // 페이지 로드 시에는 메뉴 화면으로 시작
            showSection(fileUploadSection);
        };

    </script>
