<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 퀴즈 및 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 폰트 및 기본 스타일 정의 */
        @import url('https://fonts/googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: relative; 
        }
        
        /* 퀴즈 옵션 버튼 스타일 */
        .option-button {
            transition: all 0.2s;
            border: 2px solid #e5e7eb;
            min-height: 100px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            justify-content: flex-start; 
            text-align: left;
            padding: 1rem; 
        }
        .option-button:hover:not(.disabled):not(.correct):not(.incorrect) {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .correct { background-color: #d1fae5; border-color: #10b981; font-weight: 600; }
        .incorrect { background-color: #fee2e2; border-color: #ef4444; font-weight: 600; }
        .disabled { cursor: not-allowed; opacity: 0.8; }
        
        /* 학습 모드 Grid 스타일 */
        #study-grid-container { width: 100%; overflow-x: auto; }
        .study-grid {
            display: grid;
            grid-template-columns: 50px repeat(4, minmax(120px, 1fr));
            border-left: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
            min-width: 600px;
        }
        .study-cell {
            padding: 10px;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
            font-size: 14px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            transition: background-color 0.1s;
            position: relative;
        }
        .study-cell:hover:not(.header-cell):not(.index-cell) { background-color: #eef2ff; }
        .header-cell { font-weight: 700; background-color: #f3f4f6; color: #4b5563; cursor: pointer; }
        .index-cell { background-color: #eef2ff; font-weight: 500; color: #4f46e5; cursor: default; }
        
        /* 가리기/확인 효과 */
        .study-cell .content { transition: opacity 0.3s; width: 100%; }
        .study-cell.covered .content { opacity: 0; user-select: none; }
        .study-cell.covered:after {
            content: '확인하기';
            position: absolute;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
        }
        
        /* --- Floating Drawing Area Styles --- */
        #floating-note-area {
            position: fixed;
            top: 100px; 
            right: 20px; 
            width: 300px; 
            height: 250px; 
            min-width: 200px; 
            min-height: 150px; 
            background-color: #fffbeb; 
            border: 2px solid #fcd34d;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            resize: both; 
            overflow: hidden; 
            transition: all 0.3s ease; 
        }
        
        /* 최소화 모드: 우측 하단에 고정된 작은 복구 버튼 형태 */
        #floating-note-area.minimized {
            width: 160px !important; 
            height: 48px !important;
            min-width: 160px;
            min-height: 48px;
            
            /* 핵심: 모든 위치를 강제로 우측 하단으로 고정 */
            right: 20px !important;
            bottom: 20px !important;
            top: auto !important;
            left: auto !important;
            
            resize: none; 
            cursor: pointer; 
            border-color: #8b5cf6; 
            background-color: #ede9fe;
        }

        #note-header {
            cursor: grab;
            background-color: #fcd34d;
            color: #78350f;
            padding: 8px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; 
        }

        /* 최소화 모드: 헤더 스타일 변경 및 내용 숨기기 */
        #floating-note-area.minimized #note-header {
             background-color: transparent; 
             cursor: pointer;
             padding: 0; 
             height: 100%;
             width: 100%;
        }
        
        #floating-note-area.minimized #note-title,
        #floating-note-area.minimized #header-controls {
            display: none; 
        }

        #floating-note-area.minimized #restore-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #4f46e5; 
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        #note-content {
            padding: 5px;
            height: calc(100% - 40px); 
            overflow: hidden;
        }

        #floating-note-area.minimized #note-content {
            display: none; 
        }

        #drawing-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: white; 
            border: 1px solid #fcd34d;
            border-radius: 8px;
            touch-action: none; 
        }
        
        .control-button {
            background: none;
            border: none;
            color: #78350f;
            cursor: pointer;
            margin-left: 8px;
            padding: 4px;
            border-radius: 4px;
            transition: background-color 0.1s;
        }
        .control-button:hover { background-color: rgba(255, 255, 255, 0.3); }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #floating-note-area {
                width: 90%;
                left: 5%;
                right: 5%;
                bottom: 20px;
                top: auto;
                height: 200px; 
                resize: none; 
            }
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- Header -->
        <header class="bg-indigo-600 p-6 mb-6 rounded-xl shadow-lg text-white">
            <h1 class="text-3xl font-bold text-center">일본어 단어 퀴즈 및 학습</h1>
        </header>

        <!-- Main Content Area -->
        <main id="app-container" class="space-y-6">
            <!-- Data Source Configuration Section -->
            <div id="file-upload-section" class="card">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">1. CSV 데이터 출처 설정</h2>

                <div id="input-area" class="space-y-4 p-4 border rounded-lg bg-gray-50">
                    <p class="text-sm font-bold text-gray-700">A. GitHub 파일 목록 선택</p>
                    <select id="csv-select" class="w-full p-2 border rounded-md bg-white text-gray-800 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="">-- CSV 파일을 선택하세요 --</option>
                        <option value="loading" disabled>파일 목록 로딩 중...</option>
                    </select>

                    <p class="text-sm font-bold text-gray-700 pt-2">B. URL 직접 입력</p>
                    <input type="text" id="csv-url-input" 
                           class="w-full p-2 border rounded-md bg-white text-gray-800 text-sm focus:border-indigo-500 focus:ring-indigo-500" 
                           value=""
                           placeholder="유효한 CSV 파일 URL을 직접 입력하세요">
                    <p id="url-status-message" class="text-xs mt-2 text-gray-500"></p>
                </div>
                
                <div class="mt-6 pt-4 border-t flex justify-center space-x-4">
                    <button id="start-study-button" class="px-8 py-3 bg-indigo-500 text-white font-bold rounded-full hover:bg-indigo-600 transition duration-150 disabled:opacity-50">
                        학습하기 (단어 암기)
                    </button>
                    <button id="start-quiz-button" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-full hover:bg-indigo-700 transition duration-150 disabled:opacity-50">
                        퀴즈 시작 (총 20문제)
                    </button>
                </div>
            </div>

            <!-- Study Section -->
            <div id="study-section" class="hidden">
                <div class="card space-y-4">
                    <h2 class="text-2xl font-bold text-gray-700 text-center">단어 학습 모드</h2>
                    
                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg border">
                        <p class="text-sm text-gray-600">데이터 셀을 클릭하면 해당 셀만, 헤더를 클릭하면 해당 열이 토글됩니다.</p>
                        <button id="toggle-all-button" class="px-4 py-2 text-sm bg-blue-500 text-white font-semibold rounded-full hover:bg-blue-600 transition duration-150 shadow-md">
                            모두 가리기
                        </button>
                    </div>

                    <div id="study-grid-container" class="rounded-lg border overflow-hidden shadow-inner bg-white">
                        <!-- Grid will be injected here -->
                    </div>
                    
                    <div class="text-center pt-4 border-t">
                        <button id="back-to-menu-button" class="px-6 py-2 bg-gray-500 text-white font-semibold rounded-full hover:bg-gray-600 transition duration-150">
                            처음으로 돌아가기
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quiz Section -->
            <div id="quiz-section" class="hidden">
                <div class="card space-y-6">
                    <div>
                        <p id="quiz-progress" class="text-lg font-medium text-indigo-600 mb-4 text-center"></p>
                        <div id="question-card" class="bg-indigo-50 p-6 rounded-lg shadow-inner text-center">
                            <h3 class="text-2xl font-bold text-gray-800" id="question-text"></h3>
                        </div>
                    </div>
                    
                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Option buttons will be injected here -->
                    </div>

                    <div id="feedback-message" class="hidden p-3 rounded-lg text-center font-medium"></div>
                    
                    <div class="text-center">
                        <button id="next-button" class="hidden px-6 py-2 bg-indigo-600 text-white font-semibold rounded-full hover:bg-indigo-700 transition duration-150" disabled>
                            다음 문제
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="hidden card space-y-6">
                <h2 class="text-2xl font-bold text-center text-gray-700">퀴즈 완료!</h2>
                <div class="text-center space-y-2">
                    <p class="text-xl text-gray-600">총 20문제 중:</p>
                    <p id="final-score" class="text-3xl font-extrabold text-indigo-600"></p>
                </div>
                
                <div id="incorrect-answers-summary" class="border-t pt-4">
                    <h3 class="text-xl font-semibold text-red-600 mb-3">오답 정리 (복습 필요!)</h3>
                    <ul id="incorrect-list" class="space-y-3">
                        <!-- Incorrect answers will be listed here -->
                    </ul>
                    <p id="no-incorrect-message" class="text-gray-500 hidden italic">정답률 100%! 완벽합니다!</p>
                </div>
                
                <div class="text-center pt-4 border-t">
                    <button id="restart-button" class="px-8 py-3 bg-green-500 text-white font-bold rounded-full hover:bg-green-600 transition duration-150">
                        다시 퀴즈 시작 (20회)
                    </button>
                </div>
            </div>

            <!-- Error Message Box -->
            <div id="error-box" class="hidden card bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-bold">오류 발생</p>
                <p id="error-message"></p>
            </div>

        </main>
    </div>

    <!-- --- Floating Drawing Area (Draggable, Resizable & MINIMIZABLE) --- -->
    <!-- 초기에는 hidden 상태를 유지합니다. -->
    <div id="floating-note-area" class="hidden"> 
        <div id="note-header">
            <span id="note-title">🎨 학습 필기 공간 (히라가나/한자 연습)</span>
            
            <!-- 복구 버튼 레이블 (최소화 모드에서만 표시) -->
            <div id="restore-label" class="hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                창 복구
            </div>

            <div id="header-controls" class="flex items-center">
                <button id="note-clear-button" class="bg-red-500 text-white border-none p-1 px-2 rounded-md text-xs hover:bg-red-600 transition">모두 지우기</button>
            </div>
        </div>
        <div id="note-content">
            <canvas id="drawing-canvas"></canvas>
        </div>
    </div>
    <!-- --------------------------------------- -->
    
    <!-- 분리된 최소화/최대화 버튼 (창 외부에 위치) -->
    <!-- 초기에는 hidden 상태를 유지합니다. -->
    <button id="minimizeButton" class="absolute z-50 p-2 bg-pink-500 hover:bg-pink-600 text-white rounded-full shadow-lg focus:outline-none focus:ring-4 focus:ring-pink-300 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300 hidden">
        <svg id="minimizeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        <svg id="maximizeIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
    </button>
    <!-- --------------------------------------- -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Firebase setup (Mandatory)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let firebaseConfig;
        try {
            firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        } catch (e) {
            console.error("Firebase Config 파싱 오류:", e);
            firebaseConfig = {};
        }
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        let db, auth;
        let userId = null;

        const initFirebase = async () => {
            if (Object.keys(firebaseConfig).length === 0) {
                 console.warn("Firebase 설정이 정의되지 않았습니다.");
                 return;
            }
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, (user) => {
                    userId = user ? user.uid : crypto.randomUUID();
                    console.log("Firebase Auth State Changed. User ID:", userId);
                });

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Firebase 초기화 또는 인증 오류:", error);
            }
        };
        initFirebase();
        
        // Global Variables
        let vocabulary = [];
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let incorrectAnswers = [];
        let isMinimized = false;
        
        // 최소화 시 창의 위치와 크기를 저장할 객체.
        let savedPositionAndSize = {
            width: 300,
            height: 250,
            left: 0, 
            top: 0
        }; 
        
        const QUIZ_COUNT = 20;
        const BASE_FOLDER_URL = "https://api.github.com/repos/ninetaild/ninetaild.github.io/contents/src/";
        const RAW_CONTENT_BASE_URL = "https://raw.githubusercontent.com/ninetaild/ninetaild.github.io/main/src/";
        const dataCellsSelector = '.study-cell[data-row-index]';

        // DOM Elements
        const [fileUploadSection, quizSection, studySection, resultsSection] = 
              ['file-upload-section', 'quiz-section', 'study-section', 'results-section'].map(id => document.getElementById(id));
        const [csvUrlInput, csvSelect] = [document.getElementById('csv-url-input'), document.getElementById('csv-select')];
        const [startQuizButton, startStudyButton] = [document.getElementById('start-quiz-button'), document.getElementById('start-study-button')];
        const [nextButton, restartButton, backToMenuButton, toggleAllButton] = 
              ['next-button', 'restart-button', 'back-to-menu-button', 'toggle-all-button'].map(id => document.getElementById(id));
        const [urlStatusMessage, studyGridContainer] = [document.getElementById('url-status-message'), document.getElementById('study-grid-container')];
        
        // Drawing Area Elements
        const [floatingNoteArea, noteHeader, noteClearButton, drawingCanvas, restoreLabel, headerControls] = 
              ['floating-note-area', 'note-header', 'note-clear-button', 'drawing-canvas', 'restore-label', 'header-controls'].map(id => document.getElementById(id));
        
        // External Minimize Button Elements
        const minimizeButton = document.getElementById('minimizeButton');
        const minimizeIcon = document.getElementById('minimizeIcon');
        const maximizeIcon = document.getElementById('maximizeIcon');

        
        // Quiz/Result Elements
        const [questionTextElement, optionsContainer, quizProgressElement, finalScoreElement, incorrectListElement, feedbackMessage, errorBox, errorMessage, noIncorrectMessage] = 
              ['question-text', 'options-container', 'quiz-progress', 'final-score', 'incorrect-list', 'error-box', 'error-message', 'no-incorrect-message', 'feedback-message'].map(id => document.getElementById(id));
        
        // Drawing state
        let ctx; 
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let isDragging = false;
        let initialX, initialY;

        // ----------------------------------------------------------------------
        // UI & State Management
        // ----------------------------------------------------------------------

        function updateStartButtonState(isDisabled, quizMsg = '퀴즈 시작 (총 20문제)', studyMsg = '학습하기 (단어 암기)') {
            startQuizButton.disabled = isDisabled;
            startStudyButton.disabled = isDisabled;
            startQuizButton.textContent = isDisabled ? '로딩 중...' : quizMsg;
            startStudyButton.textContent = isDisabled ? '로딩 중...' : studyMsg;
        }
        
        function showSection(sectionToShow) {
            [fileUploadSection, quizSection, resultsSection, studySection, errorBox].forEach(s => s.classList.add('hidden'));
            
            const shouldShowNote = sectionToShow === studySection; // 오직 '학습하기'에서만 필기폼을 표시
            
            if (sectionToShow) {
                sectionToShow.classList.remove('hidden');
            }
            
            // 필기 공간 (Floating Note Area) 가시성 제어
            if (shouldShowNote) {
                floatingNoteArea.classList.remove('hidden');
                
                // 학습 모드 진입 시 최소화 상태가 아니면 버튼을 표시
                if (!isMinimized) {
                    minimizeButton.classList.remove('hidden'); 
                    resizeCanvas();
                } else {
                    // 최소화 상태면 버튼을 숨김 (최소화 상태 유지 시)
                    minimizeButton.classList.add('hidden');
                }
                updateMinimizeButtonPosition();
            } else {
                // 퀴즈, 결과, 메뉴 화면에서는 필기폼 및 외부 버튼 모두 숨김
                floatingNoteArea.classList.add('hidden');
                minimizeButton.classList.add('hidden'); 
            }
        }
        
        // ----------------------------------------------------------------------
        // Data Loading & Parsing (Unchanged logic)
        // ----------------------------------------------------------------------
        
        async function loadCsvFileOptions() {
            csvSelect.innerHTML = '<option value="" disabled>-- CSV 파일을 선택하세요 --</option>';
            csvSelect.querySelector('option[disabled]').textContent = '파일 목록 로딩 중...';
            updateStartButtonState(true);

            try {
                const response = await fetch(BASE_FOLDER_URL);
                if (!response.ok) throw new Error(`GitHub API 통신 오류: ${response.status}.`);
                
                const csvFiles = (await response.json())
                    .filter(file => file.name.endsWith('.csv') && file.type === 'file')
                    .map(file => file.name);

                csvSelect.innerHTML = '<option value="">-- CSV 파일을 선택하세요 --</option>';
                
                if (csvFiles.length > 0) {
                    csvFiles.forEach(fileName => {
                        const option = document.createElement('option');
                        option.value = RAW_CONTENT_BASE_URL + fileName;
                        option.textContent = fileName;
                        csvSelect.appendChild(option);
                    });
                } else {
                    csvSelect.innerHTML += '<option value="" disabled>사용 가능한 CSV 파일이 없습니다.</option>';
                }
                
                csvSelect.selectedIndex = 0;
                updateStartButtonState(false);
            } catch (error) {
                console.error("CSV 목록 로드 오류:", error);
                csvSelect.innerHTML = '<option value="" disabled>-- 파일 목록 로드 실패 --</option>';
                urlStatusMessage.textContent = `CSV 파일 목록 로드 실패 (오류: ${error.message}). URL을 직접 입력해 주세요.`;
                urlStatusMessage.classList.add('text-red-500');
                updateStartButtonState(false);
            }
        }

        function parseCSVText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length <= 1) throw new Error("유효한 단어 데이터가 없습니다.");
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const parts = [];
                let current = '';
                let inQuotes = false;
                // Simple CSV parsing, handling escaped commas within quotes
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        parts.push(current.trim().replace(/^"|"$/g, ''));
                        current = '';
                    } else {
                        current += char;
                    }
                }
                parts.push(current.trim().replace(/^"|"$/g, ''));

                if (parts.length >= 4) {
                    data.push({
                        hiragana: parts[0], 
                        koreanPronunciation: parts[1],
                        kanji: parts[2], 
                        koreanMeaning: parts[3],
                    });
                }
            }
            return data;
        }

        async function loadVocabularyFromURL(url) {
            if (!url) throw new Error("URL을 선택하거나 입력해 주세요.");

            urlStatusMessage.textContent = `단어 로딩 중: ${url}`;
            urlStatusMessage.classList.remove('text-red-500');
            updateStartButtonState(true);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP 상태 ${response.status}. URL을 확인해 주세요.`);
                
                const data = parseCSVText(await response.text());

                if (data.length < 4) throw new Error(`퀴즈를 시작하기 위한 최소 단어(4개)가 부족합니다. 현재: ${data.length}개`);
                
                urlStatusMessage.textContent = `단어 ${data.length}개 로드 완료. 학습 또는 퀴즈를 시작하세요.`;
                updateStartButtonState(false);
                return data;

            } catch (error) {
                urlStatusMessage.textContent = `단어 로드 실패: ${error.message}`;
                urlStatusMessage.classList.add('text-red-500');
                updateStartButtonState(false);
                throw error; 
            }
        }
        
        // ----------------------------------------------------------------------
        // Quiz/Study Logic (Unchanged)
        // ----------------------------------------------------------------------
        
        function createQuiz(data) {
            if (data.length < 4) return [];
            
            const questions = [];
            const dataToUse = [...data].sort(() => 0.5 - Math.random());
            const questionTypes = ['meaning_match', 'hiragana_meaning_match', 'pronunciation_match', 'hiragana_pronunciation_match'];
            
            for (let i = 0; i < QUIZ_COUNT; i++) {
                const correctWord = dataToUse[i % dataToUse.length]; 
                const quizType = questionTypes[Math.floor(Math.random() * questionTypes.length)]; 
                let question = { type: quizType };
                let optionsSourceField = ''; 

                const kanjiDisplay = correctWord.kanji && correctWord.kanji !== '(조사)' ? `(${correctWord.kanji})` : '';

                switch (quizType) {
                    case 'meaning_match':
                        question.text = `다음 단어의 뜻은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                        question.correctAnswerText = correctWord.koreanMeaning;
                        optionsSourceField = 'koreanMeaning';
                        break;
                    case 'hiragana_meaning_match':
                        question.text = `다음 뜻에 해당하는 단어는? [${correctWord.koreanMeaning}]`;
                        question.correctAnswerText = correctWord.hiragana;
                        optionsSourceField = 'hiragana';
                        break;
                    case 'pronunciation_match':
                        question.text = `다음 단어의 한글 발음은? [${correctWord.hiragana} ${kanjiDisplay}]`;
                        question.correctAnswerText = correctWord.koreanPronunciation;
                        optionsSourceField = 'koreanPronunciation';
                        break;
                    case 'hiragana_pronunciation_match':
                        question.text = `다음 한글 발음에 해당하는 단어는? [${correctWord.koreanPronunciation}]`;
                        question.correctAnswerText = correctWord.hiragana;
                        optionsSourceField = 'hiragana';
                        break;
                }
                
                const correctOption = { text: question.correctAnswerText, isCorrect: true, fullData: correctWord };
                const incorrectCandidates = data.filter(item => item[optionsSourceField] !== question.correctAnswerText);
                
                const options = [correctOption];
                const shuffledIncorrects = [...incorrectCandidates].sort(() => 0.5 - Math.random()).slice(0, 3);

                shuffledIncorrects.forEach(distractor => {
                    let optionText = distractor[optionsSourceField];
                    // Handle duplicate text options
                    if (options.some(opt => opt.text === optionText)) {
                        optionText += ' (중복)';
                    }
                    options.push({ text: optionText, isCorrect: false, fullData: distractor });
                });
                
                options.sort(() => 0.5 - Math.random());
                questions.push({ ...question, options, correctFullData: correctWord });
            }
            return questions;
        }

        function displayQuestion(question) {
            quizProgressElement.textContent = `문제 ${currentQuestionIndex + 1} / ${QUIZ_COUNT}`;
            questionTextElement.innerHTML = question.text;
            optionsContainer.innerHTML = '';
            feedbackMessage.classList.add('hidden');

            question.options.forEach((option, index) => {

                button.innerHTML = `<span class="option-text font-medium">${option.text}</span>`;
                button.className = 'option-button w-full text-left rounded-lg text-gray-700 shadow-sm hover:bg-indigo-50 hover:shadow-md';
                button.onclick = () => handleAnswer(button, option.isCorrect, question, index);
                button.dataset.optionIndex = index; 
                optionsContainer.appendChild(button);
            });
        }

        function createDetailHtml(wordData) {
             const kanjiDisplay = wordData.kanji && wordData.kanji !== '(조사)' ? 
                                 `<p><span class="font-semibold">한자 표기:</span> ${wordData.kanji}</p>` : '';
            
            return `

                    ${kanjiDisplay}
                    <p><span class="font-semibold">발음:</span> ${wordData.koreanPronunciation}</p>
                    <p><span class="font-semibold">뜻:</span> ${wordData.koreanMeaning}</p>
                </div>
            `;

        function handleAnswer(selectedButton, isCorrect, currentQuestion) {
            document.querySelectorAll('#options-container button').forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
            
            // 1. 피드백 설정
            let feedbackClass, feedbackText;
            if (isCorrect) {
                feedbackClass = 'bg-green-100 text-green-700';
                feedbackText = '정답입니다! 잘하셨어요.';
            } else {
                feedbackClass = 'bg-red-100 text-red-700';
                feedbackText = '오답입니다. 정답과 오답 단어의 정보를 비교해 보세요.';
                const correctWordData = currentQuestion.correctFullData;
                if (!incorrectAnswers.some(a => a.hiragana === correctWordData.hiragana)) {
                     incorrectAnswers.push(correctWordData);
                }
            }
            feedbackMessage.className = `p-3 rounded-lg text-center font-medium ${feedbackClass}`;
            feedbackMessage.innerHTML = `<p class="text-center">${feedbackText}</p>`;
            feedbackMessage.classList.remove('hidden');

            // 2. 버튼 상태 업데이트 및 상세 정보 표시
            document.querySelectorAll('#options-container button').forEach(btn => {
                const optionIndex = parseInt(btn.dataset.optionIndex);
                const optionData = currentQuestion.options[optionIndex]; 

                if (optionData.isCorrect) {
                     btn.classList.remove('disabled'); 
                     btn.classList.add('correct');
                } else if (btn === selectedButton) {
                     btn.classList.add('incorrect');
                }
                
                const wordDetailHtml = createDetailHtml(optionData.fullData);
                const originalOptionText = btn.querySelector('.option-text').textContent;
                btn.innerHTML = `<span class="option-text font-medium">${originalOptionText}</span>${wordDetailHtml}`;
            });

            // 3. 다음 버튼 활성화
            nextButton.disabled = false;
            nextButton.classList.remove('hidden');
        }

        function handleColumnClick(event) {

            const colCells = studyGridContainer.querySelectorAll(`.study-cell[data-col-key="${colKey}"][data-row-index]`);

        // ----------------------------------------------------------------------
        // Floating Drawing Area Logic (Fixed Minimize/Restore with external button)
        // ----------------------------------------------------------------------

        function resizeCanvas() {
            if (drawingCanvas && !isMinimized) {
                const rect = drawingCanvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    drawingCanvas.width = rect.width;
                    drawingCanvas.height = rect.height;
                }
                if (ctx) {
                    ctx.strokeStyle = '#1f2937'; 
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }
            }
        }
        
        function draw(e) {
            if (!isDrawing || isMinimized) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX === undefined || clientY === undefined) return;

            const rect = drawingCanvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            [lastX, lastY] = [x, y];
        }

        function startDrawing(e) {
            if (isMinimized) return;
            e.preventDefault(); 
            isDrawing = true;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX === undefined || clientY === undefined) return;

            const rect = drawingCanvas.getBoundingClientRect();
            [lastX, lastY] = [clientX - rect.left, clientY - rect.top];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            if (isMinimized) return;
            ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            // Quick visual feedback
            noteHeader.style.backgroundColor = '#d9f99d'; 
            setTimeout(() => { noteHeader.style.backgroundColor = '#fcd34d'; }, 500);
        }
        
        // External Button Position Update Function
        function updateMinimizeButtonPosition() {
            // 창이 숨겨져 있거나 최소화 상태인 경우 위치 업데이트를 건너뜁니다.
            if (floatingNoteArea.classList.contains('hidden') || isMinimized) {
                return; 
            }

            const windowRect = floatingNoteArea.getBoundingClientRect();
            const headerHeight = noteHeader.offsetHeight;

            // 버튼을 창의 오른쪽 상단 모서리 (Header 영역 밖)에 배치
            const buttonX = windowRect.right + 10;
            const buttonY = windowRect.top + (headerHeight / 2); 
            
            minimizeButton.style.left = `${buttonX}px`;
            minimizeButton.style.top = `${buttonY}px`;
        }
        

        // Minimize/Restore Logic using External Button
        function toggleMinimize() {
            if (!isMinimized) {
                // MINIMIZE
                isMinimized = true;
                
                // 1. 현재 위치/크기 저장
                savedPositionAndSize = {
                    left: floatingNoteArea.offsetLeft,
                    top: floatingNoteArea.offsetTop,
                    width: floatingNoteArea.offsetWidth,
                    height: floatingNoteArea.offsetHeight,
                };
                
                // 2. 최소화 클래스 적용
                floatingNoteArea.classList.add('minimized');
                
                // 3. UI 변경: 버튼 아이콘 및 창 내부 레이블
                restoreLabel.classList.remove('hidden');
                headerControls.classList.add('hidden');
                minimizeIcon.classList.add('hidden');
                maximizeIcon.classList.remove('hidden');
                minimizeButton.title = '최대화';
                
                // 4. 외부 버튼 숨기기
                minimizeButton.classList.add('hidden');
                
            } else {
                // RESTORE
                isMinimized = false;

                // 1. 복구 클래스 제거
                floatingNoteArea.classList.remove('minimized');
                
                // 2. 저장된 위치/크기 복원
                floatingNoteArea.style.width = `${savedPositionAndSize.width}px`;
                floatingNoteArea.style.height = `${savedPositionAndSize.height}px`;
                
                // 화면 경계를 벗어나지 않도록 안전한 위치 계산
                const safeLeft = Math.min(savedPositionAndSize.left, window.innerWidth - savedPositionAndSize.width - 20);
                const safeTop = Math.min(savedPositionAndSize.top, window.innerHeight - savedPositionAndSize.height - 20);

                floatingNoteArea.style.left = `${safeLeft}px`;
                floatingNoteArea.style.top = `${safeTop}px`;
                
                // 3. UI 변경
                restoreLabel.classList.add('hidden');
                headerControls.classList.remove('hidden');
                maximizeIcon.classList.add('hidden');
                minimizeIcon.classList.remove('hidden');
                minimizeButton.title = '최소화';
                
                // 4. 외부 버튼 표시 및 위치 업데이트 (단, 필기폼이 표시될 때만)
                if (!floatingNoteArea.classList.contains('hidden')) {
                    minimizeButton.classList.remove('hidden');
                }
                resizeCanvas();
                updateMinimizeButtonPosition();
            }
        }


        function setupFloatingNoteArea() {
            ctx = drawingCanvas.getContext('2d');
            
            // 초기 위치를 명시적인 style.left/top으로 설정
            const initialRect = floatingNoteArea.getBoundingClientRect();
            const initialLeft = initialRect.left;
            const initialTop = initialRect.top;
            
            floatingNoteArea.style.left = `${initialLeft}px`;
            floatingNoteArea.style.top = `${initialTop}px`;
            floatingNoteArea.style.right = 'auto'; // CSS의 right 속성 무시
            
            // 초기 savedPositionAndSize 설정
            savedPositionAndSize = {
                 left: initialLeft,
                 top: initialTop,
                 width: floatingNoteArea.offsetWidth,
                 height: floatingNoteArea.offsetHeight,
            };
            
            resizeCanvas(); 
            
            // Drawing Listeners
            drawingCanvas.addEventListener('mousedown', startDrawing);
            drawingCanvas.addEventListener('mousemove', draw);
            drawingCanvas.addEventListener('mouseup', stopDrawing);
            drawingCanvas.addEventListener('mouseout', stopDrawing); 
            drawingCanvas.addEventListener('touchstart', startDrawing);
            drawingCanvas.addEventListener('touchmove', draw);
            drawingCanvas.addEventListener('touchend', stopDrawing);

            // Controls Listeners
            noteClearButton.addEventListener('click', clearCanvas);
            minimizeButton.addEventListener('click', toggleMinimize); // 외부 버튼에 리스너 연결
            
            // Restore Listener (Clicking the minimized area)
            floatingNoteArea.addEventListener('click', (e) => {
                if (isMinimized) {
                    toggleMinimize();
                    e.stopPropagation(); 
                }
            });
            
            // ResizeObserver: Update canvas resolution on window resize
            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(entries => {
                    if (!isMinimized) requestAnimationFrame(resizeCanvas); 
                    updateMinimizeButtonPosition(); // 리사이즈 시 버튼 위치 업데이트
                });
                observer.observe(floatingNoteArea); 
            }
            window.addEventListener('resize', () => {
                resizeCanvas();
                updateMinimizeButtonPosition();
            });


            // ------------------ Drag Logic ------------------
            
            function dragStart(e) {
                if (isMinimized) return;
                
                // Prevent drag from resize handle (bottom right corner)
                const isResizeHandle = e.offsetX > floatingNoteArea.offsetWidth - 20 && 
                                       e.offsetY > floatingNoteArea.offsetHeight - 20;
                
                if (isResizeHandle) return;

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                if (clientX === undefined || clientY === undefined) return;

                // Offsets must be calculated relative to the current position set by style.left/top
                initialX = clientX - floatingNoteArea.offsetLeft;
                initialY = clientY - floatingNoteArea.offsetTop;

                if (e.target === noteHeader || e.target.closest('#note-header')) {
                    e.preventDefault();
                    isDragging = true;
                    noteHeader.style.cursor = 'grabbing';
                }
            }

            function dragEnd() {
                if (isDragging) {
                    isDragging = false;
                    noteHeader.style.cursor = 'grab';
                    
                    // 드래그 종료 시, 최종 위치를 savedPositionAndSize에 업데이트
                    savedPositionAndSize.left = floatingNoteArea.offsetLeft;
                    savedPositionAndSize.top = floatingNoteArea.offsetTop;
                    
                    // 드래그가 끝날 때 최소화 버튼 위치 업데이트
                    updateMinimizeButtonPosition(); 
                }
            }

            function drag(e) {
                if (isDragging && !isMinimized) {
                    e.preventDefault();
                    
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                    if (clientX === undefined || clientY === undefined) return;

                    const currentX = clientX - initialX;
                    const currentY = clientY - initialY;

                    const minX = 0;
                    const minY = 0;
                    const maxX = window.innerWidth - floatingNoteArea.offsetWidth;
                    const maxY = window.innerHeight - floatingNoteArea.offsetHeight;

                    const newX = Math.min(Math.max(currentX, minX), maxX);
                    const newY = Math.min(Math.max(currentY, minY), maxY);

                    floatingNoteArea.style.left = newX + "px";
                    floatingNoteArea.style.top = newY + "px";
                    
                    // 드래그 중에도 최소화 버튼 위치 업데이트
                    updateMinimizeButtonPosition(); 
                }
            }
            
            noteHeader.addEventListener("mousedown", dragStart);
            noteHeader.addEventListener("touchstart", dragStart); 
            
            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("touchend", dragEnd);
            
            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag);
            
            // 초기 버튼 위치 설정
            setTimeout(updateMinimizeButtonPosition, 100); 
        }

        async function prepareDataAndSwitch(mode) {
            let url = csvSelect.value || csvUrlInput.value.trim();
            if (!url) {
                urlStatusMessage.textContent = 'URL을 선택하거나 입력해 주세요.';
                urlStatusMessage.classList.add('text-red-500');
                return;
            }
            if (url === 'loading') return;

            errorBox.classList.add('hidden');
            try {
                vocabulary = await loadVocabularyFromURL(url);

                if (mode === 'quiz') {
                    incorrectAnswers = [];
                    currentQuestionIndex = 0;
                    quizQuestions = createQuiz(vocabulary); 
                    if (quizQuestions.length === 0) throw new Error("퀴즈 생성을 위한 문제가 충분하지 않습니다.");
                    showSection(quizSection);
                    displayQuestion(quizQuestions[currentQuestionIndex]);
                    
                } else if (mode === 'study') {
                    renderStudyGrid(vocabulary);
                    showSection(studySection);
                }
            } catch (error) {
                // Load error handled in loadVocabularyFromURL
                showSection(fileUploadSection); 
            }
        }

        async function startQuiz() { await prepareDataAndSwitch('quiz'); }
        async function startStudy() { await prepareDataAndSwitch('study'); }

            showSection(fileUploadSection);
            urlStatusMessage.textContent = vocabulary.length > 0 ? 
                `현재 ${vocabulary.length}개의 단어가 로드되어 있습니다.` : 
                'CSV 파일을 선택하거나 URL을 직접 입력해 퀴즈/학습을 시작하세요.';
            urlStatusMessage.classList.remove('text-red-500');
            updateStartButtonState(false);
        }

            nextButton.addEventListener('click', nextQuestion);
            restartButton.addEventListener('click', goBackToMenu);
            backToMenuButton.addEventListener('click', goBackToMenu); 
            toggleAllButton.addEventListener('click', toggleAllCells);
            
            csvSelect.addEventListener('change', () => {
                if (csvSelect.value) csvUrlInput.value = ''; 
                urlStatusMessage.textContent = '선택된 파일 또는 입력된 URL로 학습/퀴즈를 시작하세요.';
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
            
            csvUrlInput.addEventListener('input', () => {
                if (csvUrlInput.value.trim()) csvSelect.selectedIndex = 0; 
                urlStatusMessage.textContent = '직접 입력된 URL로 학습/퀴즈를 시작합니다.';
                urlStatusMessage.classList.remove('text-red-500');
                updateStartButtonState(false);
            });
            
            setupFloatingNoteArea(); 
        }

        // 초기화 함수
        window.onload = function() {
            setupEventListeners();
            loadCsvFileOptions(); 
            csvUrlInput.value = ''; 
            urlStatusMessage.textContent = 'CSV 파일을 로딩 중입니다. 잠시만 기다려주세요.';
            updateStartButtonState(true); 
            showSection(fileUploadSection);
        };

    </script>
</body>
</html>
