<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { margin:0; width:100%; height:100%; }
    body { background:#020617; overflow:hidden; }
    * { box-sizing:border-box; }
    .page-track {
      display:flex;
      width:100%;
      height:100%;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      cursor:grab;
    }
    .page-track:active { cursor:grabbing; }
    .page-track::-webkit-scrollbar { display:none; }
    .page {
      flex:0 0 100%;
      width:100%;
      height:100%;
      scroll-snap-align:start;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior-x:contain;
    }
    @media (min-width:768px) {
      .page-track { scroll-snap-stop:always; }
    }
    .thin-scroll::-webkit-scrollbar { width:6px; height:6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background:#334155; border-radius:999px; }
    .heat-cell { min-width:0; min-height:90px; }
    input, select, button { -webkit-tap-highlight-color:transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useEffect, useMemo, useRef, useState} = React;

const WORKER_BASE_URL = "https://yahoo.ninetaild.workers.dev";
const SYMBOLS_URL = "https://ninetaild.github.io/data/symbols.json";

const SearchIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>;
const PlusIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;
const TrashIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 11v6M14 11v6"/></svg>;
const EditIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>;
const DownloadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>;
const UploadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>;
const CloseIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg>;
const ChevronLeft = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
const ChevronRight = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;

const fetchViaWorker = async (path, options={}) => {
  const res = await fetch(`${WORKER_BASE_URL}${path}`, options);
  if (!res.ok) throw new Error(`Yahoo proxy error: ${res.status}`);
  return await res.json();
};

const marketOf = (symbol="") => {
  const s = symbol.toUpperCase();
  if (s.endsWith(".KS") || s.endsWith(".KQ")) return "KR";
  if (s.endsWith(".T")) return "JP";
  return "US";
};

const currencyOf = (symbol="") => {
  const m = marketOf(symbol);
  return m === "KR" ? "KRW" : m === "JP" ? "JPY" : "USD";
};

const marketLabel = (symbol="") => {
  const m = marketOf(symbol);
  if (m === "KR") return symbol.toUpperCase().endsWith(".KQ") ? "코스닥" : "코스피";
  if (m === "JP") return "일본";
  return "미국";
};

const format = (value, currency="KRW") => {
  const n = Number(value);
  if (!Number.isFinite(n)) return "-";
  const digits = currency === "USD" ? 2 : 0;
  return new Intl.NumberFormat("ko-KR", {
    maximumFractionDigits: digits,
    minimumFractionDigits: digits
  }).format(n);
};

const money = (value, currency="KRW") => {
  const symbol = currency === "USD" ? "$" : currency === "JPY" ? "¥" : "₩";
  return symbol + format(value, currency);
};

const signedMoney = (value, currency="KRW") => {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : "-"}${money(Math.abs(n), currency)}`;
};

const colorForReturn = (value) => value > 0 ? "text-emerald-400" : value < 0 ? "text-rose-400" : "text-slate-400";

function App() {
  const [lots, setLots] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioLots");
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [accounts, setAccounts] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioAccounts");
      return saved ? JSON.parse(saved) : ["기본 계좌"];
    } catch { return ["기본 계좌"]; }
  });
  const [selectedAccount, setSelectedAccount] = useState("ALL");
  const [symbols, setSymbols] = useState([]);
  const [search, setSearch] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [quotes, setQuotes] = useState({});
  const [fx, setFx] = useState({USD:1350, JPY:9, KRW:1});
  const [loadingQuotes, setLoadingQuotes] = useState(false);
  const [quoteError, setQuoteError] = useState("");
  const [taxRate, setTaxRate] = useState(15.4);
  const [showAccounts, setShowAccounts] = useState(false);
  const [showAdd, setShowAdd] = useState(null);
  const [editLot, setEditLot] = useState(null);
  const [newAccount, setNewAccount] = useState("");
  const [page, setPage] = useState(0);
  const trackRef = useRef(null);
  const drag = useRef({down:false,startX:0,startScroll:0,moved:false});
  const importRef = useRef(null);

  useEffect(() => localStorage.setItem("globalPortfolioLots", JSON.stringify(lots)), [lots]);
  useEffect(() => localStorage.setItem("globalPortfolioAccounts", JSON.stringify(accounts)), [accounts]);

  useEffect(() => {
    fetch(SYMBOLS_URL, {cache:"no-store"})
      .then(r => r.json())
      .then(data => Array.isArray(data) && setSymbols(data))
      .catch(e => console.error("symbols.json:", e));
  }, []);

  useEffect(() => {
    const loadFx = async () => {
      try {
        const data = await fetchViaWorker("/quote?symbols=USDKRW=X,JPYKRW=X");
        const list = data?.quoteResponse?.result || data?.quotes || [];
        let usd = fx.USD, jpy = fx.JPY;
        for (const q of Array.isArray(list) ? list : Object.values(list)) {
          if (q.symbol === "USDKRW=X") usd = Number(q.regularMarketPrice ?? q.price ?? usd);
          if (q.symbol === "JPYKRW=X") {
            const raw = Number(q.regularMarketPrice ?? q.price ?? jpy);
            jpy = raw > 100 ? raw / 100 : raw;
          }
        }
        setFx({USD:usd, JPY:jpy, KRW:1});
      } catch (e) {
        console.warn("FX failed", e);
      }
    };
    loadFx();
    const id = setInterval(loadFx, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, []);

  const symbolsBySearch = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];
    const ranked = [];
    for (const item of symbols) {
      const symbol = String(item.symbol || "").toUpperCase();
      const kws = Array.isArray(item.searchKeywords) ? item.searchKeywords.map(x => String(x).toLowerCase()) : [];
      const exact = kws.some(x => x === q) || symbol.toLowerCase() === q;
      const hit = symbol.toLowerCase().includes(q) || kws.some(x => x.includes(q));
      if (!hit) continue;

      const market = marketOf(symbol);
      // First non-symbol English/company name is used for the compact display.
      const nameCandidates = kws.filter(x => x !== symbol.toLowerCase() && x !== symbol.replace(/\.(ks|kq|t)$/i,"").toLowerCase());
      const displayName = nameCandidates.find(x => /[a-z]/i.test(x)) || nameCandidates[0] || symbol;
      ranked.push({
        symbol,
        name: displayName,
        market,
        currency: currencyOf(symbol),
        score: exact ? 0 : (symbol.toLowerCase().startsWith(q) ? 1 : 2)
      });
    }
    return ranked
      .sort((a,b) => a.score-b.score || a.name.localeCompare(b.name))
      .slice(0, 20);
  }, [search, symbols]);

  useEffect(() => {
    if (!lots.length) {
      setQuotes({});
      return;
    }
    const symbolsToFetch = [...new Set(lots.map(x => x.symbol).filter(Boolean))];
    let cancelled = false;
    const load = async () => {
      setLoadingQuotes(true);
      setQuoteError("");
      try {
        const data = await fetchViaWorker(`/quote?symbols=${encodeURIComponent(symbolsToFetch.join(","))}`);
        const list = data?.quoteResponse?.result || data?.quotes || [];
        const next = {};
        for (const q of (Array.isArray(list) ? list : Object.values(list))) {
          if (!q?.symbol) continue;
          const price = Number(q.regularMarketPrice ?? q.price ?? q.regularMarketPreviousClose ?? 0);
          const rawYield = Number(q.dividendYield ?? q.trailingAnnualDividendYield ?? 0);
          const yieldPct = rawYield > 1 ? rawYield : rawYield * 100;
          const annualDividend = Number(q.trailingAnnualDividendRate ?? q.dividendRate ?? 0);
          next[q.symbol] = {
            price,
            changePercent: Number(q.regularMarketChangePercent ?? q.changePercent ?? 0),
            dividendYield: yieldPct,
            annualDividend: annualDividend || (price * yieldPct / 100),
            name: q.longname || q.longName || q.shortname || q.shortName || q.symbol
          };
        }
        if (!cancelled) setQuotes(next);
      } catch (e) {
        console.error(e);
        if (!cancelled) setQuoteError("Yahoo Finance 데이터를 불러오지 못했습니다.");
      } finally {
        if (!cancelled) setLoadingQuotes(false);
      }
    };
    load();
    const id = setInterval(load, 60 * 1000);
    return () => { cancelled=true; clearInterval(id); };
  }, [lots]);

  const visibleLots = useMemo(() => selectedAccount === "ALL"
    ? lots
    : lots.filter(l => (l.account || "기본 계좌") === selectedAccount), [lots, selectedAccount]);

  const portfolio = useMemo(() => {
    const map = new Map();
    for (const lot of visibleLots) {
      if (!map.has(lot.symbol)) {
        map.set(lot.symbol, {
          symbol:lot.symbol, name:lot.name || lot.symbol, market:marketOf(lot.symbol),
          currency:lot.currency || currencyOf(lot.symbol), qty:0, investedKRW:0,
          investedForeign:0, lots:[]
        });
      }
      const p = map.get(lot.symbol);
      p.qty += Number(lot.quantity) || 0;
      p.investedKRW += (Number(lot.quantity)||0) * (Number(lot.avgPriceKRW)||0);
      p.investedForeign += (Number(lot.quantity)||0) * (Number(lot.avgPriceForeign)||0);
      p.lots.push(lot);
    }
    return [...map.values()].map(p => {
      const q = quotes[p.symbol] || {};
      const rate = fx[p.currency] || 1;
      const avgForeign = p.qty ? p.investedForeign / p.qty : 0;
      const currentForeign = Number(q.price || 0);
      const currentKRW = currentForeign * rate;
      const valueKRW = p.qty * currentKRW;
      const profit = valueKRW - p.investedKRW;
      const profitPct = p.investedKRW ? profit / p.investedKRW * 100 : 0;
      const annualDividendForeign = Number(q.annualDividend || 0);
      const annualDividendKRW = p.qty * annualDividendForeign * rate;
      return {
        ...p, name:q.name || p.name, avgForeign, currentForeign, currentKRW,
        valueKRW, profit, profitPct, changePercent:Number(q.changePercent||0),
        dividendYield:Number(q.dividendYield||0), annualDividendForeign,
        annualDividendKRW, netDividendKRW:annualDividendKRW*(1-taxRate/100)
      };
    }).sort((a,b)=>b.valueKRW-a.valueKRW);
  }, [visibleLots, quotes, fx, taxRate]);

  const stats = useMemo(() => {
    const invested = portfolio.reduce((s,x)=>s+x.investedKRW,0);
    const value = portfolio.reduce((s,x)=>s+x.valueKRW,0);
    const profit = value-invested;
    const annual = portfolio.reduce((s,x)=>s+x.annualDividendKRW,0);
    const net = portfolio.reduce((s,x)=>s+x.netDividendKRW,0);
    return {invested,value,profit,profitPct:invested?profit/invested*100:0,annual,net,monthly:net/12};
  }, [portfolio]);

  const addLot = (e) => {
    e.preventDefault();
    const fd = new FormData(e.currentTarget);
    const qty = Number(fd.get("quantity"));
    const priceKRW = Number(fd.get("priceKRW"));
    const date = fd.get("date");
    if (!qty || !priceKRW || !date || !showAdd) return;
    const currency = showAdd.currency;
    const rate = fx[currency] || 1;
    const lot = {
      id:Date.now().toString(), symbol:showAdd.symbol, name:showAdd.name,
      market:showAdd.market, currency, searchKeywords:showAdd.searchKeywords || [],
      quantity:qty, avgPriceKRW:priceKRW, avgPriceForeign:priceKRW/rate,
      date, account:fd.get("account") || accounts[0] || "기본 계좌"
    };
    setLots(prev=>[...prev,lot]);
    setShowAdd(null); setSearch(""); setSearchOpen(false);
  };

  const updateLot = (id, field, value) => {
    setLots(prev=>prev.map(l=>{
      if(l.id!==id) return l;
      const next={...l,[field]:field==="quantity"||field==="avgPriceKRW"?Number(value):value};
      if(field==="avgPriceKRW") next.avgPriceForeign=Number(value)/(fx[l.currency]||1);
      return next;
    }));
  };

  const deleteLot = id => setLots(prev=>prev.filter(l=>l.id!==id));

  const addAccount = () => {
    const name=newAccount.trim();
    if(!name || accounts.includes(name)) return;
    setAccounts(prev=>[...prev,name]);
    setSelectedAccount(name);
    setNewAccount("");
  };

  const deleteAccount = acc => {
    if(accounts.length<=1) return alert("최소 1개의 계좌는 유지해야 합니다.");
    if(!confirm(`'${acc}' 계좌와 보유 종목을 삭제할까요?`)) return;
    setAccounts(prev=>prev.filter(x=>x!==acc));
    setLots(prev=>prev.filter(x=>(x.account||"기본 계좌")!==acc));
    if(selectedAccount===acc) setSelectedAccount("ALL");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({lots,accountNicknames:accounts},null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="portfolio_export.json"; a.click();
    URL.revokeObjectURL(a.href);
  };

  const importData = e => {
    const file=e.target.files?.[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const data=JSON.parse(ev.target.result);
        if(Array.isArray(data)) setLots(data);
        else if(data?.lots) {
          setLots(data.lots);
          if(Array.isArray(data.accountNicknames)) setAccounts(data.accountNicknames);
        }
      } catch { alert("JSON 파일을 읽을 수 없습니다."); }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const goPage = n => {
    const el=trackRef.current;
    if(el) el.scrollTo({left:el.clientWidth*n,behavior:"smooth"});
    setPage(n);
  };

  useEffect(()=>{
    const el=trackRef.current;
    if(!el) return;
    const onScroll=()=>{
      const n=Math.round(el.scrollLeft/el.clientWidth);
      if(n!==page) setPage(n);
    };
    el.addEventListener("scroll",onScroll,{passive:true});
    return()=>el.removeEventListener("scroll",onScroll);
  },[page]);

  useEffect(()=>{
    const el=trackRef.current;
    if(!el) return;
    const down=e=>{
      if(e.pointerType==="touch") return;
      drag.current={down:true,startX:e.clientX,startScroll:el.scrollLeft,moved:false};
      el.setPointerCapture?.(e.pointerId);
    };
    const move=e=>{
      if(!drag.current.down) return;
      const dx=e.clientX-drag.current.startX;
      if(Math.abs(dx)>5) drag.current.moved=true;
      el.scrollLeft=drag.current.startScroll-dx;
    };
    const up=()=>{drag.current.down=false; if(drag.current.moved){const n=Math.round(el.scrollLeft/el.clientWidth); goPage(Math.max(0,Math.min(2,n)));}};
    el.addEventListener("pointerdown",down);
    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",up);
    el.addEventListener("pointercancel",up);
    return()=>{el.removeEventListener("pointerdown",down);el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);};
  },[]);

  const pageTitle = ["Portfolio","Dividend","Market"][page];

  return (
    <div className="h-screen w-screen bg-slate-950 text-slate-100">
      <header className="h-14 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between px-3 md:px-6">
        <div className="flex items-center gap-3">
          <div className="font-semibold text-white">{page===0?"Portfolio":page===1?"Dividend":"Market"}</div>
          <div className="flex items-center gap-1">
            {[0,1,2].map(n=><button key={n} onClick={()=>goPage(n)} aria-label={`페이지 ${n+1}`} className={`w-2 h-2 rounded-full ${page===n?"bg-white":"bg-slate-600"}`}/>)}
          </div>
        </div>
        <div className="flex items-center gap-1">
          <button onClick={exportData} className="p-2 rounded-lg hover:bg-slate-800" title="내보내기"><DownloadIcon className="w-4 h-4"/></button>
          <button onClick={()=>importRef.current?.click()} className="p-2 rounded-lg hover:bg-slate-800" title="가져오기"><UploadIcon className="w-4 h-4"/></button>
          <input ref={importRef} type="file" accept=".json" className="hidden" onChange={importData}/>
        </div>
      </header>

      <div ref={trackRef} className="page-track">
        <section className="page">
          <div className="max-w-7xl mx-auto p-3 md:p-6 space-y-4">
            <div className="flex flex-col md:flex-row gap-3">
              <div className="flex-1 relative">
                <div className="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-3">
                  <SearchIcon className="w-5 h-5 text-slate-500"/>
                  <input value={search} onChange={e=>{setSearch(e.target.value);setSearchOpen(true)}} onFocus={()=>setSearchOpen(true)}
                    placeholder="종목명 또는 티커 검색" className="w-full bg-transparent outline-none px-3 py-3 text-sm"/>
                  {search && <button onClick={()=>{setSearch("");setSearchOpen(false)}}><CloseIcon className="w-4 h-4 text-slate-500"/></button>}
                </div>
                {searchOpen && search.trim() && (
                  <div className="absolute z-30 left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden max-h-80 overflow-y-auto">
                    {symbolsBySearch.length ? symbolsBySearch.map(item=>(
                      <button key={item.symbol} onClick={()=>{setShowAdd(item);setSearchOpen(false)}}
                        className="w-full text-left px-4 py-3 hover:bg-slate-800 border-b border-slate-800 last:border-0">
                        <div className="flex items-center justify-between gap-3">
                          <div className="min-w-0">
                            <div className="text-sm font-medium text-white truncate">{item.name} <span className="text-slate-500">| {item.symbol.replace(/\.(KS|KQ|T)$/i,"")}</span></div>
                            <div className="text-xs text-slate-500 mt-0.5">{marketLabel(item.symbol)}</div>
                          </div>
                          <span className="text-xs text-slate-500">{item.currency}</span>
                        </div>
                      </button>
                    )) : <div className="p-4 text-sm text-slate-500">symbols.json에서 찾을 수 없습니다.</div>}
                  </div>
                )}
              </div>

              <div className="flex gap-2">
                <select value={selectedAccount} onChange={e=>setSelectedAccount(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl px-3 text-sm">
                  <option value="ALL">전체 계좌</option>
                  {accounts.map(a=><option key={a}>{a}</option>)}
                </select>
                <button onClick={()=>setShowAccounts(true)} className="px-3 rounded-xl bg-slate-900 border border-slate-800 text-sm">계좌</button>
              </div>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-3">
              <Stat title="평가금액" value={money(stats.value)} />
              <Stat title="투자원금" value={money(stats.invested)} />
              <Stat title="평가손익" value={signedMoney(stats.profit)} valueClass={colorForReturn(stats.profit)}/>
              <Stat title="수익률" value={`${stats.profitPct>=0?"+":""}${stats.profitPct.toFixed(2)}%`} valueClass={colorForReturn(stats.profitPct)}/>
            </div>

            <div className="flex items-center justify-between pt-2">
              <div className="text-sm text-slate-400">{portfolio.length}개 종목</div>
              <div className="text-xs text-slate-500">
                USD/KRW {format(fx.USD,"KRW")} · JPY/KRW {format(fx.JPY,"KRW")}
                {loadingQuotes && " · 업데이트 중"}
              </div>
            </div>

            {quoteError && <div className="text-xs text-amber-400 bg-amber-950/30 border border-amber-900/50 rounded-lg p-3">{quoteError}</div>}

            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
              <div className="hidden md:grid grid-cols-[2fr_1fr_1fr_1fr_1fr_90px] gap-3 px-4 py-3 text-xs text-slate-500 border-b border-slate-800">
                <div>종목</div><div>보유수량</div><div>현재가</div><div>평가금액</div><div>손익</div><div></div>
              </div>
              {portfolio.length===0 ? (
                <div className="p-10 text-center text-slate-500 text-sm">검색해서 종목을 추가해 주세요.</div>
              ) : portfolio.map(item=>(
                <div key={item.symbol} className="px-4 py-4 border-b border-slate-800 last:border-0">
                  <div className="grid md:grid-cols-[2fr_1fr_1fr_1fr_1fr_90px] gap-2 md:gap-3 items-center">
                    <div className="min-w-0">
                      <div className="font-medium text-white truncate">{item.name}</div>
                      <div className="text-xs text-slate-500">{item.symbol} · {marketLabel(item.symbol)}</div>
                    </div>
                    <div className="text-sm">{format(item.qty,item.currency)}</div>
                    <div className="text-sm">
                      {item.currentForeign ? money(item.currentForeign,item.currency) : <span className="text-slate-600">-</span>}
                      <div className="text-xs text-slate-500">{item.currentForeign ? money(item.currentKRW,"KRW") : ""}</div>
                    </div>
                    <div className="text-sm">{item.valueKRW ? money(item.valueKRW) : "-"}</div>
                    <div className={`text-sm ${colorForReturn(item.profit)}`}>
                      {item.valueKRW ? signedMoney(item.profit) : "-"}
                      <div className="text-xs">{item.valueKRW ? `${item.profitPct>=0?"+":""}${item.profitPct.toFixed(2)}%` : ""}</div>
                    </div>
                    <div className="flex md:justify-end gap-1">
                      <button onClick={()=>setEditLot(item.lots[0])} className="p-2 rounded-lg hover:bg-slate-800"><EditIcon className="w-4 h-4"/></button>
                      <button onClick={()=>{if(confirm(`${item.symbol}의 보유 기록을 모두 삭제할까요?`)) setLots(prev=>prev.filter(l=>l.symbol!==item.symbol))}} className="p-2 rounded-lg hover:bg-slate-800 text-slate-500 hover:text-rose-400"><TrashIcon className="w-4 h-4"/></button>
                    </div>
                  </div>
                  <div className="mt-3 flex flex-wrap gap-2 text-xs text-slate-500">
                    <span className="px-2 py-1 rounded bg-slate-950">연 분배금 {money(item.annualDividendKRW,"KRW")}</span>
                    <span className="px-2 py-1 rounded bg-slate-950">수익률 {item.dividendYield.toFixed(2)}%</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="text-center text-xs text-slate-600 py-2">← 모바일은 좌우 스와이프 · PC는 클릭 후 드래그 →</div>
          </div>
        </section>

        <section className="page">
          <div className="max-w-7xl mx-auto p-3 md:p-6 space-y-4">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-3">
              <Stat title="연간 분배금" value={money(stats.annual)} />
              <Stat title="세후 연간" value={money(stats.net)} />
              <Stat title="월평균 세후" value={money(stats.monthly)} />
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="text-xs text-slate-500 mb-2">세율</div>
                <div className="flex items-center gap-2"><input type="number" step="0.1" value={taxRate} onChange={e=>setTaxRate(Number(e.target.value))} className="w-20 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-sm"/><span className="text-sm text-slate-400">%</span></div>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
              <div className="px-4 py-4 border-b border-slate-800">
                <div className="text-sm font-medium">보유 종목 분배금</div>
                <div className="text-xs text-slate-500 mt-1">포트폴리오에 실제 보유한 종목만 Yahoo Finance에서 조회합니다.</div>
              </div>
              {portfolio.length===0 ? <div className="p-10 text-center text-slate-500 text-sm">보유 종목이 없습니다.</div> :
              portfolio.map(item=>(
                <div key={item.symbol} className="px-4 py-4 border-b border-slate-800 last:border-0 flex flex-col md:grid md:grid-cols-[2fr_1fr_1fr_1fr] gap-2 md:items-center">
                  <div><div className="font-medium">{item.name}</div><div className="text-xs text-slate-500">{item.symbol} · {format(item.qty,item.currency)}주</div></div>
                  <div><div className="text-xs text-slate-500">주당 연 분배금</div><div>{item.annualDividendForeign ? money(item.annualDividendForeign,item.currency) : "-"}</div></div>
                  <div><div className="text-xs text-slate-500">연간 예상</div><div>{money(item.annualDividendKRW)}</div></div>
                  <div><div className="text-xs text-slate-500">세후 예상</div><div>{money(item.netDividendKRW)}</div></div>
                </div>
              ))}
            </div>
          </div>
        </section>

        <section className="page">
          <div className="max-w-7xl mx-auto p-3 md:p-6">
            <div className="flex items-center justify-between mb-4">
              <div><div className="font-semibold">Market</div><div className="text-xs text-slate-500">보유 종목만 표시</div></div>
              <div className="text-xs text-slate-500">{portfolio.length}개</div>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-1.5">
              {portfolio.map(item=>{
                const intensity=Math.min(Math.abs(item.changePercent)/5,1);
                const bg=item.changePercent>0 ? `rgba(16,185,129,${0.15+intensity*0.65})` :
                  item.changePercent<0 ? `rgba(244,63,94,${0.15+intensity*0.65})` : "rgba(100,116,139,.18)";
                return <div key={item.symbol} className="heat-cell rounded-lg border border-slate-800 p-3" style={{background:bg}}>
                  <div className="text-xs text-slate-300 truncate">{item.name}</div>
                  <div className="font-semibold mt-1">{item.symbol.replace(/\.(KS|KQ|T)$/i,"")}</div>
                  <div className={`text-sm mt-1 ${colorForReturn(item.changePercent)}`}>{item.changePercent>=0?"+":""}{item.changePercent.toFixed(2)}%</div>
                  <div className="text-xs text-slate-400 mt-1">{money(item.valueKRW)}</div>
                </div>
              })}
            </div>
          </div>
        </section>
      </div>

      {showAdd && <Modal title={`${showAdd.name} 추가`} onClose={()=>setShowAdd(null)}>
        <form onSubmit={addLot} className="space-y-4">
          <div className="text-xs text-slate-500">{showAdd.symbol} · {showAdd.currency}</div>
          <Field label="수량"><input name="quantity" type="number" step="any" required autoFocus className="field"/></Field>
          <Field label="매수금액 (원화)"><input name="priceKRW" type="number" step="any" required className="field"/></Field>
          <Field label="매수일"><input name="date" type="date" defaultValue={new Date().toISOString().slice(0,10)} required className="field"/></Field>
          <Field label="계좌"><select name="account" defaultValue={accounts[0]} className="field">{accounts.map(a=><option key={a}>{a}</option>)}</select></Field>
          <button className="w-full bg-blue-600 hover:bg-blue-500 rounded-xl py-3 font-medium">추가</button>
        </form>
      </Modal>}

      {editLot && <Modal title={`${editLot.symbol} 수정`} onClose={()=>setEditLot(null)}>
        <div className="space-y-4">
          <Field label="수량"><input type="number" step="any" value={editLot.quantity} onChange={e=>{updateLot(editLot.id,"quantity",e.target.value);setEditLot({...editLot,quantity:e.target.value})}} className="field"/></Field>
          <Field label="매수금액 (원화)"><input type="number" step="any" value={editLot.avgPriceKRW} onChange={e=>{updateLot(editLot.id,"avgPriceKRW",e.target.value);setEditLot({...editLot,avgPriceKRW:e.target.value})}} className="field"/></Field>
          <Field label="계좌"><select value={editLot.account||"기본 계좌"} onChange={e=>{updateLot(editLot.id,"account",e.target.value);setEditLot({...editLot,account:e.target.value})}} className="field">{accounts.map(a=><option key={a}>{a}</option>)}</select></Field>
          <button onClick={()=>setEditLot(null)} className="w-full bg-slate-800 rounded-xl py-3">완료</button>
        </div>
      </Modal>}

      {showAccounts && <Modal title="계좌" onClose={()=>setShowAccounts(false)}>
        <div className="flex gap-2 mb-4"><input value={newAccount} onChange={e=>setNewAccount(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addAccount()} placeholder="새 계좌" className="field"/><button onClick={addAccount} className="px-4 bg-blue-600 rounded-xl"><PlusIcon className="w-5 h-5"/></button></div>
        <div className="space-y-2">{accounts.map(a=><div key={a} className="flex items-center justify-between bg-slate-950 rounded-xl px-3 py-2"><button onClick={()=>{setSelectedAccount(a);setShowAccounts(false)}} className="text-sm">{a}</button><button onClick={()=>deleteAccount(a)} className="text-slate-600 hover:text-rose-400"><TrashIcon className="w-4 h-4"/></button></div>)}</div>
      </Modal>}
    </div>
  );
}

function Stat({title,value,valueClass=""}) {
  return <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
    <div className="text-xs text-slate-500 mb-2">{title}</div>
    <div className={`text-lg md:text-xl font-semibold ${valueClass||"text-white"}`}>{value}</div>
  </div>;
}
function Field({label,children}) {
  return <label className="block"><div className="text-xs text-slate-500 mb-1.5">{label}</div>{children}</label>;
}
function Modal({title,onClose,children}) {
  return <div className="fixed inset-0 z-50 bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4">
    <div className="w-full md:max-w-md bg-slate-900 border border-slate-700 rounded-t-2xl md:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
      <div className="flex items-center justify-between mb-5"><div className="font-semibold">{title}</div><button onClick={onClose}><CloseIcon className="w-5 h-5 text-slate-400"/></button></div>
      {children}
    </div>
  </div>;
}
</script>
<style>
.field{width:100%;background:#020617;border:1px solid #334155;border-radius:.75rem;padding:.7rem .8rem;color:#f8fafc;outline:none}
.field:focus{border-color:#64748b}
</style>
</body>
</html>
