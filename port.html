<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portfolio Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #020617; color: #f8fafc; user-select: none; }
    * { box-sizing: border-box; }
    
    .page-container {
      display: flex;
      width: 100%;
      height: calc(100% - 3.5rem);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
      touch-action: pan-x;
    }
    .page-container:active { cursor: grabbing; }
    .page-container::-webkit-scrollbar { display: none; }
    
    .page-pane {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    input, select, button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

const WORKER_BASE_URL = "https://yahoo.ninetaild.workers.dev";
const SYMBOLS_URL = "https://ninetaild.github.io/data/symbols.json";

const BRAND_ALIASES = {
  "lg": ["lg", "엘지"],
  "엘지": ["lg", "엘지"],
  "대우": ["daewoo", "dw", "대우"],
  "daewoo": ["daewoo", "dw", "대우"],
  "sk": ["sk", "에스케이"],
  "gs": ["gs", "지에스"],
  "삼성": ["samsung", "삼성"],
  "현대": ["hyundai", "현대"]
};

const cleanTicker = (symbol = "") => String(symbol).replace(/\.(KS|KQ|T)$/i, "").toUpperCase();

const marketOf = (symbol = "") => {
  const s = String(symbol).toUpperCase();
  if (s.endsWith(".KS") || s.endsWith(".KQ") || /^\d{6}$/.test(s)) return "KR";
  if (s.endsWith(".T") || /^\d{4}$/.test(s)) return "JP";
  return "US";
};

const currencyOf = (symbol = "") => {
  const m = marketOf(symbol);
  return m === "KR" ? "KRW" : m === "JP" ? "JPY" : "USD";
};

const marketLabel = (symbol = "") => {
  const s = String(symbol).toUpperCase();
  if (s.endsWith(".KQ")) return "코스닥";
  if (s.endsWith(".KS") || /^\d{6}$/.test(s)) return "코스피";
  if (s.endsWith(".T") || /^\d{4}$/.test(s)) return "일본";
  return "미국";
};

const format = (value, currency = "KRW") => {
  if (value === null || value === undefined) return "-";
  const n = Number(value);
  if (!Number.isFinite(n)) return "-";
  const digits = currency === "USD" ? 2 : 0;
  return new Intl.NumberFormat("ko-KR", { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(n);
};

const money = (value, currency = "KRW") => {
  if (value === null || value === undefined) return "-";
  const symbol = currency === "USD" ? "$" : currency === "JPY" ? "¥" : "₩";
  return symbol + format(value, currency);
};

const signedMoney = (value, currency = "KRW") => {
  if (value === null || value === undefined) return "-";
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : "-"}${money(Math.abs(n), currency)}`;
};

const colorForReturn = (value) => {
  if (value === null || value === undefined) return "text-slate-400";
  return value > 0 ? "text-emerald-400" : value < 0 ? "text-rose-400" : "text-slate-400";
};

const getAnnualDividendSum = (dividends = [], year) => {
  return dividends
    .filter(d => new Date(d.date).getFullYear() === year)
    .reduce((sum, d) => sum + Number(d.amount || 0), 0);
};

const growthRate = (current, previous) => {
  if (!previous || previous === 0) return null;
  return ((current - previous) / previous) * 100;
};

const analyzeFrequency = (dividends = []) => {
  if (!dividends || dividends.length < 2) return "미정";
  const sorted = [...dividends].sort((a, b) => new Date(a.date) - new Date(b.date));
  let gaps = [];
  for (let i = 1; i < sorted.length; i++) {
    const diffDays = Math.abs(new Date(sorted[i].date) - new Date(sorted[i-1].date)) / (1000 * 60 * 60 * 24);
    gaps.push(diffDays);
  }
  const avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  if (avgGap <= 45) return "월배당";
  if (avgGap <= 120) return "분기";
  if (avgGap <= 240) return "반기";
  return "연 1회";
};

const calculateTreemap = (items, x = 0, y = 0, w = 100, h = 100) => {
  if (!items || items.length === 0) return [];
  if (items.length === 1) {
    return [{ ...items[0], x, y, w, h }];
  }

  const total = items.reduce((sum, item) => sum + (item.val || 0), 0);
  if (total <= 0) {
    return items.map((item, i) => ({
      ...item,
      x: x + (i * w) / items.length,
      y,
      w: w / items.length,
      h
    }));
  }

  let half = total / 2;
  let current = 0;
  let splitIdx = 0;

  for (let i = 0; i < items.length; i++) {
    current += items[i].val || 0;
    if (current >= half || i === items.length - 1) {
      splitIdx = i;
      break;
    }
  }

  const g1 = items.slice(0, splitIdx + 1);
  const g2 = items.slice(splitIdx + 1);

  if (g2.length === 0) {
    return g1.map((item, i) => ({
      ...item,
      x: x + (i * w) / g1.length,
      y,
      w: w / g1.length,
      h
    }));
  }

  const sum1 = g1.reduce((sum, item) => sum + (item.val || 0), 0);

  if (w >= h) {
    const w1 = (sum1 / total) * w;
    const w2 = w - w1;
    return [
      ...calculateTreemap(g1, x, y, w1, h),
      ...calculateTreemap(g2, x + w1, y, w2, h)
    ];
  } else {
    const h1 = (sum1 / total) * h;
    const h2 = h - h1;
    return [
      ...calculateTreemap(g1, x, y, w, h1),
      ...calculateTreemap(g2, x, y + h1, w, h2)
    ];
  }
};

const SearchIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>;
const PlusIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>;
const TrashIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 11v6M14 11v6"/></svg>;
const EditIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>;
const DownloadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>;
const UploadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>;
const CloseIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 6 12 12M18 6 6 18"/></svg>;
const ChevronDown = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>;
const ChevronUp = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m18 15-6-6-6 6"/></svg>;

function App() {
  const [lots, setLots] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioLots");
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [accounts, setAccounts] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioAccounts");
      return saved ? JSON.parse(saved) : ["기본 계좌"];
    } catch { return ["기본 계좌"]; }
  });

  const [selectedAccount, setSelectedAccount] = useState("ALL");
  const [symbols, setSymbols] = useState([]);
  const [search, setSearch] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [marketData, setMarketData] = useState(null);
  const [fx, setFx] = useState({ USD: 1350, JPY: 9, KRW: 1 });
  const [loadingQuotes, setLoadingQuotes] = useState(false);
  const [quoteError, setQuoteError] = useState("");
  const [taxRate, setTaxRate] = useState(15.4);
  const [displayCurrency, setDisplayCurrency] = useState("KRW");

  const [showAccounts, setShowAccounts] = useState(false);
  const [showAdd, setShowAdd] = useState(null);
  const [editingStock, setEditingStock] = useState(null);
  const [newAccount, setNewAccount] = useState("");
  const [page, setPage] = useState(0);

  const [expandedMonths, setExpandedMonths] = useState({});

  const containerRef = useRef(null);
  const importRef = useRef(null);

  const isDragging = useRef(false);
  const dragStartX = useRef(0);
  const dragStartScroll = useRef(0);

  useEffect(() => localStorage.setItem("globalPortfolioLots", JSON.stringify(lots)), [lots]);
  useEffect(() => localStorage.setItem("globalPortfolioAccounts", JSON.stringify(accounts)), [accounts]);

  useEffect(() => {
    fetch(SYMBOLS_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => Array.isArray(data) && setSymbols(data))
      .catch(e => console.error("symbols load failed", e));
  }, []);

  useEffect(() => {
    const loadFx = async () => {
      try {
        const res = await fetch(`${WORKER_BASE_URL}/quote?symbols=USDKRW=X,JPYKRW=X`);
        if (!res.ok) return;
        const data = await res.json();
        const quoteMap = data?.quotes || {};
        let usd = fx.USD, jpy = fx.JPY;
        
        for (const [sym, q] of Object.entries(quoteMap)) {
          if (!q) continue;
          const upperSym = sym.toUpperCase();
          const priceVal = Number(q.price);
          if (upperSym === "USDKRW=X" && Number.isFinite(priceVal)) usd = priceVal;
          if (upperSym === "JPYKRW=X" && Number.isFinite(priceVal)) {
            jpy = priceVal > 100 ? priceVal / 100 : priceVal;
          }
        }
        setFx({ USD: usd, JPY: jpy, KRW: 1 });
      } catch (e) {
        console.warn("FX Fetch Error:", e);
      }
    };
    loadFx();
  }, []);

  useEffect(() => {
    if (!lots.length) {
      setMarketData(null);
      return;
    }

    const symbolsToFetch = [
      ...new Set(
        lots
          .map(x => String(x.symbol || "").toUpperCase())
          .filter(Boolean)
      )
    ];

    let cancelled = false;

    const loadMarketData = async () => {
      setLoadingQuotes(true);
      setQuoteError("");
      try {
        const queryStr = symbolsToFetch.join(",");
        const res = await fetch(`${WORKER_BASE_URL}/quote?symbols=${encodeURIComponent(queryStr)}`);
        
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        if (!cancelled) setMarketData(data);
      } catch (e) {
        console.error("Market Data Fetching Error:", e);
        if (!cancelled) setQuoteError("시세 및 배당 정보를 가져오지 못했습니다.");
      } finally {
        if (!cancelled) setLoadingQuotes(false);
      }
    };

    loadMarketData();
    return () => { cancelled = true; };
  }, [lots]);

  const convertKRW = (value) => {
    if (value === null || value === undefined) return null;
    if (displayCurrency === "KRW") return value;
    const rate = Number(fx[displayCurrency] || 1);
    return rate > 0 ? Number(value) / rate : value;
  };

  const displayMoney = (value) => {
    const converted = convertKRW(value);
    return money(converted, displayCurrency);
  };

  const displaySignedMoney = (value) => {
    const converted = convertKRW(value);
    if (converted === null) return "-";
    return signedMoney(converted, displayCurrency);
  };

  const symbolsBySearch = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];

    const searchTokens = BRAND_ALIASES[q] || [q];

    return symbols
      .filter(item => {
        const symbol = String(item.symbol || "").toLowerCase();
        const cleaned = cleanTicker(symbol).toLowerCase();
        const kws = Array.isArray(item.searchKeywords) ? item.searchKeywords.map(x => String(x).toLowerCase()) : [];
        const itemName = String(item.name || "").toLowerCase();

        return searchTokens.some(token => 
          symbol.includes(token) || 
          cleaned.includes(token) || 
          itemName.includes(token) ||
          kws.some(k => k.includes(token))
        );
      })
      .map(item => {
        const rawSymbol = item.symbol;
        const cleaned = cleanTicker(rawSymbol);
        const nameCandidates = (item.searchKeywords || []).filter(k => k.toLowerCase() !== rawSymbol.toLowerCase() && k.toLowerCase() !== cleaned.toLowerCase());
        const displayName = item.name || nameCandidates[0] || cleaned;
        return {
          symbol: rawSymbol,
          cleanedSymbol: cleaned,
          name: displayName,
          market: marketOf(rawSymbol),
          currency: currencyOf(rawSymbol)
        };
      })
      .slice(0, 15);
  }, [search, symbols]);

  const visibleLots = useMemo(() => {
    return selectedAccount === "ALL"
      ? lots
      : lots.filter(l => (l.account || "기본 계좌") === selectedAccount);
  }, [lots, selectedAccount]);

  const portfolio = useMemo(() => {
    const map = new Map();
    for (const lot of visibleLots) {
      if (!map.has(lot.symbol)) {
        map.set(lot.symbol, {
          symbol: lot.symbol,
          name: lot.name || lot.symbol,
          market: marketOf(lot.symbol),
          currency: lot.currency || currencyOf(lot.symbol),
          qty: 0,
          investedKRW: 0,
          investedForeign: 0,
          lots: []
        });
      }
      const p = map.get(lot.symbol);
      const q = Number(lot.quantity) || 0;
      const priceKRW = Number(lot.avgPriceKRW) || 0;
      p.qty += q;
      p.investedKRW += q * priceKRW;
      p.investedForeign += q * (Number(lot.avgPriceForeign) || (priceKRW / (fx[p.currency] || 1)));
      p.lots.push(lot);
    }

    const quoteMap = marketData?.quotes || {};
    const currentYear = new Date().getFullYear();
    const prevYear = currentYear - 1;
    const prevPrevYear = currentYear - 2;

    return [...map.values()].map(p => {
      const quote = quoteMap[p.symbol] || quoteMap[p.symbol.toUpperCase()] || {};
      const fxRate = Number(fx[p.currency] || 0);

      const currentPriceForeign = Number.isFinite(Number(quote?.price)) ? Number(quote.price) : null;
      const currentPriceKRW = currentPriceForeign !== null && fxRate > 0 ? currentPriceForeign * fxRate : null;
      const currentValueKRW = currentPriceKRW !== null ? p.qty * currentPriceKRW : null;

      const profit = currentValueKRW !== null ? currentValueKRW - p.investedKRW : null;
      const profitPct = profit !== null && p.investedKRW > 0 ? (profit / p.investedKRW) * 100 : null;

      const rawDividends = Array.isArray(quote?.dividends) ? quote.dividends : [];
      const frequency = analyzeFrequency(rawDividends);

      const annualPrev = getAnnualDividendSum(rawDividends, prevYear);
      const annualPrevPrev = getAnnualDividendSum(rawDividends, prevPrevYear);
      const annualCurrent = getAnnualDividendSum(rawDividends, currentYear);

      const annualGrowth = growthRate(annualPrev, annualPrevPrev);
      const annualDividendPerShare = annualPrev > 0 ? annualPrev : (annualCurrent > 0 ? annualCurrent : Number(quote?.annualDividend || 0));

      const annualDividendKRW = (annualDividendPerShare > 0 && fxRate > 0) ? p.qty * annualDividendPerShare * fxRate : 0;
      const netDividendKRW = annualDividendKRW * (1 - taxRate / 100);

      const avgPriceKRW = p.qty > 0 ? p.investedKRW / p.qty : 0;
      const avgPriceForeign = p.qty > 0 ? p.investedForeign / p.qty : 0;

      return {
        ...p,
        name: quote?.name || p.name,
        avgPriceKRW,
        avgPriceForeign,
        currentPriceForeign,
        currentPriceKRW,
        valueKRW: currentValueKRW,
        profit,
        profitPct,
        changePercent: Number(quote?.changePercent || 0),
        dividends: rawDividends,
        frequency,
        annualDividendForeign: annualDividendPerShare,
        annualDividendKRW,
        netDividendKRW,
        annualGrowth
      };
    }).sort((a, b) => ((b.valueKRW ?? 0) - (a.valueKRW ?? 0)));
  }, [visibleLots, marketData, fx, taxRate]);

  const monthlyDividendSummary = useMemo(() => {
    const currentYear = new Date().getFullYear();
    const prevYear = currentYear - 1;
    const months = Array.from({ length: 12 }, (_, i) => i + 1);

    return months.map(m => {
      let monthTotalCurrentKRW = 0;
      let monthTotalPrevKRW = 0;
      let hasAnyEstimated = false;
      let hasAnyRecords = false;

      const stocksInMonth = [];

      portfolio.forEach(item => {
        const monthDivs = item.dividends.filter(d => new Date(d.date).getMonth() + 1 === m);
        if (monthDivs.length === 0) return;

        hasAnyRecords = true;

        const sorted = [...monthDivs].sort((a, b) => new Date(b.date) - new Date(a.date));
        const currentRec = sorted.find(d => new Date(d.date).getFullYear() === currentYear);
        const prevRec = sorted.find(d => new Date(d.date).getFullYear() === prevYear);

        let perShareCurrent = 0;
        let isEstimated = false;

        if (currentRec) {
          perShareCurrent = Number(currentRec.amount) || 0;
        } else if (sorted.length > 0) {
          perShareCurrent = Number(sorted[0].amount) || 0;
          isEstimated = true;
          hasAnyEstimated = true;
        }

        const perSharePrev = prevRec ? (Number(prevRec.amount) || 0) : 0;
        const fxRate = Number(fx[item.currency] || 1);

        const stockTotalKRW = item.qty * perShareCurrent * fxRate;
        const stockPrevTotalKRW = item.qty * perSharePrev * fxRate;

        monthTotalCurrentKRW += stockTotalKRW;
        monthTotalPrevKRW += stockPrevTotalKRW;

        stocksInMonth.push({
          symbol: item.symbol,
          name: item.name,
          currency: item.currency,
          qty: item.qty,
          perShare: perShareCurrent,
          amountKRW: stockTotalKRW,
          isEstimated
        });
      });

      const growth = (monthTotalPrevKRW > 0 && monthTotalCurrentKRW > 0)
        ? ((monthTotalCurrentKRW - monthTotalPrevKRW) / monthTotalPrevKRW) * 100
        : null;

      return {
        month: m,
        hasRecords: hasAnyRecords,
        totalKRW: monthTotalCurrentKRW,
        totalPrevKRW: monthTotalPrevKRW,
        growth,
        hasAnyEstimated,
        stocks: stocksInMonth
      };
    });
  }, [portfolio, fx]);

  const stats = useMemo(() => {
    let totalInvested = 0;
    let totalValued = 0;
    let validValuedInvested = 0;
    let annual = 0;
    let net = 0;

    portfolio.forEach(x => {
      totalInvested += x.investedKRW;
      annual += x.annualDividendKRW;
      net += x.netDividendKRW;

      if (x.valueKRW !== null) {
        totalValued += x.valueKRW;
        validValuedInvested += x.investedKRW;
      }
    });

    const hasValidQuotes = portfolio.some(x => x.valueKRW !== null);
    const profit = hasValidQuotes ? totalValued - validValuedInvested : null;
    const profitPct = (profit !== null && validValuedInvested > 0) ? (profit / validValuedInvested) * 100 : null;

    return {
      invested: totalInvested,
      value: hasValidQuotes ? totalValued : null,
      profit,
      profitPct,
      annual,
      net,
      monthly: net / 12
    };
  }, [portfolio]);

  const treemapItems = useMemo(() => {
    const totalVal = stats.value && stats.value > 0 ? stats.value : 0;
    if (totalVal <= 0 || portfolio.length === 0) return [];

    const prepared = portfolio.map(item => ({
      ...item,
      val: item.valueKRW && item.valueKRW > 0 ? item.valueKRW : 0,
      weight: totalVal > 0 ? ((item.valueKRW || 0) / totalVal) * 100 : 0
    })).filter(x => x.val > 0);

    return calculateTreemap(prepared, 0, 0, 100, 100);
  }, [portfolio, stats.value]);

  const scrollToPage = (idx) => {
    setPage(idx);
    if (containerRef.current) {
      containerRef.current.scrollTo({
        left: containerRef.current.clientWidth * idx,
        behavior: "smooth"
      });
    }
  };

  const handleScroll = () => {
    if (!containerRef.current) return;
    const width = containerRef.current.clientWidth;
    if (width === 0) return;
    const currentIdx = Math.round(containerRef.current.scrollLeft / width);
    if (currentIdx !== page) {
      setPage(currentIdx);
    }
  };

  const handlePointerDown = (e) => {
    if (!containerRef.current) return;
    if (['INPUT', 'SELECT', 'BUTTON', 'A', 'OPTION'].includes(e.target.tagName)) return;

    isDragging.current = true;
    dragStartX.current = e.clientX;
    dragStartScroll.current = containerRef.current.scrollLeft;

    containerRef.current.setPointerCapture?.(e.pointerId);
  };

  const handlePointerMove = (e) => {
    if (!isDragging.current || !containerRef.current) return;
    const diff = e.clientX - dragStartX.current;
    containerRef.current.scrollLeft = dragStartScroll.current - diff;
  };

  const handlePointerUp = (e) => {
    if (!containerRef.current || !isDragging.current) return;
    isDragging.current = false;
    containerRef.current.releasePointerCapture?.(e.pointerId);

    const width = containerRef.current.clientWidth;
    if (width > 0) {
      const targetPage = Math.round(containerRef.current.scrollLeft / width);
      scrollToPage(targetPage);
    }
  };

  const addLot = (e) => {
    e.preventDefault();
    const fd = new FormData(e.currentTarget);
    const qty = Number(fd.get("quantity"));
    const priceKRW = Number(fd.get("priceKRW"));
    const date = fd.get("date");
    if (!qty || !priceKRW || !date || !showAdd) return;

    const currency = showAdd.currency;
    const rate = fx[currency] || 1;
    const lot = {
      id: Date.now().toString(),
      symbol: showAdd.symbol,
      name: showAdd.name || showAdd.symbol,
      market: showAdd.market,
      currency,
      quantity: qty,
      avgPriceKRW: priceKRW,
      avgPriceForeign: priceKRW / rate,
      date,
      account: fd.get("account") || accounts[0] || "기본 계좌"
    };

    setLots(prev => [...prev, lot]);
    setShowAdd(null);
    setSearch("");
    setSearchOpen(false);
  };

  const handleUpdateLot = (lotId, field, val) => {
    setLots(prev => prev.map(l => {
      if (l.id !== lotId) return l;
      const updated = { ...l, [field]: val };
      if (field === "avgPriceKRW") {
        const numVal = Number(val) || 0;
        updated.avgPriceForeign = numVal / (fx[l.currency] || 1);
      }
      return updated;
    }));

    if (editingStock) {
      setEditingStock(prev => ({
        ...prev,
        lots: prev.lots.map(l => {
          if (l.id !== lotId) return l;
          const updated = { ...l, [field]: val };
          if (field === "avgPriceKRW") {
            const numVal = Number(val) || 0;
            updated.avgPriceForeign = numVal / (fx[l.currency] || 1);
          }
          return updated;
        })
      }));
    }
  };

  const handleDeleteLot = (lotId) => {
    setLots(prev => prev.filter(l => l.id !== lotId));
    if (editingStock) {
      setEditingStock(prev => {
        const nextLots = prev.lots.filter(l => l.id !== lotId);
        return nextLots.length ? { ...prev, lots: nextLots } : null;
      });
    }
  };

  const handleDeleteSymbolAll = (symbol) => {
    if (confirm(`${cleanTicker(symbol)} 종목의 모든 매수 내역을 삭제하시겠습니까?`)) {
      setLots(prev => prev.filter(l => l.symbol !== symbol));
      if (editingStock?.symbol === symbol) setEditingStock(null);
    }
  };

  const addAccount = () => {
    const name = newAccount.trim();
    if (!name || accounts.includes(name)) return;
    setAccounts(prev => [...prev, name]);
    setSelectedAccount(name);
    setNewAccount("");
  };

  const deleteAccount = (acc) => {
    if (accounts.length <= 1) return alert("최소 1개의 계좌는 필요합니다.");
    if (!confirm(`'${acc}' 계좌와 해당 계좌의 보유 종목을 삭제하시겠습니까?`)) return;
    setAccounts(prev => prev.filter(x => x !== acc));
    setLots(prev => prev.filter(x => (x.account || "기본 계좌") !== acc));
    if (selectedAccount === acc) setSelectedAccount("ALL");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ lots, accounts }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "portfolio_backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) setLots(data);
        else if (data?.lots) {
          setLots(data.lots);
          if (Array.isArray(data.accounts)) setAccounts(data.accounts);
        }
        alert("성공적으로 불러왔습니다.");
      } catch {
        alert("올바르지 않은 JSON 파일입니다.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const CurrencyToggleUI = () => (
    <div className="inline-flex bg-slate-900 border border-slate-800 rounded-xl p-1">
      {[
        ["KRW", "원화 ₩"],
        ["USD", "달러 $"],
        ["JPY", "엔화 ¥"]
      ].map(([currency, label]) => (
        <button
          key={currency}
          onClick={() => setDisplayCurrency(currency)}
          className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${
            displayCurrency === currency
              ? "bg-blue-600 text-white"
              : "text-slate-400 hover:text-white"
          }`}
        >
          {label}
        </button>
      ))}
    </div>
  );

  return (
    <div className="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col">
      <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20 flex-shrink-0 gap-2">
        <div className="flex items-center gap-3 min-w-max">
          <div className="font-bold text-base md:text-lg text-white">
            {page === 0 ? "포트폴리오" : page === 1 ? "분배금 (배당)" : "마켓 히트맵"}
          </div>
          <div className="flex gap-1.5">
            {[0, 1, 2].map(n => (
              <button
                key={n}
                onClick={() => scrollToPage(n)}

              />
            ))}
          </div>
        </div>

        <div className="flex items-center gap-2 mx-auto">
          <select
            value={selectedAccount}
            onChange={e => setSelectedAccount(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs md:text-sm text-white outline-none focus:border-blue-500"
          >
            <option value="ALL">전체 계좌</option>
            {accounts.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <button
            onClick={() => setShowAccounts(true)}
            className="px-2.5 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs md:text-sm font-medium hover:bg-slate-700 whitespace-nowrap"
          >
            계좌 관리
          </button>
        </div>

        <div className="flex items-center gap-2 min-w-max">
          <button onClick={exportData} title="내보내기" className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
            <DownloadIcon className="w-4 h-4" />
          </button>
          <button onClick={() => importRef.current?.click()} title="가져오기" className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
            <UploadIcon className="w-4 h-4" />
          </button>
          <input ref={importRef} type="file" accept=".json" className="hidden" onChange={importData} />
        </div>
      </header>

      <div
        ref={containerRef}
        onScroll={handleScroll}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerCancel={handlePointerUp}
        className="page-container"
      >
        {/* PAGE 1: 포트폴리오 */}
        <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
          <div className="max-w-7xl mx-auto space-y-4">
            <div className="flex justify-between items-center gap-2">
              <div className="relative flex-1">
                <div className="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 focus-within:border-blue-500">
                  <SearchIcon className="w-5 h-5 text-slate-500 mr-2" />
                  <input
                    value={search}
                    onChange={e => { setSearch(e.target.value); setSearchOpen(true); }}
                    onFocus={() => setSearchOpen(true)}
                    placeholder="종목명 또는 티커 검색 (예: 삼성전자, VOO, 2805)"
                    className="w-full bg-transparent outline-none text-sm text-white placeholder-slate-500"
                  />
                  {search && (
                    <button onClick={() => { setSearch(""); setSearchOpen(false); }}>
                      <CloseIcon className="w-4 h-4 text-slate-500" />
                    </button>
                  )}
                </div>
                {searchOpen && search.trim() && (
                  <div className="absolute z-30 left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-72 overflow-y-auto thin-scroll">
                    {symbolsBySearch.length ? symbolsBySearch.map(item => (
                      <button
                        key={item.symbol}
                        onClick={() => { setShowAdd(item); setSearchOpen(false); }}
                        className="w-full text-left px-4 py-3 hover:bg-slate-800 border-b border-slate-800/50 flex justify-between items-center"
                      >
                        <div>
                          <div className="text-sm font-medium text-white">{item.name}</div>
                          <div className="text-xs text-slate-400">{item.cleanedSymbol} · {marketLabel(item.symbol)}</div>
                        </div>
                        <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">{item.currency}</span>
                      </button>
                    )) : <div className="p-4 text-sm text-slate-500 text-center">검색 결과가 없습니다.</div>}
                  </div>
                )}
              </div>
              <CurrencyToggleUI />
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <Stat title="총 평가금액" value={displayMoney(stats.value)} />
              <Stat title="총 투자원금" value={displayMoney(stats.invested)} />
              <Stat title="평가손익" value={displaySignedMoney(stats.profit)} valueClass={colorForReturn(stats.profit)} />
              <Stat title="수익률" value={stats.profitPct !== null ? `${stats.profitPct >= 0 ? "+" : ""}${stats.profitPct.toFixed(2)}%` : "-"} valueClass={colorForReturn(stats.profitPct)} />
            </div>

            <div className="flex justify-between items-center text-xs text-slate-400 px-1">
              <div>보유 종목 {portfolio.length}개</div>
              <div>USD/KRW {format(fx.USD, "KRW")} · JPY/KRW {format(fx.JPY, "KRW")} {loadingQuotes && " (시세 로딩 중...)"}</div>
            </div>

            {quoteError && <div className="text-xs text-amber-400 bg-amber-950/40 border border-amber-800/50 p-3 rounded-xl">{quoteError}</div>}

            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">

                <div>종목명</div>
                <div>수량</div>
                <div>평단가 / 매수원금</div>
                <div>현재가</div>
                <div>평가금액</div>
                <div>손익 / 수익률</div>
                <div className="text-right">관리</div>
              </div>

              {portfolio.length === 0 ? (
                <div className="p-12 text-center text-slate-500 text-sm">등록된 종목이 없습니다. 상단 검색창에서 종목을 검색 후 추가하세요.</div>
              ) : portfolio.map(item => (
                <div key={item.symbol} className="px-4 py-3.5 border-b border-slate-800/60 last:border-0 hover:bg-slate-800/30 transition-colors">
                  <div className="grid md:grid-cols-[2fr_1fr_1.2fr_1.2fr_1.2fr_1.2fr_70px] gap-2 md:gap-3 items-center">
                    <div>
                      <div className="font-semibold text-white text-sm truncate">{item.name}</div>
                      <div className="text-xs text-slate-400">{cleanTicker(item.symbol)} · {marketLabel(item.symbol)}</div>
                    </div>
                    <div className="text-sm font-medium">{format(item.qty, item.currency)} 주</div>
                    <div>
                      <div className="text-sm font-medium">{displayMoney(item.avgPriceKRW)}</div>

                    <div>
                      <div className="text-sm font-medium">
                        {item.currentPriceKRW !== null ? displayMoney(item.currentPriceKRW) : "-"}
                      </div>
                      <div className="text-xs text-slate-400">
                        {item.currentPriceForeign !== null ? money(item.currentPriceForeign, item.currency) : "-"}
                      </div>
                    </div>
                    <div className="text-sm font-medium">
                      {item.valueKRW !== null ? displayMoney(item.valueKRW) : "-"}
                    </div>
                    <div className={`text-sm font-medium ${colorForReturn(item.profit)}`}>
                      {item.profit !== null ? displaySignedMoney(item.profit) : "-"}
                      <div className="text-xs">
                        {item.profitPct !== null ? `${item.profitPct >= 0 ? "+" : ""}${item.profitPct.toFixed(2)}%` : ""}
                      </div>
                    </div>
                    <div className="flex items-center justify-end gap-1">
                      <button onClick={() => setEditingStock(item)} title="수정" className="p-1.5 rounded-lg hover:bg-slate-700 text-slate-400 hover:text-white">
                        <EditIcon className="w-4 h-4" />
                      </button>
                      <button onClick={() => handleDeleteSymbolAll(item.symbol)} title="삭제" className="p-1.5 rounded-lg hover:bg-slate-700 text-slate-400 hover:text-rose-400">
                        <TrashIcon className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* PAGE 2: 분배금 */}
        <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
          <div className="max-w-6xl mx-auto space-y-4">
            <div className="flex justify-between items-center">
              <div className="font-bold text-lg text-white">💰 월별 분배금 통합 요약</div>
              <CurrencyToggleUI />
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <Stat title="연간 예상 분배금" value={displayMoney(stats.annual)} />
              <Stat title="세후 연간 분배금" value={displayMoney(stats.net)} />
              <Stat title="월평균 세후 분배금" value={displayMoney(stats.monthly)} />
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div className="text-xs text-slate-400">배당소득세율 설정</div>
                <div className="flex items-center gap-2 mt-2">
                  <select
                    value={taxRate}
                    onChange={e => setTaxRate(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white outline-none focus:border-blue-500"
                  >
                    <option value={0}>0%</option>
                    <option value={9.0}>9%</option>
                    <option value={15.4}>15.4%</option>
                    <option value={22}>22%</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="space-y-3">
              {monthlyDividendSummary.map(mSummary => {
                const isOpen = !!expandedMonths[mSummary.month];

                return (
                  <div key={mSummary.month} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <button
                      onClick={() => setExpandedMonths(prev => ({ ...prev, [mSummary.month]: !isOpen }))}
                      className="w-full p-4 flex items-center justify-between hover:bg-slate-800/50 transition-colors text-left"
                    >
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-base text-white">{mSummary.month}월</span>
                        {mSummary.hasAnyEstimated && (
                          <span className="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md">
                            예상 포함
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-4">
                        <div className="text-right">
                          <div className="text-sm font-bold text-white">
                            {mSummary.totalKRW > 0 ? displayMoney(mSummary.totalKRW) : "-"}
                          </div>
                          {mSummary.growth !== null && (
                            <div className={`text-xs ${colorForReturn(mSummary.growth)}`}>
                              전년 대비 {mSummary.growth >= 0 ? "+" : ""}{mSummary.growth.toFixed(1)}%
                            </div>
                          )}
                        </div>
                        {isOpen ? <ChevronUp className="w-5 h-5 text-slate-400" /> : <ChevronDown className="w-5 h-5 text-slate-400" />}
                      </div>
                    </button>

                    {isOpen && (
                      <div className="border-t border-slate-800 bg-slate-950/60 p-4 space-y-2">
                        {mSummary.stocks.length === 0 ? (
                          <div className="text-xs text-slate-500 text-center py-2">해당 월에 지급되는 분배금 내역이 없습니다.</div>
                        ) : (
                          <>
                            <div className="space-y-2">
                              {mSummary.stocks.map(st => (
                                <div key={st.symbol} className="flex justify-between items-center bg-slate-900 border border-slate-800/80 rounded-xl px-3.5 py-2 text-sm">
                                  <div>
                                    <span className="font-semibold text-white">{st.name}</span>
                                    <span className="text-xs text-slate-400 ml-2">({cleanTicker(st.symbol)})</span>
                                  </div>
                                  <div className="text-right">
                                    <div className="font-medium text-white">
                                      {displayMoney(st.amountKRW)}
                                      {st.isEstimated && <span className="text-xs text-amber-400 ml-1">(예상)</span>}
                                    </div>
                                    <div className="text-xs text-slate-400">
                                      {format(st.qty, st.currency)}주 × {money(st.perShare, st.currency)}
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>
                            <div className="flex justify-between items-center border-t border-slate-800 pt-3 mt-3 text-xs text-slate-400 font-medium px-1">
                              <span>{mSummary.month}월 합계</span>
                              <span className="text-sm font-bold text-white">{displayMoney(mSummary.totalKRW)}</span>
                            </div>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* PAGE 3: 마켓 히트맵 */}
        <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
          <div className="max-w-6xl mx-auto space-y-4">
            <div className="flex justify-between items-center">
              <div>
                <div className="font-bold text-lg text-white">🗺️ 자산 비중 트리맵 (Treemap)</div>
                <div className="text-xs text-slate-400 mt-0.5">면적 = 포트폴리오 비중 · 색상 = 평가손익률</div>
              </div>
              <CurrencyToggleUI />
            </div>

            {treemapItems.length === 0 ? (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 text-sm">
                등록된 보유 종목이 없거나 평가금액이 0원입니다.
              </div>
            ) : (
              <div className="relative w-full h-[540px] bg-slate-900 border border-slate-800 rounded-2xl p-1.5 overflow-hidden">
                {treemapItems.map(item => {
                  const profitPct = item.profitPct;
                  const intensity = profitPct !== null ? Math.min(Math.abs(profitPct) / 30, 1) : 0;
                  
                  const bg = profitPct === null
                    ? "rgba(51, 65, 85, 0.6)"
                    : profitPct > 0
                    ? `rgba(16, 185, 129, ${0.3 + intensity * 0.6})`
                    : profitPct < 0
                    ? `rgba(244, 63, 94, ${0.3 + intensity * 0.6})`
                    : "rgba(51, 65, 85, 0.6)";

                  const isWide = item.w > 12 && item.h > 12;
                  const isMedium = item.w > 6 && item.h > 6;

                  return (
                    <div
                      key={item.symbol}
                      title={`${item.name} (${cleanTicker(item.symbol)})\n비중: ${item.weight.toFixed(1)}%\n평가금액: ${displayMoney(item.valueKRW)}\n수익률: ${profitPct !== null ? (profitPct >= 0 ? '+' : '') + profitPct.toFixed(2) + '%' : '-'}`}
                      className="absolute p-2 border border-slate-950/80 rounded-xl flex flex-col justify-between overflow-hidden transition-all hover:border-white hover:z-10 group"
                      style={{
                        left: `${item.x}%`,
                        top: `${item.y}%`,
                        width: `${item.w}%`,
                        height: `${item.h}%`,
                        backgroundColor: bg
                      }}
                    >
                      <div className="flex justify-between items-start gap-1 w-full">
                        <div className="font-bold text-white text-xs md:text-sm truncate leading-tight">
                          {isWide ? item.name : cleanTicker(item.symbol)}

                  <button onClick={() => handleDeleteLot(lot.id)} className="text-rose-400 hover:underline">삭제</button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="수량">
                    <input
                      type="number"
                      step="any"
                      value={lot.quantity}
                      onChange={e => handleUpdateLot(lot.id, "quantity", e.target.value)}
                      className="field text-sm"
                    />
                  </Field>
                  <Field label="매수 단가 (원화)">
                    <input
                      type="number"
                      step="any"
                      value={lot.avgPriceKRW}
                      onChange={e => handleUpdateLot(lot.id, "avgPriceKRW", e.target.value)}
                      className="field text-sm"
                    />
                  </Field>
                </div>
              </div>
            ))}
            <button onClick={() => setEditingStock(null)} className="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2.5 font-medium transition-colors">
              완료
            </button>
          </div>
        </Modal>
      )}

      {showAccounts && (
        <Modal title="계좌 관리" onClose={() => setShowAccounts(false)}>
          <div className="space-y-4">
            <div className="flex gap-2">
              <input
                value={newAccount}
                onChange={e => setNewAccount(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addAccount()}
                placeholder="새 계좌 이름"
                className="field flex-1"
              />
              <button onClick={addAccount} className="px-4 bg-blue-600 rounded-xl text-white font-medium hover:bg-blue-500">
                <PlusIcon className="w-5 h-5" />
              </button>
            </div>
            <div className="space-y-2 max-h-60 overflow-y-auto thin-scroll">
              {accounts.map(a => (
                <div key={a} className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
                  <span className="text-sm font-medium text-white">{a}</span>
                  <button onClick={() => deleteAccount(a)} className="text-slate-500 hover:text-rose-400 p-1">
                    <TrashIcon className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Stat({ title, value, valueClass = "" }) {
  return (
    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div className="text-xs text-slate-400 mb-1">{title}</div>
      <div className={`text-lg md:text-xl font-bold ${valueClass || "text-white"}`}>{value}</div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <div className="text-xs text-slate-400 mb-1">{label}</div>
      {children}
    </label>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/75 flex items-end md:items-center justify-center p-0 md:p-4">
      <div className="w-full md:max-w-md bg-slate-900 border border-slate-800 rounded-t-2xl md:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <div className="font-bold text-lg text-white">{title}</div>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-800 text-slate-400">
            <CloseIcon className="w-5 h-5" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  padding: 0.65rem 0.8rem;
  color: #f8fafc;
  outline: none;
}
.field:focus {
  border-color: #3b82f6;
}
</style>
