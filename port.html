<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portfolio Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #020617; user-select: none; }
    * { box-sizing: border-box; }
    .slider-container { display: flex; width: 300%; height: 100%; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .page-pane { width: 33.333333%; height: 100%; overflow-y: auto; overflow-x: hidden; }
    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    input, select, button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

const WORKER_BASE_URL = "https://yahoo.ninetaild.workers.dev";
const SYMBOLS_URL = "https://ninetaild.github.io/data/symbols.json";

// Google Finance 티커 포맷 변환 함수
const toGoogleSymbol = (symbol = "") => {
  const s = symbol.toUpperCase();
  if (s.endsWith(".KS")) return `KRX:${s.replace(".KS", "")}`;
  if (s.endsWith(".KQ")) return `KOSDAQ:${s.replace(".KQ", "")}`;
  if (s.endsWith(".T")) return `TYO:${s.replace(".T", "")}`;
  return s;
};

const marketOf = (symbol = "") => {
  const s = symbol.toUpperCase();
  if (s.endsWith(".KS") || s.endsWith(".KQ") || s.startsWith("KRX:") || s.startsWith("KOSDAQ:")) return "KR";
  if (s.endsWith(".T") || s.startsWith("TYO:")) return "JP";
  return "US";
};

const currencyOf = (symbol = "") => {
  const m = marketOf(symbol);
  return m === "KR" ? "KRW" : m === "JP" ? "JPY" : "USD";
};

const marketLabel = (symbol = "") => {
  const s = symbol.toUpperCase();
  if (s.endsWith(".KQ") || s.startsWith("KOSDAQ:")) return "코스닥";
  if (s.endsWith(".KS") || s.startsWith("KRX:")) return "코스피";
  if (s.endsWith(".T") || s.startsWith("TYO:")) return "일본";
  return "미국";
};

const format = (value, currency = "KRW") => {
  const n = Number(value);
  if (!Number.isFinite(n)) return "-";
  const digits = currency === "USD" ? 2 : 0;
  return new Intl.NumberFormat("ko-KR", { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(n);
};

const money = (value, currency = "KRW") => {
  const symbol = currency === "USD" ? "$" : currency === "JPY" ? "¥" : "₩";
  return symbol + format(value, currency);
};

const signedMoney = (value, currency = "KRW") => {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : "-"}${money(Math.abs(n), currency)}`;
};

const colorForReturn = (value) => value > 0 ? "text-emerald-400" : value < 0 ? "text-rose-400" : "text-slate-400";

const SearchIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>;
const PlusIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>;
const TrashIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 11v6M14 11v6"/></svg>;
const EditIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>;
const DownloadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>;
const UploadIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>;
const CloseIcon = ({className=""}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 6 12 12M18 6 6 18"/></svg>;

function App() {
  const [lots, setLots] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioLots");
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [accounts, setAccounts] = useState(() => {
    try {
      const saved = localStorage.getItem("globalPortfolioAccounts");
      return saved ? JSON.parse(saved) : ["기본 계좌"];
    } catch { return ["기본 계좌"]; }
  });

  const [selectedAccount, setSelectedAccount] = useState("ALL");
  const [symbols, setSymbols] = useState([]);
  const [search, setSearch] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [quotes, setQuotes] = useState({});
  const [fx, setFx] = useState({ USD: 1350, JPY: 9, KRW: 1 });
  const [loadingQuotes, setLoadingQuotes] = useState(false);
  const [quoteError, setQuoteError] = useState("");
  const [taxRate, setTaxRate] = useState(15.4);

  const [showAccounts, setShowAccounts] = useState(false);
  const [showAdd, setShowAdd] = useState(null);
  const [editingStock, setEditingStock] = useState(null);
  const [newAccount, setNewAccount] = useState("");
  const [page, setPage] = useState(0);

  const touchStartPos = useRef({ x: 0, y: 0 });
  const isSwiping = useRef(false);
  const importRef = useRef(null);

  useEffect(() => localStorage.setItem("globalPortfolioLots", JSON.stringify(lots)), [lots]);
  useEffect(() => localStorage.setItem("globalPortfolioAccounts", JSON.stringify(accounts)), [accounts]);

  useEffect(() => {
    fetch(SYMBOLS_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => Array.isArray(data) && setSymbols(data))
      .catch(e => console.error("symbols.json load failed", e));
  }, []);

  // 환율 정보 불러오기
  useEffect(() => {
    const loadFx = async () => {
      try {
        const res = await fetch(`${WORKER_BASE_URL}/quote?symbols=USDKRW=X,JPYKRW=X`);
        if (!res.ok) return;
        const data = await res.json();
        const list = data?.quoteResponse?.result || data?.quotes || [];
        let usd = fx.USD, jpy = fx.JPY;
        for (const q of Array.isArray(list) ? list : Object.values(list)) {
          if (q.symbol === "USDKRW=X") usd = Number(q.regularMarketPrice ?? q.price ?? usd);
          if (q.symbol === "JPYKRW=X") {
            const raw = Number(q.regularMarketPrice ?? q.price ?? jpy);
            jpy = raw > 100 ? raw / 100 : raw;
          }
        }
        setFx({ USD: usd, JPY: jpy, KRW: 1 });
      } catch (e) {
        console.warn("FX Fetch Error:", e);
      }
    };
    loadFx();
    const id = setInterval(loadFx, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, []);

  // Google Finance / Worker 시세 데이터 로드
  useEffect(() => {
    if (!lots.length) {
      setQuotes({});
      return;
    }
    const uniqueSymbols = [...new Set(lots.map(x => x.symbol).filter(Boolean))];
    let cancelled = false;

    const loadQuotes = async () => {
      setLoadingQuotes(true);
      setQuoteError("");
      try {
        const fetchSymbols = uniqueSymbols.map(s => toGoogleSymbol(s)).join(",");
        const res = await fetch(`${WORKER_BASE_URL}/quote?symbols=${encodeURIComponent(fetchSymbols)}`);
        
        let list = [];
        if (res.ok) {
          const data = await res.json();
          list = data?.quoteResponse?.result || data?.quotes || (Array.isArray(data) ? data : Object.values(data));
        }

        const nextQuotes = {};
        for (const q of list) {
          if (!q) continue;
          const key = q.symbol || q.ticker;
          if (!key) continue;

          const price = Number(q.price ?? q.regularMarketPrice ?? q.lastPrice ?? 0);
          const changePercent = Number(q.changePercent ?? q.regularMarketChangePercent ?? 0);

          let yieldPct = Number(q.dividendYield ?? q.yield ?? q.trailingAnnualDividendYield ?? 0);
          if (yieldPct > 0 && yieldPct <= 1) yieldPct *= 100;

          let annualDiv = Number(q.annualDividend ?? q.dividendRate ?? q.trailingAnnualDividendRate ?? 0);
          if (!annualDiv && yieldPct > 0 && price > 0) annualDiv = (price * yieldPct) / 100;
          if (!yieldPct && annualDiv > 0 && price > 0) yieldPct = (annualDiv / price) * 100;

          const itemData = {
            price,
            changePercent,
            dividendYield: yieldPct,
            annualDividend: annualDiv,
            name: q.longName || q.shortName || q.name || key
          };

          nextQuotes[key] = itemData;
          // 매핑 매칭을 위해 원래 티커 형태로도 복사
          for (const orig of uniqueSymbols) {
            if (toGoogleSymbol(orig) === key || orig === key) {
              nextQuotes[orig] = itemData;
            }
          }
        }

        if (!cancelled) setQuotes(nextQuotes);
      } catch (e) {
        console.error("Quote Fetching Error:", e);
        if (!cancelled) setQuoteError("시세 데이터를 불러오는데 실패했습니다.");
      } finally {
        if (!cancelled) setLoadingQuotes(false);
      }
    };

    loadQuotes();
    const id = setInterval(loadQuotes, 60 * 1000);
    return () => { cancelled = true; clearInterval(id); };
  }, [lots]);

  const symbolsBySearch = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];
    return symbols
      .filter(item => {
        const symbol = String(item.symbol || "").toLowerCase();
        const kws = Array.isArray(item.searchKeywords) ? item.searchKeywords.map(x => String(x).toLowerCase()) : [];
        return symbol.includes(q) || kws.some(k => k.includes(q));
      })
      .map(item => ({
        ...item,
        market: marketOf(item.symbol),
        currency: currencyOf(item.symbol)
      }))
      .slice(0, 15);
  }, [search, symbols]);

  const visibleLots = useMemo(() => {
    return selectedAccount === "ALL"
      ? lots
      : lots.filter(l => (l.account || "기본 계좌") === selectedAccount);
  }, [lots, selectedAccount]);

  // 포트폴리오 집계
  const portfolio = useMemo(() => {
    const map = new Map();
    for (const lot of visibleLots) {
      if (!map.has(lot.symbol)) {
        map.set(lot.symbol, {
          symbol: lot.symbol,
          name: lot.name || lot.symbol,
          market: marketOf(lot.symbol),
          currency: lot.currency || currencyOf(lot.symbol),
          qty: 0,
          investedKRW: 0,
          investedForeign: 0,
          lots: []
        });
      }
      const p = map.get(lot.symbol);
      const q = Number(lot.quantity) || 0;
      p.qty += q;
      p.investedKRW += q * (Number(lot.avgPriceKRW) || 0);
      p.investedForeign += q * (Number(lot.avgPriceForeign) || 0);
      p.lots.push(lot);
    }

    return [...map.values()].map(p => {
      const q = quotes[p.symbol] || quotes[toGoogleSymbol(p.symbol)] || {};
      const rate = fx[p.currency] || 1;
      const currentForeign = Number(q.price || 0);
      const currentKRW = currentForeign * rate;
      const valueKRW = p.qty * currentKRW;
      const profit = valueKRW - p.investedKRW;
      const profitPct = p.investedKRW ? (profit / p.investedKRW) * 100 : 0;

      const annualDividendForeign = Number(q.annualDividend || 0);
      const annualDividendKRW = p.qty * annualDividendForeign * rate;

      return {
        ...p,
        name: q.name || p.name,
        currentForeign,
        currentKRW,
        valueKRW,
        profit,
        profitPct,
        changePercent: Number(q.changePercent || 0),
        dividendYield: Number(q.dividendYield || 0),
        annualDividendForeign,
        annualDividendKRW,
        netDividendKRW: annualDividendKRW * (1 - taxRate / 100)
      };
    }).sort((a, b) => b.valueKRW - a.valueKRW);
  }, [visibleLots, quotes, fx, taxRate]);

  const stats = useMemo(() => {
    const invested = portfolio.reduce((s, x) => s + x.investedKRW, 0);
    const value = portfolio.reduce((s, x) => s + x.valueKRW, 0);
    const profit = value - invested;
    const annual = portfolio.reduce((s, x) => s + x.annualDividendKRW, 0);
    const net = portfolio.reduce((s, x) => s + x.netDividendKRW, 0);
    return {
      invested, value, profit,
      profitPct: invested ? (profit / invested) * 100 : 0,
      annual, net, monthly: net / 12
    };
  }, [portfolio]);

  // 보유 종목 추가
  const addLot = (e) => {
    e.preventDefault();
    const fd = new FormData(e.currentTarget);
    const qty = Number(fd.get("quantity"));
    const priceKRW = Number(fd.get("priceKRW"));
    const date = fd.get("date");
    if (!qty || !priceKRW || !date || !showAdd) return;

    const currency = showAdd.currency;
    const rate = fx[currency] || 1;
    const lot = {
      id: Date.now().toString(),
      symbol: showAdd.symbol,
      name: showAdd.name || showAdd.symbol,
      market: showAdd.market,
      currency,
      quantity: qty,
      avgPriceKRW: priceKRW,
      avgPriceForeign: priceKRW / rate,
      date,
      account: fd.get("account") || accounts[0] || "기본 계좌"
    };

    setLots(prev => [...prev, lot]);
    setShowAdd(null);
    setSearch("");
    setSearchOpen(false);
  };

  // 보유 종목 개별 Lot 수정/삭제
  const handleUpdateLot = (lotId, field, val) => {
    setLots(prev => prev.map(l => {
      if (l.id !== lotId) return l;
      const numVal = Number(val) || 0;
      const updated = { ...l, [field]: field === "quantity" || field === "avgPriceKRW" ? numVal : val };
      if (field === "avgPriceKRW") {
        updated.avgPriceForeign = numVal / (fx[l.currency] || 1);
      }
      return updated;
    }));
  };

  const handleDeleteLot = (lotId) => {
    setLots(prev => prev.filter(l => l.id !== lotId));
  };

  const handleDeleteSymbolAll = (symbol) => {
    if (confirm(`${symbol} 종목의 모든 매수 내역을 삭제하시겠습니까?`)) {
      setLots(prev => prev.filter(l => l.symbol !== symbol));
      if (editingStock?.symbol === symbol) setEditingStock(null);
    }
  };

  const addAccount = () => {
    const name = newAccount.trim();
    if (!name || accounts.includes(name)) return;
    setAccounts(prev => [...prev, name]);
    setSelectedAccount(name);
    setNewAccount("");
  };

  const deleteAccount = (acc) => {
    if (accounts.length <= 1) return alert("최소 1개의 계좌는 필요합니다.");
    if (!confirm(`'${acc}' 계좌와 해당 계좌의 보유 종목을 삭제하시겠습니까?`)) return;
    setAccounts(prev => prev.filter(x => x !== acc));
    setLots(prev => prev.filter(x => (x.account || "기본 계좌") !== acc));
    if (selectedAccount === acc) setSelectedAccount("ALL");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ lots, accounts }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "portfolio_backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) setLots(data);
        else if (data?.lots) {
          setLots(data.lots);
          if (Array.isArray(data.accounts)) setAccounts(data.accounts);
        }
        alert("성공적으로 불러왔습니다.");
      } catch {
        alert("올바르지 않은 JSON 파일입니다.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // 터치 및 드래그 스와이프 제스처 처리
  const handleTouchStart = (e) => {
    const touch = e.touches ? e.touches[0] : e;
    touchStartPos.current = { x: touch.clientX, y: touch.clientY };
    isSwiping.current = true;
  };

  const handleTouchEnd = (e) => {
    if (!isSwiping.current) return;
    isSwiping.current = false;
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const dx = touch.clientX - touchStartPos.current.x;
    const dy = touch.clientY - touchStartPos.current.y;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0 && page < 2) setPage(p => p + 1);
      if (dx > 0 && page > 0) setPage(p => p - 1);
    }
  };

  return (
    <div className="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col">
      {/* 상단 헤더 */}
      <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20 flex-shrink-0">
        <div className="flex items-center gap-4">
          <div className="font-bold text-lg text-white">
            {page === 0 ? "Portfolio" : page === 1 ? "Dividend" : "Market Heatmap"}
          </div>
          <div className="flex gap-1.5">
            {[0, 1, 2].map(n => (
              <button
                key={n}
                onClick={() => setPage(n)}
                className={`w-2.5 h-2.5 rounded-full transition-all ${page === n ? "bg-blue-500 w-5" : "bg-slate-700"}`}
              />
            ))}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportData} title="내보내기" className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
            <DownloadIcon className="w-4 h-4" />
          </button>
          <button onClick={() => importRef.current?.click()} title="가져오기" className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
            <UploadIcon className="w-4 h-4" />
          </button>
          <input ref={importRef} type="file" accept=".json" className="hidden" onChange={importData} />
        </div>
      </header>

      {/* 스와이프 가능한 슬라이더 컨테이너 */}
      <div 
        className="flex-1 relative overflow-hidden"
        onTouchStart={handleTouchStart}
        onTouchEnd={handleTouchEnd}
      >
        <div 
          className="slider-container"
          style={{ transform: `translateX(-${page * (100 / 3)}%)` }}
        >
          {/* Page 1: Portfolio */}
          <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
            <div className="max-w-6xl mx-auto space-y-4">
              <div className="flex flex-col md:flex-row gap-3">
                <div className="flex-1 relative">
                  <div className="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-blue-500">
                    <SearchIcon className="w-5 h-5 text-slate-500 mr-2" />
                    <input
                      value={search}
                      onChange={e => { setSearch(e.target.value); setSearchOpen(true); }}
                      onFocus={() => setSearchOpen(true)}
                      placeholder="종목명 또는 티커 검색 (예: 삼성전자, AAPL, 005930)"
                      className="w-full bg-transparent outline-none text-sm text-white placeholder-slate-500"
                    />
                    {search && (
                      <button onClick={() => { setSearch(""); setSearchOpen(false); }}>
                        <CloseIcon className="w-4 h-4 text-slate-500" />
                      </button>
                    )}
                  </div>
                  {searchOpen && search.trim() && (
                    <div className="absolute z-30 left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-72 overflow-y-auto thin-scroll">
                      {symbolsBySearch.length ? symbolsBySearch.map(item => (
                        <button
                          key={item.symbol}
                          onClick={() => { setShowAdd(item); setSearchOpen(false); }}
                          className="w-full text-left px-4 py-3 hover:bg-slate-800 border-b border-slate-800/50 flex justify-between items-center"
                        >
                          <div>
                            <div className="text-sm font-medium text-white">{item.name}</div>
                            <div className="text-xs text-slate-400">{item.symbol} · {marketLabel(item.symbol)}</div>
                          </div>
                          <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">{item.currency}</span>
                        </button>
                      )) : <div className="p-4 text-sm text-slate-500 text-center">검색 결과가 없습니다.</div>}
                    </div>
                  )}
                </div>

                <div className="flex gap-2">
                  <select
                    value={selectedAccount}
                    onChange={e => setSelectedAccount(e.target.value)}
                    className="bg-slate-900 border border-slate-800 rounded-xl px-3 text-sm text-white outline-none"
                  >
                    <option value="ALL">전체 계좌</option>
                    {accounts.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                  <button onClick={() => setShowAccounts(true)} className="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm font-medium hover:bg-slate-800">
                    계좌 관리
                  </button>
                </div>
              </div>

              {/* 요약 카드 */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <Stat title="총 평가금액" value={money(stats.value)} />
                <Stat title="총 투자원금" value={money(stats.invested)} />
                <Stat title="평가손익" value={signedMoney(stats.profit)} valueClass={colorForReturn(stats.profit)} />
                <Stat title="수익률" value={`${stats.profitPct >= 0 ? "+" : ""}${stats.profitPct.toFixed(2)}%`} valueClass={colorForReturn(stats.profitPct)} />
              </div>

              <div className="flex justify-between items-center text-xs text-slate-400 px-1">
                <div>보유 종목 {portfolio.length}개</div>
                <div>USD/KRW {format(fx.USD, "KRW")} · JPY/KRW {format(fx.JPY, "KRW")} {loadingQuotes && " (갱신 중...)"}</div>
              </div>

              {quoteError && <div className="text-xs text-amber-400 bg-amber-950/40 border border-amber-800/50 p-3 rounded-xl">{quoteError}</div>}

              {/* 종목 리스트 테이블 */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <div className="hidden md:grid grid-cols-[2fr_1fr_1fr_1fr_1fr_80px] gap-3 px-4 py-3 text-xs text-slate-400 font-medium border-b border-slate-800">
                  <div>종목명</div>
                  <div>보유수량</div>
                  <div>현재가</div>
                  <div>평가금액</div>
                  <div>손익</div>
                  <div className="text-right">관리</div>
                </div>

                {portfolio.length === 0 ? (
                  <div className="p-12 text-center text-slate-500 text-sm">등록된 종목이 없습니다. 상단 검색에서 종목을 추가하세요.</div>
                ) : portfolio.map(item => (
                  <div key={item.symbol} className="px-4 py-3.5 border-b border-slate-800/60 last:border-0 hover:bg-slate-800/30 transition-colors">
                    <div className="grid md:grid-cols-[2fr_1fr_1fr_1fr_1fr_80px] gap-2 md:gap-3 items-center">
                      <div>
                        <div className="font-semibold text-white text-sm truncate">{item.name}</div>
                        <div className="text-xs text-slate-400">{item.symbol} · {marketLabel(item.symbol)}</div>
                      </div>
                      <div className="text-sm">{format(item.qty, item.currency)} 주</div>
                      <div className="text-sm">
                        {item.currentForeign ? money(item.currentForeign, item.currency) : "-"}
                        <div className="text-xs text-slate-400">{item.currentForeign ? money(item.currentKRW, "KRW") : ""}</div>
                      </div>
                      <div className="text-sm font-medium">{item.valueKRW ? money(item.valueKRW) : "-"}</div>
                      <div className={`text-sm font-medium ${colorForReturn(item.profit)}`}>
                        {item.valueKRW ? signedMoney(item.profit) : "-"}
                        <div className="text-xs">{item.valueKRW ? `${item.profitPct >= 0 ? "+" : ""}${item.profitPct.toFixed(2)}%` : ""}</div>
                      </div>
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={() => setEditingStock(item)} title="수정" className="p-1.5 rounded-lg hover:bg-slate-700 text-slate-400 hover:text-white">
                          <EditIcon className="w-4 h-4" />
                        </button>
                        <button onClick={() => handleDeleteSymbolAll(item.symbol)} title="삭제" className="p-1.5 rounded-lg hover:bg-slate-700 text-slate-400 hover:text-rose-400">
                          <TrashIcon className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Page 2: Dividend */}
          <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
            <div className="max-w-6xl mx-auto space-y-4">
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <Stat title="연간 예상 분배금" value={money(stats.annual)} />
                <Stat title="세후 연간 분배금" value={money(stats.net)} />
                <Stat title="월평균 세후 분배금" value={money(stats.monthly)} />
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                  <div className="text-xs text-slate-400">배당소득세율 적용</div>
                  <div className="flex items-center gap-2 mt-2">
                    <input
                      type="number"
                      step="0.1"
                      value={taxRate}
                      onChange={e => setTaxRate(Number(e.target.value))}
                      className="w-20 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-sm text-white"
                    />
                    <span className="text-sm text-slate-300">%</span>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <div className="px-4 py-3 border-b border-slate-800">
                  <div className="font-semibold text-white">종목별 예상 배당 정보</div>
                </div>
                {portfolio.length === 0 ? (
                  <div className="p-12 text-center text-slate-500 text-sm">보유 중인 종목이 없습니다.</div>
                ) : (
                  portfolio.map(item => (
                    <div key={item.symbol} className="px-4 py-4 border-b border-slate-800/60 last:border-0 grid grid-cols-2 md:grid-cols-4 gap-3 items-center">
                      <div>
                        <div className="font-medium text-white">{item.name}</div>
                        <div className="text-xs text-slate-400">{item.symbol} · {format(item.qty, item.currency)} 주</div>
                      </div>
                      <div>
                        <div className="text-xs text-slate-400">주당 연간 배당금 / 수익률</div>
                        <div className="text-sm font-medium">{item.annualDividendForeign ? money(item.annualDividendForeign, item.currency) : "-"} ({item.dividendYield.toFixed(2)}%)</div>
                      </div>
                      <div>
                        <div className="text-xs text-slate-400">연간 배당금 (세전)</div>
                        <div className="text-sm font-medium">{money(item.annualDividendKRW)}</div>
                      </div>
                      <div>
                        <div className="text-xs text-slate-400">연간 배당금 (세후)</div>
                        <div className="text-sm font-medium text-emerald-400">{money(item.netDividendKRW)}</div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>

          {/* Page 3: Market Heatmap */}
          <div className="page-pane thin-scroll p-4 md:p-6 space-y-4">
            <div className="max-w-6xl mx-auto space-y-4">
              <div className="flex justify-between items-center">
                <div className="font-semibold text-lg text-white">포트폴리오 히트맵</div>
                <div className="text-xs text-slate-400">비중 및 당일 등락률 기준</div>
              </div>

              {portfolio.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 text-sm">
                  등록된 종목이 없습니다.
                </div>
              ) : (
                <div className="flex flex-wrap gap-2 min-h-[500px]">
                  {portfolio.map(item => {
                    const totalVal = stats.value || 1;
                    const weightPct = Math.max((item.valueKRW / totalVal) * 100, 8); // 최소 크기 보장
                    const change = item.changePercent;
                    
                    // 등락률에 따른 반응형 컬러 세기 계산
                    const intensity = Math.min(Math.abs(change) / 4, 1);
                    const bg = change > 0
                      ? `rgba(16, 185, 129, ${0.2 + intensity * 0.7})`
                      : change < 0
                      ? `rgba(244, 63, 94, ${0.2 + intensity * 0.7})`
                      : "rgba(51, 65, 85, 0.4)";

                    return (
                      <div
                        key={item.symbol}
                        className="rounded-xl border border-slate-700/60 p-3.5 flex flex-col justify-between transition-all hover:scale-[1.01]"
                        style={{
                          flexGrow: weightPct,
                          flexBasis: `${weightPct}%`,
                          minWidth: '130px',
                          minHeight: '110px',
                          backgroundColor: bg
                        }}
                      >
                        <div className="flex justify-between items-start gap-1">
                          <span className="font-bold text-white text-sm truncate">{item.name}</span>
                          <span className="text-[10px] bg-slate-950/60 px-1.5 py-0.5 rounded text-slate-300">
                            {((item.valueKRW / totalVal) * 100).toFixed(1)}%
                          </span>
                        </div>
                        <div>
                          <div className={`text-base font-extrabold ${colorForReturn(change)}`}>
                            {change >= 0 ? "+" : ""}{change.toFixed(2)}%
                          </div>
                          <div className="text-xs text-slate-200 mt-0.5 font-medium">{money(item.valueKRW)}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* 모달: 종목 추가 */}
      {showAdd && (
        <Modal title={`${showAdd.name} 추가`} onClose={() => setShowAdd(null)}>
          <form onSubmit={addLot} className="space-y-4">
            <div className="text-xs text-slate-400">{showAdd.symbol} · {showAdd.currency}</div>
            <Field label="매수 수량"><input name="quantity" type="number" step="any" required autoFocus className="field" /></Field>
            <Field label="매수 단가 (KRW)"><input name="priceKRW" type="number" step="any" required className="field" /></Field>
            <Field label="매수일"><input name="date" type="date" defaultValue={new Date().toISOString().slice(0, 10)} required className="field" /></Field>
            <Field label="계좌 선택">
              <select name="account" defaultValue={accounts[0]} className="field">
                {accounts.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
            <button className="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 font-medium transition-colors">추가하기</button>
          </form>
        </Modal>
      )}

      {/* 모달: 종목 수정 */}
      {editingStock && (
        <Modal title={`${editingStock.name} 매수 내역 관리`} onClose={() => setEditingStock(null)}>
          <div className="space-y-4 max-h-[60vh] overflow-y-auto thin-scroll pr-1">
            {editingStock.lots.map((lot, idx) => (
              <div key={lot.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                <div className="flex justify-between items-center text-xs text-slate-400">
                  <span>매수건 #{idx + 1} ({lot.date})</span>
                  <button onClick={() => handleDeleteLot(lot.id)} className="text-rose-400 hover:underline">삭제</button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="수량">
                    <input
                      type="number"
                      step="any"
                      value={lot.quantity}
                      onChange={e => handleUpdateLot(lot.id, "quantity", e.target.value)}
                      className="field text-sm"
                    />
                  </Field>
                  <Field label="매수 단가 (원화)">
                    <input
                      type="number"
                      step="any"
                      value={lot.avgPriceKRW}
                      onChange={e => handleUpdateLot(lot.id, "avgPriceKRW", e.target.value)}
                      className="field text-sm"
                    />
                  </Field>
                </div>
              </div>
            ))}
            <button onClick={() => setEditingStock(null)} className="w-full bg-slate-800 hover:bg-slate-700 text-white rounded-xl py-2.5 font-medium">
              완료
            </button>
          </div>
        </Modal>
      )}

      {/* 모달: 계좌 관리 */}
      {showAccounts && (
        <Modal title="계좌 관리" onClose={() => setShowAccounts(false)}>
          <div className="space-y-4">
            <div className="flex gap-2">
              <input
                value={newAccount}
                onChange={e => setNewAccount(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addAccount()}
                placeholder="새 계좌 이름"
                className="field flex-1"
              />
              <button onClick={addAccount} className="px-4 bg-blue-600 rounded-xl text-white font-medium hover:bg-blue-500">
                <PlusIcon className="w-5 h-5" />
              </button>
            </div>
            <div className="space-y-2 max-h-60 overflow-y-auto thin-scroll">
              {accounts.map(a => (
                <div key={a} className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
                  <span className="text-sm font-medium text-white">{a}</span>
                  <button onClick={() => deleteAccount(a)} className="text-slate-500 hover:text-rose-400 p-1">
                    <TrashIcon className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Stat({ title, value, valueClass = "" }) {
  return (
    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div className="text-xs text-slate-400 mb-1">{title}</div>
      <div className={`text-lg md:text-xl font-bold ${valueClass || "text-white"}`}>{value}</div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <div className="text-xs text-slate-400 mb-1">{label}</div>
      {children}
    </label>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/75 flex items-end md:items-center justify-center p-0 md:p-4">
      <div className="w-full md:max-w-md bg-slate-900 border border-slate-800 rounded-t-2xl md:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <div className="font-bold text-lg text-white">{title}</div>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-800 text-slate-400">
            <CloseIcon className="w-5 h-5" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<style>
.field {
  width: 100%;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 0.75rem;
  padding: 0.65rem 0.8rem;
  color: #f8fafc;
  outline: none;
}
.field:focus {
  border-color: #3b82f6;
}
</style>
</body>
</html>
