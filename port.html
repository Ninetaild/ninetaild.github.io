<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Portfolio & Dividend Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SearchIcon = ({ className = "" }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
    const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
    const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const UploadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
    const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const MinusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const PlusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const CloseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const LayoutToggleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>;

    const WORKER_BASE_URL = "https://yahoo.ninetaild.workers.dev";

    const fetchViaWorker = async (path, options = {}) => {
        const res = await fetch(`${WORKER_BASE_URL}${path}`, options);
        if (!res.ok) throw new Error(`Worker proxy error: ${res.status}`);
        return await res.json();
    };

    const getCurrencySymbol = (curr) => {
        switch (curr) {
            case 'USD': return '$';
            case 'JPY': return '¥';
            case 'KRW': default: return '₩';
        }
    };

    function App() {
        const [lots, setLots] = useState(() => {
            try {
                const saved = localStorage.getItem('globalPortfolioLots');
                return saved ? JSON.parse(saved) : [];
            } catch (e) { return []; }
        }); 
        const [quotes, setQuotes] = useState({}); 
        const [fxRates, setFxRates] = useState({ USD: 1350, JPY: 9, KRW: 1 }); 
        
        const [searchQuery, setSearchQuery] = useState('');
        const [searchResults, setSearchResults] = useState([]);
        const [isSearching, setIsSearching] = useState(false);
        const [localSymbols, setLocalSymbols] = useState([]); 

        const [marketFilter, setMarketFilter] = useState('ALL'); 
        const [displayCurrency, setDisplayCurrency] = useState('KRW'); 
        
        const [currentPage, setCurrentPage] = useState(0); 
        const [isVerticalLayout, setIsVerticalLayout] = useState(false); // 모바일 가로/세로 전환 상태

        const [selectedAccount, setSelectedAccount] = useState('ALL');
        const [accountNicknames, setAccountNicknames] = useState(() => {
            try {
                const saved = localStorage.getItem('globalPortfolioAccounts');
                return saved ? JSON.parse(saved) : ['기본 계좌'];
            } catch (e) { return ['기본 계좌']; }
        });
        const [newAccountInput, setNewAccountInput] = useState('');
        const [showAccountManager, setShowAccountManager] = useState(false);

        const [addLotModal, setAddLotModal] = useState(null); 
        const [editModalSymbol, setEditModalSymbol] = useState(null); 
        
        const fileInputRef = useRef(null);
        const searchCache = useRef({}); 

        useEffect(() => {
            localStorage.setItem('globalPortfolioLots', JSON.stringify(lots));
        }, [lots]);

        useEffect(() => {
            localStorage.setItem('globalPortfolioAccounts', JSON.stringify(accountNicknames));
        }, [accountNicknames]);

        useEffect(() => {
            fetch('https://ninetaild.github.io/data/symbols.json')
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) setLocalSymbols(data);
                })
                .catch(err => console.error("Failed to load symbols.json", err));
        }, []);

        useEffect(() => {
            const fetchFX = async () => {
                try {
                    const res = await fetch('https://open.er-api.com/v6/latest/KRW');
                    const data = await res.json();
                    if (data && data.rates) {
                        setFxRates({
                            USD: 1 / data.rates.USD,
                            JPY: 1 / data.rates.JPY,
                            KRW: 1
                        });
                    }
                } catch (error) { console.error("FX fetch failed"); }
            };
            fetchFX();
        }, []);

        useEffect(() => {
            if (searchQuery.trim().length < 1) {
                setSearchResults([]);
                return;
            }
            const queryLower = searchQuery.trim().toLowerCase();
            const cacheKey = `${queryLower}_${marketFilter}`;
            if (searchCache.current[cacheKey]) {
                setSearchResults(searchCache.current[cacheKey]);
                setIsSearching(false);
                return;
            }

            const abortController = new AbortController();
            const timeoutId = setTimeout(async () => {
                setIsSearching(true);
                try {
                    let results = [];
                    if (localSymbols.length > 0) {
                        const matched = localSymbols.filter(item => {
                            if (marketFilter !== 'ALL' && item.market !== marketFilter) return false;
                            const matchesSymbol = item.symbol?.toLowerCase().includes(queryLower);
                            const matchesName = item.name?.toLowerCase().includes(queryLower);
                            const matchesKeywords = item.searchKeywords && item.searchKeywords.some(kw => kw.toLowerCase().includes(queryLower));
                            return matchesSymbol || matchesName || matchesKeywords;
                        });

                        results = matched.map(item => ({
                            symbol: item.symbol,
                            name: item.name,
                            market: item.market || 'US',
                            currency: item.currency || (item.market === 'KR' ? 'KRW' : item.market === 'JP' ? 'JPY' : 'USD'),
                            searchKeywords: item.searchKeywords || []
                        }));
                    }

                    if (results.length === 0) {
                        const data = await fetchViaWorker(`/search?q=${encodeURIComponent(searchQuery)}`, { signal: abortController.signal });
                        let rawResults = [];
                        if (data && data.quotes) {
                            rawResults = data.quotes.filter(q => {
                                const type = (q.quoteType || '').toUpperCase();
                                return type === 'EQUITY' || type === 'ETF' || type === 'MUTUALFUND' || type === 'STOCKS';
                            });
                            if (rawResults.length === 0) rawResults = data.quotes.slice(0, 5);
                        }

                        const uniqueResults = [];
                        const seen = new Set();
                        for (const item of rawResults) {
                            if (!seen.has(item.symbol)) {
                                seen.add(item.symbol);
                                uniqueResults.push(item);
                            }
                        }

                        results = uniqueResults.map(q => {
                            let market = 'US', currency = 'USD';
                            if (q.symbol.endsWith('.KS') || q.symbol.endsWith('.KQ')) { market = 'KR'; currency = 'KRW'; }
                            else if (q.symbol.endsWith('.T')) { market = 'JP'; currency = 'JPY'; }
                            const primaryName = q.longname || q.shortname || q.symbol;
                            return { ...q, name: primaryName, market, currency, searchKeywords: [primaryName.toLowerCase()] };
                        }).filter(q => marketFilter === 'ALL' || q.market === marketFilter);
                    }

                    searchCache.current[cacheKey] = results;
                    setSearchResults(results);
                } catch (error) {
                    if (error.name !== 'AbortError') setSearchResults([]);
                } finally {
                    if (!abortController.signal.aborted) setIsSearching(false);
                }
            }, 300);

            return () => { clearTimeout(timeoutId); abortController.abort(); };
        }, [searchQuery, marketFilter, localSymbols]);

        useEffect(() => {
            const uniqueSymbols = [...new Set(lots.map(l => l.symbol))];
            if (uniqueSymbols.length === 0) return;

            const fetchQuotes = async () => {
                try {
                    const data = await fetchViaWorker(`/quote?symbols=${encodeURIComponent(uniqueSymbols.join(','))}`);
                    const quoteList = data?.quoteResponse?.result || data?.quotes;
                    
                    if (quoteList) {
                        const newQuotes = {};
                        const itemsArray = Array.isArray(quoteList) ? quoteList : Object.values(quoteList);
                        
                        itemsArray.forEach(q => {
                            const sym = q.symbol;
                            if (sym) {
                                const price = q.regularMarketPrice ?? q.price ?? q.regularMarketPreviousClose ?? 0;
                                const rawYield = q.dividendYield ?? q.trailingAnnualDividendYield ?? 0;
                                const dividendYield = rawYield ? (rawYield > 1 ? rawYield : rawYield * 100) : 0;
                                const annualDividend = q.trailingAnnualDividendRate ?? q.dividendRate ?? (price * (dividendYield / 100)) ?? 0;

                                newQuotes[sym] = {
                                    price,
                                    changePercent: q.regularMarketChangePercent ?? q.changePercent ?? 0,
                                    longname: q.longname || q.shortname || sym,
                                    dividendYield,
                                    annualDividend
                                };
                            }
                        });
                        setQuotes(prev => ({ ...prev, ...newQuotes }));
                    }
                } catch (error) { console.error("Quote fetch failed", error); }
            };

            fetchQuotes();
            const intervalId = setInterval(fetchQuotes, 60000);
            return () => clearInterval(intervalId);
        }, [lots]);

        const filteredLots = useMemo(() => {
            if (selectedAccount === 'ALL') return lots;
            return lots.filter(l => (l.account || '기본 계좌') === selectedAccount);
        }, [lots, selectedAccount]);

        const consolidatedPortfolio = useMemo(() => {
            const map = new Map();
            filteredLots.forEach(lot => {
                if (!map.has(lot.symbol)) {
                    map.set(lot.symbol, {
                        symbol: lot.symbol, name: lot.name, market: lot.market, currency: lot.currency,
                        totalQuantity: 0, totalInvestedKRW: 0, totalInvestedForeign: 0,
                    });
                }
                const current = map.get(lot.symbol);
                current.totalQuantity += lot.quantity;
                current.totalInvestedKRW += (lot.quantity * lot.avgPriceKRW);
                current.totalInvestedForeign += (lot.quantity * lot.avgPriceForeign);
            });

            return Array.from(map.values()).map(item => {
                const avgPriceKRW = item.totalInvestedKRW / item.totalQuantity;
                const avgPriceForeign = item.totalInvestedForeign / item.totalQuantity;
                const quote = quotes[item.symbol];
                const currentPriceForeign = quote?.price ?? avgPriceForeign;
                const currentChangePercent = quote?.changePercent ?? 0;
                const resolvedName = quote?.longname || item.name;
                
                const dividendYield = quote?.dividendYield ?? 0;
                const annualDividendPerShare = quote?.annualDividend ?? (currentPriceForeign * (dividendYield / 100));
                
                const currentPriceKRW = currentPriceForeign * fxRates[item.currency];
                const currentValueKRW = item.totalQuantity * currentPriceKRW;
                const returnKRW = currentValueKRW - item.totalInvestedKRW;
                const returnPercent = (returnKRW / item.totalInvestedKRW) * 100;
                
                const annualDividendKRW = item.totalQuantity * annualDividendPerShare * fxRates[item.currency];

                return {
                    ...item, name: resolvedName, avgPriceKRW, avgPriceForeign,
                    currentPriceForeign, currentPriceKRW, currentValueKRW,
                    returnKRW, returnPercent, dailyChangePercent: currentChangePercent,
                    dividendYield, annualDividendKRW
                };
            }).sort((a, b) => b.currentValueKRW - a.currentValueKRW);
        }, [filteredLots, quotes, fxRates]);

        const dividendStats = useMemo(() => {
            const totalAnnualKRW = consolidatedPortfolio.reduce((sum, item) => sum + item.annualDividendKRW, 0);
            const totalValuation = consolidatedPortfolio.reduce((sum, item) => sum + item.currentValueKRW, 0);
            const avgYield = totalValuation > 0 ? (totalAnnualKRW / totalValuation) * 100 : 0;
            return {
                annual: totalAnnualKRW,
                monthly: totalAnnualKRW / 12,
                avgYield
            };
        }, [consolidatedPortfolio]);

        const handleAddLot = (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const qty = parseFloat(formData.get('quantity'));
            const priceKRW = parseFloat(formData.get('priceKRW'));
            const date = formData.get('buyDate');
            const account = formData.get('account') || accountNicknames[0] || '기본 계좌';

            if (!qty || !priceKRW || !date) return;
            const rate = fxRates[addLotModal.currency] || 1;

            const newLot = {
                id: Date.now().toString(),
                symbol: addLotModal.symbol,
                name: addLotModal.name,
                market: addLotModal.market,
                currency: addLotModal.currency,
                quantity: qty,
                avgPriceKRW: priceKRW,
                avgPriceForeign: priceKRW / rate,
                date, account
            };

            setLots([...lots, newLot]);
            setAddLotModal(null);
            setSearchQuery('');
            setSearchResults([]);
        };

        const handleDeleteLot = (id) => {
            setLots(lots.filter(l => l.id !== id));
        };

        const handleUpdateLot = (id, field, value) => {
            setLots(lots.map(l => {
                if (l.id === id) {
                    const updated = { ...l, [field]: value };
                    if (field === 'avgPriceKRW') updated.avgPriceForeign = value / fxRates[l.currency];
                    return updated;
                }
                return l;
            }));
        };

        const handleMergeLots = (symbol) => {
            const symbolLots = filteredLots.filter(l => l.symbol === symbol);
            if (symbolLots.length <= 1) return;

            let totalQty = 0, totalInvestedKRW = 0;
            symbolLots.forEach(l => {
                totalQty += Number(l.quantity);
                totalInvestedKRW += (Number(l.quantity) * Number(l.avgPriceKRW));
            });

            const mergedAvgPriceKRW = totalInvestedKRW / totalQty;
            const mergedLot = {
                id: Date.now().toString(),
                symbol, name: symbolLots[0].name, market: symbolLots[0].market, currency: symbolLots[0].currency,
                quantity: totalQty, avgPriceKRW: mergedAvgPriceKRW, avgPriceForeign: mergedAvgPriceKRW / fxRates[symbolLots[0].currency],
                date: new Date().toISOString().split('T')[0], account: symbolLots[0].account || '기본 계좌'
            };

            const otherLots = lots.filter(l => !(l.symbol === symbol && (selectedAccount === 'ALL' || (l.account || '기본 계좌') === selectedAccount)));
            setLots([...otherLots, mergedLot]);
        };

        const handleAddAccount = () => {
            if (!newAccountInput.trim()) return;
            if (!accountNicknames.includes(newAccountInput.trim())) {
                setAccountNicknames([...accountNicknames, newAccountInput.trim()]);
            }
            setSelectedAccount(newAccountInput.trim());
            setNewAccountInput('');
        };

        const handleDeleteAccount = (accToDelete, e) => {
            e.stopPropagation();
            if (accountNicknames.length <= 1) {
                alert("최소 1개의 계좌는 유지되어야 합니다.");
                return;
            }
            if (confirm(`'${accToDelete}' 계좌를 삭제하시겠습니까? 해당 계좌의 종목들도 함께 삭제됩니다.`)) {
                const updatedAccounts = accountNicknames.filter(acc => acc !== accToDelete);
                setAccountNicknames(updatedAccounts);
                setLots(lots.filter(l => (l.account || '기본 계좌') !== accToDelete));
                if (selectedAccount === accToDelete) setSelectedAccount('ALL');
            }
        };

        const handleExport = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ lots, accountNicknames }));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "portfolio_export.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        const handleImport = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (Array.isArray(parsed)) setLots(parsed);
                    else if (parsed && Array.isArray(parsed.lots)) {
                        setLots(parsed.lots);
                        if (Array.isArray(parsed.accountNicknames)) setAccountNicknames(parsed.accountNicknames);
                    }
                } catch (error) { console.error("Failed to parse JSON"); }
            };
            reader.readAsText(file);
        };

        const generateTreemap = (items, x = 0, y = 0, w = 100, h = 100, isHorizontal = true) => {
            if (items.length === 0) return [];
            if (items.length === 1) return [{ ...items[0], x, y, w, h }];
            let sum = items.reduce((s, i) => s + i.currentValueKRW, 0);
            if (sum === 0) return items.map(i => ({...i, x, y, w:0, h:0}));

            let halfSum = 0, splitIndex = 0;
            for (let i = 0; i < items.length; i++) {
                halfSum += items[i].currentValueKRW;
                if (halfSum >= sum / 2) { splitIndex = i; break; }
            }
            if (splitIndex === items.length - 1 && items.length > 1) splitIndex = items.length - 2;

            let leftItems = items.slice(0, splitIndex + 1);
            let rightItems = items.slice(splitIndex + 1);
            let leftRatio = leftItems.reduce((s, i) => s + i.currentValueKRW, 0) / sum;

            if (isHorizontal) {
                let leftW = w * leftRatio;
                return [
                    ...generateTreemap(leftItems, x, y, leftW, h, !isHorizontal),
                    ...generateTreemap(rightItems, x + leftW, y, w - leftW, h, !isHorizontal)
                ];
            } else {
                let topH = h * leftRatio;
                return [
                    ...generateTreemap(leftItems, x, y, w, topH, !isHorizontal),
                    ...generateTreemap(rightItems, x, y + topH, w, h - topH, !isHorizontal)
                ];
            }
        };

        const treemapNodes = useMemo(() => generateTreemap([...consolidatedPortfolio]), [consolidatedPortfolio]);

        const formatNumber = (num, currency) => {
            if (!num) return '0';
            const decimals = currency === 'KRW' || currency === 'JPY' ? 0 : 2;
            return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: decimals, minimumFractionDigits: decimals }).format(num);
        };

        const MARKET_TOGGLE_LABELS = { ALL: '전체', US: '미장', KR: '국장', JP: '일장' };
        const getSubMarketLabel = (item) => {
            if (item.market === 'KR') return item.symbol?.endsWith('.KQ') ? '코스닥' : '코스피';
            if (item.market === 'JP') return '일장';
            return '미장';
        };

        const getHeatmapColor = (changePercent) => {
            const intensity = Math.min(Math.abs(changePercent) / 10, 1);
            const alpha = 0.2 + (intensity * 0.8);
            return changePercent >= 0 ? `rgba(34, 197, 94, ${alpha})` : `rgba(239, 68, 68, ${alpha})`;
        };

        return (
            <div className="flex flex-col h-screen bg-slate-950 text-slate-200 font-sans overflow-hidden">
                
                {/* 메인 콘텐츠 영역: 공통 계좌/종목 편집 영역(좌측) + 페이지별 콘텐츠(우측) */}
                <div className={`flex flex-1 overflow-hidden relative ${isVerticalLayout ? 'flex-col' : 'flex-row'}`}>
                    
                    {/* [공통 영역] 좌측: 계좌 관리 및 보유 종목 편집 리스트 */}
                    <div className={`${isVerticalLayout ? 'w-full h-[50%]' : 'w-[50%]'} flex flex-col border-r border-slate-800 overflow-hidden shrink-0`}>
                        <div className="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                <span>📈</span> Global Portfolio
                            </h1>
                            <div className="flex items-center gap-2">
                                <button onClick={handleExport} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-md transition-colors" title="Download JSON"><DownloadIcon /></button>
                                <button onClick={() => fileInputRef.current.click()} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-md transition-colors" title="Upload JSON"><UploadIcon /></button>
                                <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                            </div>
                        </div>

                        <div className="px-4 py-2.5 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-2 overflow-x-auto flex-1 mr-2">
                                <button onClick={() => setSelectedAccount('ALL')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${selectedAccount === 'ALL' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>전체 계좌</button>
                                {accountNicknames.map(acc => (
                                    <div key={acc} className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${selectedAccount === acc ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>
                                        <button onClick={() => setSelectedAccount(acc)} className="focus:outline-none">{acc}</button>
                                        <button 
                                            onClick={(e) => handleDeleteAccount(acc, e)}
                                            className="w-4 h-4 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white text-slate-400 transition-colors ml-1"
                                            title="계좌 삭제 (-)"
                                        >
                                            <MinusIcon />
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <button 
                                onClick={() => setShowAccountManager(!showAccountManager)} 
                                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors flex items-center gap-1"
                            >
                                <PlusIcon /> 계좌 추가
                            </button>
                        </div>

                        {showAccountManager && (
                            <div className="px-4 py-3 bg-slate-900 border-b border-slate-800 flex gap-2 shrink-0 animate-fadeIn">
                                <input 
                                    type="text" 
                                    placeholder="새 계좌 이름 입력"
                                    value={newAccountInput}
                                    onChange={(e) => setNewAccountInput(e.target.value)}
                                    className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500"
                                />
                                <button onClick={handleAddAccount} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium">추가</button>
                            </div>
                        )}

                        <div className="p-4 border-b border-slate-800 relative z-[99] shrink-0">
                            <div className="flex gap-2 mb-3">
                                {['ALL', 'US', 'KR', 'JP'].map(market => (
                                    <button key={market} onClick={() => setMarketFilter(market)} className={`px-3 py-1 rounded-full text-xs font-medium transition-colors ${marketFilter === market ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                        {MARKET_TOGGLE_LABELS[market]}
                                    </button>
                                ))}
                            </div>
                            <div className="relative">
                                <SearchIcon className="absolute left-3 top-3 text-slate-400" />
                                <input
                                    type="text"
                                    placeholder="종목명, 키워드 또는 티커 검색..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-blue-500"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                {searchQuery && (
                                    <div className="absolute top-full left-0 w-full mt-2 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl overflow-hidden max-h-72 overflow-y-auto z-[999]">
                                        {isSearching ? (
                                            <div className="p-4 text-center text-slate-400 text-sm">Searching...</div>
                                        ) : searchResults.length > 0 ? (
                                            searchResults.map(result => (
                                                <div key={result.symbol} className="p-3 hover:bg-slate-700 cursor-pointer flex justify-between items-center border-b border-slate-700/50" onClick={() => setAddLotModal(result)}>
                                                    <div className="flex flex-col pr-2">
                                                        <span className="font-bold text-white text-sm">{result.name}</span>
                                                        <span className="text-xs text-slate-400 mt-0.5">{result.searchKeywords?.[1] || result.symbol}</span>
                                                    </div>
                                                    <span className="text-xs font-mono px-2 py-1 bg-slate-900 rounded text-blue-400 border border-slate-700 shrink-0">{result.symbol}</span>
                                                </div>
                                            ))
                                        ) : (<div className="p-4 text-center text-slate-400 text-sm">No results found</div>)}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 relative z-0">
                            <div className="flex justify-between items-center mb-4 sticky top-0 bg-slate-950 py-2 z-10">
                                <h2 className="text-sm font-semibold text-slate-400">Holdings ({selectedAccount})</h2>
                                <div className="flex bg-slate-800 rounded-lg p-1">
                                    <button onClick={() => setDisplayCurrency('KRW')} className={`px-2.5 py-0.5 text-xs rounded font-medium ${displayCurrency === 'KRW' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>KRW</button>
                                    <button onClick={() => setDisplayCurrency('FOREIGN')} className={`px-2.5 py-0.5 text-xs rounded font-medium ${displayCurrency === 'FOREIGN' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>Foreign</button>
                                </div>
                            </div>

                            {consolidatedPortfolio.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-36 text-slate-500 text-sm">
                                    <p>No stocks in portfolio yet.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {consolidatedPortfolio.map(item => (
                                        <div key={item.symbol} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between hover:border-slate-700 transition-colors">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-white text-sm">{item.symbol}</span>
                                                    <span className="text-[10px] text-slate-400 px-1 py-0.5 bg-slate-800 rounded">{getSubMarketLabel(item)}</span>
                                                </div>
                                                <div className="flex gap-3 mt-1 text-xs text-slate-400">
                                                    <div>Qty: {formatNumber(item.totalQuantity, 'USD')}</div>
                                                    <div>Avg: {displayCurrency === 'KRW' ? `₩${formatNumber(item.avgPriceKRW, 'KRW')}` : `${getCurrencySymbol(item.currency)}${formatNumber(item.avgPriceForeign, item.currency)}`}</div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-semibold text-sm">
                                                    {displayCurrency === 'KRW' ? `₩${formatNumber(item.currentValueKRW, 'KRW')}` : `${getCurrencySymbol(item.currency)}${formatNumber(item.totalQuantity * item.currentPriceForeign, item.currency)}`}
                                                </div>
                                                <div className={`text-xs font-medium ${item.returnPercent >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                    {item.returnPercent > 0 ? '+' : ''}{item.returnPercent.toFixed(2)}%
                                                </div>
                                                <button onClick={() => setEditModalSymbol(item.symbol)} className="mt-1 text-[10px] text-slate-400 hover:text-white bg-slate-800 px-2 py-0.5 rounded flex items-center gap-1 ml-auto">
                                                    <EditIcon /> Edit
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 우측: 선택된 페이지 콘텐츠 (0: 대시보드/포트폴리오 상세, 1: 배당금 대시보드, 2: 히트맵) */}
                    <div className={`${isVerticalLayout ? 'w-full h-[50%]' : 'w-[50%]'} flex flex-col bg-slate-950 overflow-hidden`}>
                        {currentPage === 0 && (
                            <div className="flex-1 p-6 flex flex-col justify-center overflow-y-auto">
                                <h2 className="text-2xl font-bold text-white mb-6">📊 포트폴리오 요약</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                                        <div className="text-slate-400 text-xs mb-1">총 평가금액</div>
                                        <div className="text-xl font-bold text-white">₩{formatNumber(consolidatedPortfolio.reduce((acc, cur) => acc + cur.currentValueKRW, 0), 'KRW')}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                                        <div className="text-slate-400 text-xs mb-1">총 투자원금</div>
                                        <div className="text-xl font-bold text-white">₩{formatNumber(consolidatedPortfolio.reduce((acc, cur) => acc + cur.totalInvestedKRW, 0), 'KRW')}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                                        <div className="text-slate-400 text-xs mb-1">총 평가손익</div>
                                        <div className={`text-xl font-bold ${consolidatedPortfolio.reduce((acc, cur) => acc + cur.returnKRW, 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                            ₩{formatNumber(consolidatedPortfolio.reduce((acc, cur) => acc + cur.returnKRW, 0), 'KRW')}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                                        <div className="text-slate-400 text-xs mb-1">예상 연간 배당금</div>
                                        <div className="text-xl font-bold text-blue-400">₩{formatNumber(dividendStats.annual, 'KRW')}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentPage === 1 && (
                            <div className="flex-1 p-6 overflow-y-auto bg-slate-950 flex flex-col">
                                <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                    <span>💰</span> Dividend Dashboard ({selectedAccount})
                                </h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                                        <div className="text-slate-400 text-xs mb-1">최근 12개월 배당 합계</div>
                                        <div className="text-xl font-bold text-green-400">₩{formatNumber(dividendStats.annual, 'KRW')}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                                        <div className="text-slate-400 text-xs mb-1">월 평균 배당금</div>
                                        <div className="text-xl font-bold text-blue-400">₩{formatNumber(dividendStats.monthly, 'KRW')}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                                        <div className="text-slate-400 text-xs mb-1">평균 배당수익률</div>
                                        <div className="text-xl font-bold text-yellow-400">{dividendStats.avgYield.toFixed(2)}%</div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex-1 flex flex-col">
                                    <div className="p-4 border-b border-slate-800 font-semibold text-sm">보유 종목별 배당 상세</div>
                                    <div className="divide-y divide-slate-800 overflow-y-auto flex-1">
                                        {consolidatedPortfolio.length === 0 ? (
                                            <div className="p-6 text-center text-slate-500 text-sm">종목이 없습니다.</div>
                                        ) : (
                                            consolidatedPortfolio.map(item => (
                                                <div key={item.symbol} className="p-4 flex items-center justify-between hover:bg-slate-800/50">
                                                    <div>
                                                        <div className="font-bold text-white">{item.symbol} <span className="text-xs text-slate-400 font-normal">({item.name})</span></div>
                                                        <div className="text-xs text-slate-400 mt-0.5">수량: {formatNumber(item.totalQuantity, 'USD')}주</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-sm font-semibold text-green-400">+₩{formatNumber(item.annualDividendKRW, 'KRW')} /년</div>
                                                        <div className="text-xs text-slate-400">배당률: {item.dividendYield?.toFixed(2)}%</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentPage === 2 && (
                            <div className="flex-1 p-6 bg-slate-950 flex flex-col overflow-hidden">
                                <h2 className="text-2xl font-bold text-white mb-4">🗺️ Market Heatmap</h2>
                                <div className="flex-1 w-full bg-slate-900 rounded-xl overflow-hidden relative shadow-inner border border-slate-800">
                                    {treemapNodes.length > 0 ? treemapNodes.map(node => (
                                        <div 
                                            key={node.symbol}
                                            className="absolute border border-slate-950 p-2 flex flex-col justify-center items-center overflow-hidden transition-all duration-300 hover:z-10"
                                            style={{ left: `${node.x}%`, top: `${node.y}%`, width: `${node.w}%`, height: `${node.h}%`, backgroundColor: getHeatmapColor(node.dailyChangePercent) }}
                                        >
                                            <span className="font-bold text-white text-xs drop-shadow">{node.symbol}</span>
                                            <span className="text-white/90 text-[10px] drop-shadow">{node.dailyChangePercent >= 0 ? '+' : ''}{node.dailyChangePercent?.toFixed(2)}%</span>
                                        </div>
                                    )) : (
                                        <div className="w-full h-full flex items-center justify-center text-slate-600 text-sm">No Data</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>

                {/* 하단 네비게이션 및 모바일 가로/세로 전환 버튼 (< o o o > 우측 배치) */}
                <div className="py-3 bg-slate-900 border-t border-slate-800 flex items-center justify-center gap-4 shrink-0 relative">
                    <button 
                        onClick={() => setCurrentPage(prev => (prev > 0 ? prev - 1 : 2))} 
                        className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm transition-colors"
                    >
                        &lt;
                    </button>
                    <div className="flex items-center gap-3">
                        {[0, 1, 2].map(idx => (
                            <button
                                key={idx}
                                onClick={() => setCurrentPage(idx)}
                                className={`w-3 h-3 rounded-full transition-all ${currentPage === idx ? 'bg-blue-500 scale-125' : 'bg-slate-700 hover:bg-slate-600'}`}
                                title={`Page ${idx + 1}`}
                            />
                        ))}
                    </div>
                    <button 
                        onClick={() => setCurrentPage(prev => (prev < 2 ? prev + 1 : 0))} 
                        className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm transition-colors"
                    >
                        &gt;
                    </button>

                    {/* 모바일 화면 전환 토글 버튼 (< o o o > 우측에 위치) */}
                    <button 
                        onClick={() => setIsVerticalLayout(prev => !prev)}
                        className={`absolute right-4 p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors ${isVerticalLayout ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                        title="가로/세로 레이아웃 전환"
                    >
                        <LayoutToggleIcon />
                        <span className="hidden sm:inline">{isVerticalLayout ? '세로모드' : '가로모드'}</span>
                    </button>
                </div>

                {addLotModal && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                        <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h3 className="text-xl font-bold text-white">{addLotModal.symbol}</h3>
                                    <p className="text-slate-400 text-sm">{addLotModal.name}</p>
                                </div>
                                <button onClick={() => setAddLotModal(null)} className="text-slate-400 hover:text-white"><CloseIcon /></button>
                            </div>
                            <form onSubmit={handleAddLot} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-1">Account</label>
                                    <select name="account" defaultValue={selectedAccount === 'ALL' ? (accountNicknames[0] || '기본 계좌') : selectedAccount} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white">
                                        {accountNicknames.map(acc => <option key={acc} value={acc}>{acc}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-1">Buy Date</label>
                                    <input type="date" name="buyDate" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-1">Quantity</label>
                                    <input type="number" name="quantity" step="any" min="0.0001" placeholder="10" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-1">Average Price (KRW ₩)</label>
                                    <input type="number" name="priceKRW" step="any" min="1" placeholder="150000" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white" required />
                                </div>
                                <div className="pt-4 flex justify-end gap-3">
                                    <button type="button" onClick={() => setAddLotModal(null)} className="px-4 py-2 text-slate-300 text-sm">Cancel</button>
                                    <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">Add</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {editModalSymbol && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                        <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-xl font-bold text-white">Edit Lots: <span className="text-blue-400">{editModalSymbol}</span></h3>
                                <button onClick={() => setEditModalSymbol(null)} className="text-slate-400 hover:text-white"><CloseIcon /></button>
                            </div>
                            <div className="overflow-y-auto flex-1 space-y-3 pr-2">
                                {filteredLots.filter(l => l.symbol === editModalSymbol).map(lot => (
                                    <div key={lot.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-wrap gap-4 items-end">
                                        <div className="flex-1 min-w-[110px]">
                                            <label className="block text-xs text-slate-500 mb-1">Account</label>
                                            <select value={lot.account || accountNicknames[0]} onChange={(e) => handleUpdateLot(lot.id, 'account', e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
                                                {accountNicknames.map(acc => <option key={acc} value={acc}>{acc}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1 min-w-[90px]">
                                            <label className="block text-xs text-slate-500 mb-1">Qty</label>
                                            <input type="number" value={lot.quantity} onChange={(e) => handleUpdateLot(lot.id, 'quantity', parseFloat(e.target.value) || 0)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm text-white" />
                                        </div>
                                        <div className="flex-1 min-w-[110px]">
                                            <label className="block text-xs text-slate-500 mb-1">Price (KRW)</label>
                                            <input type="number" value={lot.avgPriceKRW} onChange={(e) => handleUpdateLot(lot.id, 'avgPriceKRW', parseFloat(e.target.value) || 0)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm text-white" />
                                        </div>
                                        <button onClick={() => handleDeleteLot(lot.id)} className="p-2 bg-red-950/50 text-red-400 rounded"><TrashIcon /></button>
                                    </div>
                                ))}
                            </div>
                            <div className="pt-4 mt-4 border-t border-slate-800 flex justify-between">
                                <button onClick={() => handleMergeLots(editModalSymbol)} className="px-4 py-2 bg-slate-800 text-slate-300 text-sm rounded-lg">Merge All</button>
                                <button onClick={() => setEditModalSymbol(null)} className="px-6 py-2 bg-blue-600 text-white text-sm rounded-lg">Done</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
