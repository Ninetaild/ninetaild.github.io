<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>신령님 이미지 조각기 V5 - 자유형 레이어 복구</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; line-height: 1.6; background: #f0f2f0; color: #333; }
        .controls { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        h2 { color: #0a5c0a; border-bottom: 2px solid #0a5c0a; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; display: flex; align-items: center; flex-wrap: wrap; }
        label { width: 220px; font-weight: bold; font-size: 0.9em; }
        input[type="number"], input[type="text"], select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 120px; }
        .btn-area { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #processBtn { background: #0a5c0a; color: white; }
        #downloadAllBtn { background: #2c4c3c; color: white; display: none; }
        #resultContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .result-item { background: white; padding: 10px; border-radius: 8px; text-align: center; }
        canvas { max-width: 100%; height: auto; border: 1px solid #eee; background-color: #1a2e24; background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
        .file-info { font-size: 0.75em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="controls">
    <h2>🌿 신령님 이미지 조각기 V5 (자유형 레이어)</h2>
    <div class="control-group">
        <label>이미지 업로드:</label>
        <input type="file" id="upload" accept="image/*" multiple>
    </div>
    <div class="control-group">
        <label>기본 크기 (1280 기준):</label>
        <select id="resizeOption">
            <option value="384">일러스트 (30% - 384px)</option>
            <option value="256" selected>일반 조각 (20% - 256px)</option>
        </select>
    </div>
    <div class="control-group">
        <label>이미지/레이어 투명도 (%):</label>
        <input type="number" id="imgOpacity" value="85" style="width:60px;">
        <span style="margin: 0 10px;">/</span>
        <input type="number" id="layerOpacity" value="5" style="width:60px;">
    </div>
    <div class="control-group">
        <label>레이어 색상 (#):</label>
        <input type="text" id="layerColor" value="#333333">
    </div>
    <div class="btn-area">
        <button id="processBtn">정밀 조각 실행</button>
        <button id="downloadAllBtn">ZIP 다운로드</button>
    </div>
</div>

<div id="resultContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
    const upload = document.getElementById('upload');
    const resultContainer = document.getElementById('resultContainer');
    const processBtn = document.getElementById('processBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    let processedFiles = [];

    processBtn.addEventListener('click', async () => {
        const files = upload.files;
        if (files.length === 0) return alert('이미지를 업로드해주세요.');
        resultContainer.innerHTML = '';
        processedFiles = [];
        
        const config = {
            imgOp: document.getElementById('imgOpacity').value / 100,
            lCol: document.getElementById('layerColor').value,
            lOp: document.getElementById('layerOpacity').value / 100,
            targetWidth: parseInt(document.getElementById('resizeOption').value)
        };

        for (let file of files) {
            await processFile(file, config);
        }
        downloadAllBtn.style.display = 'inline-block';
    });

    function processFile(file, cfg) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // 1. 비율 및 크기 계산
                    let finalW = cfg.targetWidth;
                    let finalH = img.height * (cfg.targetWidth / img.width);
                    if (finalH > 350) {
                        const hRatio = 350 / finalH;
                        finalW *= hRatio;
                        finalH = 350;
                    }

                    // 2. 임시 캔버스에서 리사이징된 픽셀 데이터 추출
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = Math.ceil(finalW);
                    tempCanvas.height = Math.ceil(finalH);
                    tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                    const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                    const data = imgData.data;

                    // 3. 고정 캔버스(1280x720) 설정
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const xPos = (1280 - tempCanvas.width) / 2;
                    const yPos = (720 - tempCanvas.height) / 2;

                    // 4. 원본 이미지 그리기
                    ctx.globalAlpha = cfg.imgOp;
                    ctx.drawImage(img, xPos, yPos, tempCanvas.width, tempCanvas.height);

                    // 5. 정밀 픽셀 스캔 및 자유형 레이어 생성
                    ctx.globalAlpha = cfg.lOp;
                    ctx.fillStyle = cfg.lCol;
                    
                    let minX = tempCanvas.width, minY = tempCanvas.height, maxX = 0, maxY = 0;
                    let hasPixels = false;

                    for (let y = 0; y < tempCanvas.height; y++) {
                        for (let x = 0; x < tempCanvas.width; x++) {
                            const alpha = data[(y * tempCanvas.width + x) * 4 + 3];
                            if (alpha > 0) {
                                hasPixels = true;
                                if (x < minX) minX = x; if (x > maxX) maxX = x;
                                if (y < minY) minY = y; if (y > maxY) maxY = y;

                                // 도트 지점에 1px 더 크게 사각형 레이어 (자유형 구현)
                                ctx.fillRect(xPos + x - 0.5, yPos + y - 0.5, 2, 2);
                            }
                        }
                    }

                    // 6. 전체 범위 (x1-1 ~ x2+1) 사각형 레이어 추가
                    if (hasPixels) {
                        ctx.fillRect(xPos + minX - 1, yPos + minY - 1, (maxX - minX) + 3, (maxY - minY) + 3);
                    }

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'result-item';
                    itemDiv.appendChild(canvas);
                    resultContainer.appendChild(itemDiv);
                    processedFiles.push({ canvas, name: file.name });
                    resolve();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    downloadAllBtn.addEventListener('click', () => {
        const zip = new JSZip();
        processedFiles.forEach(item => {
            const dataUrl = item.canvas.toDataURL('image/png');
            zip.file(`shiryeognim_${item.name}`, dataUrl.split(',')[1], {base64: true});
        });
        zip.generateAsync({type:"blob"}).then(c => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(c);
            a.download = "shiryeognim_perfect_pieces.zip";
            a.click();
        });
    });
</script>
</body>
</html>
