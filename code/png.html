<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PNG Auto Blur Tool (Preset)</title>

<style>
body{
    font-family: sans-serif;
    padding:40px;
    background:#111;
    color:white;
}

.controls{
    margin-bottom:15px;
}

label{
    margin-right:10px;
}

input, select{
    margin-right:20px;
    padding:5px;
}

canvas{
    margin-top:20px;
    border:1px solid #444;
    max-width:100%;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="controls">

<label>프리셋</label>
<select id="preset">
    <option value="general">일반 연상</option>
    <option value="emotion">감정 마무리</option>
</select>

<br><br>

<label>Blur</label>
<input type="number" id="blur" step="0.1" value="0.6">

<label>Brightness</label>
<input type="number" id="brightness" step="1" value="-5">

<label>Saturation</label>
<input type="number" id="saturation" step="1" value="-12">

</div>

<input type="file" id="upload" accept="image/png">

<br>
<canvas id="canvas"></canvas>
<br>
<button id="download">다운로드</button>

<script>

// 프리셋
const presets = {
    general:{
        blur:0.6,
        brightness:-5,
        saturation:-12
    },
    emotion:{
        blur:0.25,
        brightness:-2,
        saturation:-5
    }
};

const blurInput = document.getElementById('blur');
const brightInput = document.getElementById('brightness');
const satInput = document.getElementById('saturation');

document.getElementById('preset').addEventListener('change', e=>{

    const p = presets[e.target.value];

    blurInput.value = p.blur;
    brightInput.value = p.brightness;
    satInput.value = p.saturation;
});

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

document.getElementById('upload').addEventListener('change', e=>{

    const file = e.target.files[0];
    const img = new Image();

    img.onload = ()=>{

        canvas.width = img.width;
        canvas.height = img.height;

        const blurStrength = parseFloat(blurInput.value);
        const brightness = parseFloat(brightInput.value);
        const saturation = parseFloat(satInput.value);

        ctx.filter = `
            blur(${blurStrength}px)
            brightness(${100+brightness}%)
            saturate(${100+saturation}%)
        `;

        ctx.drawImage(img,0,0);
        ctx.filter = 'none';
    };

    img.src = URL.createObjectURL(file);
});

document.getElementById('download').addEventListener('click', ()=>{

    const link = document.createElement('a');
    link.download = `blur_${Date.now()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();

});

</script>

</body>
</html>
