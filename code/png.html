<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PNG Auto Blur Tool (Pro)</title>

<style>
body{
    font-family: sans-serif;
    padding:40px;
    background:#111;
    color:white;
}
canvas{
    margin-top:20px;
    border:1px solid #444;
    max-width:100%;
}
button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>PNG 자동 블러 + 밝기 + 투명 보호 + 여백 제거</h2>

<input type="file" id="upload" accept="image/png">

<br>
<canvas id="canvas"></canvas>
<br>
<button id="download">다운로드</button>

<script>

// ⭐ 튜닝 가능한 값
const blurStrength = 2;     
const brightness = -7;      
const thinThreshold = 2;    

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

document.getElementById('upload').addEventListener('change', e=>{
    const file = e.target.files[0];
    const img = new Image();

    img.onload = ()=>{

        canvas.width = img.width;
        canvas.height = img.height;

        // ⭐ 원본 알파 저장
        const alphaMask = getAlphaMask(img);

        // ⭐ 블러 + 밝기
        ctx.filter = `blur(${blurStrength}px) brightness(${100+brightness}%)`;
        ctx.drawImage(img,0,0);
        ctx.filter = 'none';

        // ⭐ 얇은 선 보호
        protectThinEdges(img);

        // ⭐ 투명 영역 복구 (halo 방지 핵심)
        restoreAlpha(alphaMask);

        // ⭐ 자동 여백 제거 (편집 속도 상승)
        trimCanvas();
    };

    img.src = URL.createObjectURL(file);
});


// =============================
// 투명 마스크 저장
// =============================

function getAlphaMask(img){

    const temp = document.createElement('canvas');
    temp.width = img.width;
    temp.height = img.height;
    const tctx = temp.getContext('2d');
    tctx.drawImage(img,0,0);

    const imgData = tctx.getImageData(0,0,temp.width,temp.height);
    return imgData.data;
}


// =============================
// 투명 복구
// =============================

function restoreAlpha(alphaData){

    const output = ctx.getImageData(0,0,canvas.width,canvas.height);
    const out = output.data;

    for(let i=0; i<out.length; i+=4){

        // 원본이 완전 투명이면 그대로 유지
        if(alphaData[i+3] === 0){
            out[i+3] = 0;
        }
    }

    ctx.putImageData(output,0,0);
}


// =============================
// 얇은 선 보호
// =============================

function protectThinEdges(img){

    const temp = document.createElement('canvas');
    temp.width = img.width;
    temp.height = img.height;
    const tctx = temp.getContext('2d');
    tctx.drawImage(img,0,0);

    const imgData = tctx.getImageData(0,0,temp.width,temp.height);
    const data = imgData.data;

    const output = ctx.getImageData(0,0,canvas.width,canvas.height);
    const out = output.data;

    const w = temp.width;
    const h = temp.height;

    for(let y=1; y<h-1; y++){
        for(let x=1; x<w-1; x++){

            const i = (y*w + x)*4;
            const alpha = data[i+3];

            if(alpha === 0) continue;

            let neighbors = 0;

            for(let dy=-1; dy<=1; dy++){
                for(let dx=-1; dx<=1; dx++){

                    if(dx===0 && dy===0) continue;

                    const ni = ((y+dy)*w + (x+dx))*4;
                    if(data[ni+3] > 0) neighbors++;
                }
            }

            if(neighbors <= thinThreshold){

                out[i]   = data[i];
                out[i+1] = data[i+1];
                out[i+2] = data[i+2];
                out[i+3] = data[i+3];
            }
        }
    }

    ctx.putImageData(output,0,0);
}



// =============================
// ⭐ 자동 여백 제거 (진짜 강력 추천 기능)
// =============================

function trimCanvas(){

    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const data = imgData.data;

    let top=null, bottom=null, left=null, right=null;

    for(let y=0; y<canvas.height; y++){
        for(let x=0; x<canvas.width; x++){

            const alpha = data[(y*canvas.width + x)*4 + 3];

            if(alpha !== 0){

                if(top===null) top=y;
                bottom=y;

                if(left===null || x<left) left=x;
                if(right===null || x>right) right=x;
            }
        }
    }

    if(top===null) return;

    const width = right-left;
    const height = bottom-top;

    const trimmed = ctx.getImageData(left, top, width, height);

    canvas.width = width;
    canvas.height = height;

    ctx.putImageData(trimmed,0,0);
}



// =============================
// 다운로드
// =============================

document.getElementById('download').addEventListener('click', ()=>{

    const link = document.createElement('a');
    link.download = "blurred.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

});

</script>

</body>
</html>
