<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>신령님 이미지 조각기 - V4 (고정 캔버스)</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; line-height: 1.6; background: #f0f2f0; color: #333; }
        .controls { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        h2 { color: #0a5c0a; border-bottom: 2px solid #0a5c0a; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; display: flex; align-items: center; flex-wrap: wrap; }
        label { width: 220px; font-weight: bold; font-size: 0.9em; }
        input[type="number"], input[type="text"], select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 120px; }
        .btn-area { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #processBtn { background: #0a5c0a; color: white; }
        #downloadAllBtn { background: #2c4c3c; color: white; display: none; }
        #resultContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .result-item { background: white; padding: 10px; border-radius: 8px; text-align: center; }
        canvas { max-width: 100%; height: auto; border: 1px solid #eee; background-color: #1a2e24; background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
        .file-info { font-size: 0.75em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="controls">
    <h2>🌿 신령님 이미지 조각기 V4</h2>
    <div class="control-group">
        <label>이미지 업로드:</label>
        <input type="file" id="upload" accept="image/*" multiple>
    </div>
    <div class="control-group">
        <label>기본 크기 (1280 기준):</label>
        <select id="resizeOption">
            <option value="384">일러스트 (30% - 384px)</option>
            <option value="256" selected>일반 조각 (20% - 256px)</option>
        </select>
    </div>
    <div class="control-group">
        <label>이미지/레이어 투명도 (%):</label>
        <input type="number" id="imgOpacity" value="85" style="width:60px;">
        <span style="margin: 0 10px;">/</span>
        <input type="number" id="layerOpacity" value="8" style="width:60px;">
    </div>
    <div class="control-group">
        <label>레이어 색상 (#):</label>
        <input type="text" id="layerColor" value="#0a5c0a">
    </div>
    <div class="btn-area">
        <button id="processBtn">1280x720 조각 생성</button>
        <button id="downloadAllBtn">ZIP 다운로드</button>
    </div>
</div>

<div id="resultContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
    const upload = document.getElementById('upload');
    const resultContainer = document.getElementById('resultContainer');
    const processBtn = document.getElementById('processBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    let processedFiles = [];

    processBtn.addEventListener('click', async () => {
        const files = upload.files;
        if (files.length === 0) return alert('파일을 먼저 올려주세요.');
        resultContainer.innerHTML = '';
        processedFiles = [];
        
        const config = {
            imgOp: document.getElementById('imgOpacity').value / 100,
            lCol: document.getElementById('layerColor').value,
            lOp: document.getElementById('layerOpacity').value / 100,
            targetWidth: parseInt(document.getElementById('resizeOption').value)
        };

        for (let file of files) {
            await processFile(file, config);
        }
        downloadAllBtn.style.display = 'inline-block';
    });

    function processFile(file, cfg) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 핵심: 칠판 해상도(1280x720)에 고정
                    canvas.width = 1280;
                    canvas.height = 720;

                    // 1. 이미지 실제 비율 계산
                    let finalW = cfg.targetWidth;
                    let finalH = img.height * (cfg.targetWidth / img.width);

                    // 2. 세로가 너무 긴 이미지(페트병 등) 처리: 높이 최대 350px 제한
                    if (finalH > 350) {
                        const hRatio = 350 / finalH;
                        finalW *= hRatio;
                        finalH = 350;
                    }

                    // 3. 투명 배경 위에 원본 그리기 (85%)
                    const xPos = (1280 - finalW) / 2;
                    const yPos = (720 - finalH) / 2;
                    
                    ctx.globalAlpha = cfg.imgOp;
                    ctx.drawImage(img, xPos, yPos, finalW, finalH);

                    // 4. 정밀 레이어 덮기 (해당 이미지 영역만)
                    const imgData = ctx.getImageData(xPos, yPos, finalW, finalH);
                    const data = imgData.data;

                    ctx.globalAlpha = cfg.lOp;
                    ctx.fillStyle = cfg.lCol;

                    for (let y = 0; y < finalH; y++) {
                        for (let x = 0; x < finalW; x++) {
                            if (data[(y * Math.floor(finalW) + x) * 4 + 3] > 0) {
                                ctx.fillRect(xPos + x, yPos + y, 1, 1);
                            }
                        }
                    }
                    // 전체 영역 +1px 레이어 (번짐 효과)
                    ctx.fillRect(xPos - 1, yPos - 1, finalW + 2, finalH + 2);

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'result-item';
                    itemDiv.appendChild(canvas);
                    resultContainer.appendChild(itemDiv);
                    processedFiles.push({ canvas, name: file.name });
                    resolve();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    downloadAllBtn.addEventListener('click', () => {
        const zip = new JSZip();
        processedFiles.forEach(item => {
            const dataUrl = item.canvas.toDataURL('image/png');
            zip.file(`shiryeognim_${item.name}`, dataUrl.split(',')[1], {base64: true});
        });
        zip.generateAsync({type:"blob"}).then(c => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(c);
            a.download = "shiryeognim_fixed_canvas.zip";
            a.click();
        });
    });
</script>
</body>
</html>
